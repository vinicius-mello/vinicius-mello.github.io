sort ¦ list ¦ sort(xs), sort(xs, key) ¦ Ordenação (opcionalmente por chave). ¦ Sorting (optionally by key). ¦ sort([3, 1, 2]) ;; sort(1..10, k -> -k) ¦
min ¦ list ¦ min(xs), min(a, b, …) ¦ Mínimo. ¦ Minimum. ¦ min(3, 1/2, pi) ¦
max ¦ list ¦ max(xs), max(a, b, …) ¦ Máximo. ¦ Maximum. ¦ max(map(1..20, numdivisors)) ¦
zip ¦ list ¦ zip(xs, ys, …) ¦ Lista de tuplas. ¦ List of tuples. ¦ zip(1..3, ["a", "b", "c"]) ¦
enumerate ¦ list ¦ enumerate(xs) ¦ Pares (índice, elemento), índices a partir de 1. ¦ (index, element) pairs, 1-based. ¦ enumerate(["a", "b"]) ¦
concat ¦ list ¦ concat(xs, ys, …) ¦ Concatenação (também xs + ys). ¦ Concatenation (also xs + ys). ¦ concat([1], [2, 3]) ¦
flatten ¦ list ¦ flatten(xs) ¦ Achata listas aninhadas. ¦ Flattens nested lists. ¦ flatten([[1, [2]], [3]]) ¦
unique ¦ list ¦ unique(xs) ¦ Remove repetidos (mantém a ordem). ¦ Removes duplicates (keeps order). ¦ unique(map(1..20, k -> k % 4)) ¦
count ¦ list ¦ count(xs, p) ¦ Quantos elementos satisfazem p (ou são iguais a p). ¦ How many elements satisfy p (or equal p). ¦ count(1..1000, isprime) ¦
all ¦ list ¦ all(xs, p) ¦ Todos satisfazem p? ¦ Do all satisfy p? ¦ all(primes(100), isodd) ¦
any ¦ list ¦ any(xs, p) ¦ Algum satisfaz p? ¦ Does any satisfy p? ¦ any(1..10, issquare) ¦
find ¦ list ¦ find(xs, p) ¦ Primeiro elemento que satisfaz p, ou (). ¦ First element satisfying p, or (). ¦ find(1..100, k -> k^2 > 500) ¦
indexof ¦ list ¦ indexof(xs, v) ¦ Posição de v (a partir de 1), ou 0. ¦ Position of v (1-based), or 0. ¦ indexof(primes(50), 13) ¦
iterate ¦ list ¦ iterate(f, x, n) ¦ [x, f(x), f(f(x)), …] com n aplicações. ¦ [x, f(x), f(f(x)), …] with n applications. ¦ iterate(x -> x^2 + 1, 0, 5) ¦
nest ¦ list ¦ nest(f, x, n) ¦ f aplicada n vezes. ¦ f applied n times. ¦ nest(x -> 1 + 1/x, 1, 20) ¦
fixedpoint ¦ list ¦ fixedpoint(f, x) ¦ Itera f até o valor se repetir. ¦ Iterates f until the value repeats. ¦ fixedpoint(n -> sum(digits(n)), 2^100) ¦
while ¦ list ¦ while(cond, f, x) ¦ Aplica f enquanto cond(x) for verdadeiro. ¦ Applies f while cond(x) is true. ¦ while(n -> n > 1, n -> if iseven(n) then n // 2 else 3n + 1, 27) ¦
table ¦ list ¦ table(f, xs, ys, …) ¦ Tabela aninhada de f(x, y, …). ¦ Nested table of f(x, y, …). ¦ table((a, b) -> gcd(a, b), 1..5, 1..5) ¦
tuple ¦ list ¦ tuple(a, b, …), (a, b) ¦ Tupla. ¦ Tuple. ¦ tuple(1, 2) ¦
list ¦ list ¦ list(x) ¦ Converte tupla ou string em lista. ¦ Converts a tuple or string to a list. ¦ list("abc") ¦
apply ¦ list ¦ apply(f, xs) ¦ Chama f com os elementos de xs como argumentos. ¦ Calls f with the elements of xs as arguments. ¦ apply(gcd, [12, 18]) ¦
id ¦ list ¦ id(x) ¦ Identidade. ¦ Identity. ¦ map([1, 2], id) ¦
plot ¦ plot ¦ plot(f, a, b), plot([f, g], a, b, points=, xlim=, ylim=, title=, atributos) ¦ Gráfico de funções reais amostradas em [a, b]. xlim = [x₀, x₁] e ylim = [y₀, y₁] fixam a janela visível (sem eles, y é escolhido automaticamente ignorando polos). Aceita atributos de desenho (color, width, dash…) e pode ser somado a primitivas com +. ¦ Plot of real functions sampled on [a, b]. xlim = [x₀, x₁] and ylim = [y₀, y₁] fix the visible window (without them, y is chosen automatically, ignoring poles). Accepts drawing attributes (color, width, dash…) and can be added to primitives with +. ¦ plot(t -> sin(t)/t, -20, 20) ;; plot([sin, cos], 0, 2pi) ;; plot(tan, -5, 5, ylim = [-4, 4]) ;; plot(sin, 0, 2pi, color = "red", dash = "dash") + point((pi, 0)) ¦
listplot ¦ plot ¦ listplot(ys), listplot([(x, y), …], joined=true, xlim=, ylim=, atributos) ¦ Gráfico de pontos; xlim e ylim fixam a janela visível. Aceita atributos de desenho (color, marker, size…). ¦ Point plot; xlim and ylim fix the visible window. Accepts drawing attributes (color, marker, size…). ¦ listplot(map(1..50, k -> numdivisors(k))) ;; listplot(map(1..100, eulerphi), xlim = [0, 50], ylim = [0, 50]) ¦
complexplot ¦ plot ¦ complexplot(zs), complexplot(zs, xlim=, ylim=, atributos) ¦ Pontos no plano complexo, com escala igual nos eixos. xlim (parte real) e ylim (parte imaginária) fixam a região; se as proporções não baterem com o quadro, o outro eixo é ampliado para manter a escala. ¦ Points in the complex plane, with equal axis scales. xlim (real part) and ylim (imaginary part) fix the region; if the proportions do not match the frame, the other axis is widened to keep the scale. ¦ x = gen(ZZ[x]); complexplot(roots(x^30 - x - 1)) ;; x = gen(ZZ[x]); complexplot(roots(x^60 - x - 1), xlim = [-1.5, 1.5], ylim = [-1.5, 1.5]) ¦
point ¦ draw ¦ point(p, atributos) ¦ Um ponto. Pontos são números complexos (2 + i), reais (3) ou tuplas (x, y); bolas viram seu ponto médio. Com uma tupla (x, y, z), o ponto é do espaço e o gráfico é 3D (o mesmo vale para segment, line, polygon, arrow, infline, ray e text). Atributos: color, size (raio em px), marker ("dot", "circle", "square", "diamond", "cross", "plus"), opacity, label. ¦ A point. Points are complex numbers (2 + i), reals (3) or tuples (x, y); balls become their midpoint. With a tuple (x, y, z) the point lies in space and the graphic is 3D (the same holds for segment, line, polygon, arrow, infline, ray and text). Attributes: color, size (radius in px), marker ("dot", "circle", "square", "diamond", "cross", "plus"), opacity, label. ¦ point(1 + i) ;; point((2, 3), size = 5, color = "red") ;; point((1, 2, 3)) + segment((0, 0, 0), (1, 2, 3)) ¦
points ¦ draw ¦ points(ps, atributos) ¦ Vários pontos com o mesmo estilo (desenhados de uma vez, eficiente para milhares de pontos). ¦ Many points with the same style (drawn at once, efficient for thousands of points). ¦ points([exp(2pi*i*k/12) | k <- 1..12], marker = "square") ¦
segment ¦ draw ¦ segment(a, b, atributos) ¦ Segmento de a até b. Atributos de traço: color, width (px), dash ("dot", "dash", "dashdot" ou "4 2"), opacity. ¦ Segment from a to b. Stroke attributes: color, width (px), dash ("dot", "dash", "dashdot" or "4 2"), opacity. ¦ segment(0, 1 + i) ;; segment((0, 0), (1, 2), width = 3, dash = "dash") ¦
arrow ¦ draw ¦ arrow(a, b, atributos) ¦ Seta de a para b (o tamanho da ponta acompanha width). ¦ Arrow from a to b (the head size follows width). ¦ arrow(0, 1 + i) ;; [arrow(0, exp(i*k*pi/4), color = k) | k <- 1..6] ¦
line ¦ draw ¦ line([p₁, p₂, …], closed=false, atributos) ¦ Poligonal pelos pontos dados; closed = true fecha o caminho. ¦ Polyline through the given points; closed = true closes the path. ¦ line([0, 1, 1 + i, 2i]) ;; line([(k, k^2) | k <- -3..3]) ¦
polygon ¦ draw ¦ polygon([p₁, p₂, …], atributos) ¦ Polígono fechado. fill = true preenche com a cor do traço; fill = "cor" usa outra cor; opacity torna translúcido. ¦ Closed polygon. fill = true fills with the stroke color; fill = "color" uses another color; opacity makes it translucent. ¦ polygon([0, 1, i]) ;; polygon([exp(2pi*i*k/5) | k <- 1..5], fill = "gold", color = "ink") ¦
rect ¦ draw ¦ rect(a, b, atributos) ¦ Retângulo de lados paralelos aos eixos com cantos opostos a e b. ¦ Axis-parallel rectangle with opposite corners a and b. ¦ rect(0, 2 + i, fill = true, opacity = 0.3) ¦
infline ¦ draw ¦ infline(a, b, atributos) ¦ Reta infinita por a e b, cortada nas bordas da janela (em 3D, pela caixa da cena). ¦ Infinite line through a and b, clipped at the window edges (in 3D, by the scene box). ¦ infline(0, 1 + i) + circle(0, 1) ¦
ray ¦ draw ¦ ray(a, b, atributos) ¦ Semirreta que parte de a e passa por b. ¦ Ray starting at a through b. ¦ ray(0, 1 + i) + point(0) ¦
circle ¦ draw ¦ circle(c, r, atributos) ¦ Circunferência de centro c e raio r (em unidades do plano). Com escala igual nos eixos (padrão de draw) é um círculo; com aspect = "auto", uma elipse. ¦ Circle with center c and radius r (in plane units). With equal axis scales (the draw default) it is round; with aspect = "auto", an ellipse. ¦ circle(0, 1) ;; [circle(0, r) | r <- 1..5] ;; circle(1 + i, 1/2, color = "red", dash = "dot") ¦
disk ¦ draw ¦ disk(c, r, atributos) ¦ Disco (círculo preenchido); fill = "cor" escolhe o preenchimento. ¦ Disk (filled circle); fill = "color" chooses the fill. ¦ disk(0, 1, opacity = 0.3) + circle(0, 1) ¦
arc ¦ draw ¦ arc(c, r, θ₀, θ₁, atributos) ¦ Arco de circunferência de θ₀ a θ₁ (radianos, sentido anti-horário). ¦ Circular arc from θ₀ to θ₁ (radians, counterclockwise). ¦ arc(0, 1, 0, pi) ;; arc(0, 1, 0, 3pi/2, width = 3) ¦
sector ¦ draw ¦ sector(c, r, θ₀, θ₁, atributos) ¦ Setor circular ("fatia") de θ₀ a θ₁, preenchido. ¦ Circular sector ("slice") from θ₀ to θ₁, filled. ¦ sector(0, 1, 0, pi/3, color = 2) + sector(0, 1, pi/3, 2pi, color = 3, opacity = 0.4) ¦
curve ¦ draw ¦ curve(t -> z(t), a, b, points=400, atributos) ¦ Curva paramétrica: z(t) devolve um complexo ou uma tupla (x, y); com uma tupla (x, y, z), a curva é do espaço. Pontos onde a função falha abrem lacunas. ¦ Parametric curve: z(t) returns a complex number or a tuple (x, y); with a tuple (x, y, z) the curve lies in space. Points where the function fails leave gaps. ¦ curve(t -> exp(i*t) + exp(7i*t)/2, 0, 2pi) ;; curve(t -> (sin(3t), sin(4t)), 0, 2pi, color = 4) ;; curve(t -> (cos(t), sin(t), t/5), 0, 6pi) ¦
implicitplot ¦ draw ¦ implicitplot(p), implicitplot(p, xlim=, ylim=, resolution=512, vars=[u, v]) ¦ Curva p(x, y) = 0 de um polinômio com coeficientes em ℤ ou ℚ, como gráfico (aceita atributos como color e width). A FLINT fatora p e cada fator irredutível é traçado uma vez, então multiplicidades como (x² + y² − 1)² não atrapalham e componentes distintas se cruzam com nitidez. O traçado usa uma quadtree com aritmética intervalar, que descarta regiões sem zeros, e marching squares nas células de lado (janela)/resolution, com os pontos refinados sobre a curva. Janela padrão [−3, 3]². Ovais menores que uma célula e pontos isolados (como a origem em y² = x²(x − 1)) podem não aparecer. ¦ Curve p(x, y) = 0 of a polynomial with coefficients in ℤ or ℚ, as a graphic (accepts attributes such as color and width). FLINT factors p and each irreducible factor is traced once, so multiplicities such as (x² + y² − 1)² do no harm and distinct components cross cleanly. Tracing uses a quadtree with interval arithmetic, which discards regions without zeros, and marching squares on cells of side (window)/resolution, with points refined onto the curve. Default window [−3, 3]². Ovals smaller than a cell and isolated points (such as the origin on y² = x²(x − 1)) may not show. ¦ (x, y) = gens(QQ[x, y]); implicitplot(y^2 - x^3 + x) ;; (x, y) = gens(QQ[x, y]); implicitplot((x^2 + y^2)^2 - 2*(x^2 - y^2), xlim = [-2, 2], color = 2) ;; (x, y) = gens(QQ[x, y]); implicitplot(x^2 + y^2 - 4) + implicitplot(x*y - 1, color = 3) ¦ fmpq_mpoly_factor
text ¦ draw ¦ text(s, p, pos="c", fontsize=13, color=) ¦ Texto no ponto p. pos indica onde o texto fica em relação ao ponto: "c", "n", "s", "e", "w", "ne", "nw", "se", "sw". Valores que não são strings são exibidos como texto. ¦ Text at point p. pos says where the text sits relative to the point: "c", "n", "s", "e", "w", "ne", "nw", "se", "sw". Non-string values are shown as text. ¦ point(1 + i) + text("1 + i", 1 + i, pos = "ne") ;; text(pi, 0, fontsize = 20) ¦
handle ¦ draw ¦ handle(z₀, snap=, xlim=, ylim=, on=, label=) ¦ Ponto de controle: um valor de entrada (como slider) que começa em z₀ e muda ao ser arrastado nos gráficos. Todo primitivo que recebe o próprio valor (point, segment, polygon, circle, text…, em qualquer célula) mostra um marcador arrastável naquele vértice; valores derivados, como (a + b)/2, não arrastam. A célula mostra o ponto e campos x e y editáveis; setas do teclado movem o marcador focado. snap = h arredonda à grade h (valores exatos); xlim/ylim limitam a região; on = f projeta a posição (on = z -> z/abs(z) prende ao círculo unitário). Com z₀ = (x, y), o valor é uma tupla de coordenadas racionais exatas (com snap = 1/3, múltiplos de 1/3); com z₀ complexo, um número complexo. Editar z₀ no código, ou reavaliar a célula (Shift+Enter, Ctrl+Enter ou ▶), reposiciona o ponto no valor inicial. ¦ Control point: an input value (like slider) that starts at z₀ and changes when dragged in plots. Every primitive that receives the value itself (point, segment, polygon, circle, text…, in any cell) shows a draggable marker at that vertex; derived values, such as (a + b)/2, do not drag. The cell shows the point and editable x and y fields; arrow keys move the focused marker. snap = h rounds to the grid h (exact values); xlim/ylim restrict the region; on = f projects the position (on = z -> z/abs(z) pins it to the unit circle). With z₀ = (x, y), the value is a tuple of exact rational coordinates (with snap = 1/3, multiples of 1/3); with complex z₀, a complex number. Editing z₀ in the code, or re-running the cell (Shift+Enter, Ctrl+Enter or ▶), puts the point back at its initial value. ¦ p = handle(1 + i); point(p) + circle(p, 1) ;; q = handle(0, snap = 1/4) ;; r = handle((0, 0), snap = 1/3) ;; u = handle(1, on = z -> z/abs(z)) ¦
handles ¦ draw ¦ handles([z₁, …], add=false, min=, max=, snap=, …) ¦ Lista de pontos de controle. Cada ponto é arrastável como em handle; com add = true, clicar no fundo de um gráfico que recebe a lista inteira (points, line, polygon) acrescenta um ponto (numa poligonal, no segmento mais próximo) e Alt+clique num marcador o remove, respeitando min e max. ¦ List of control points. Each point drags as in handle; with add = true, clicking the background of a plot that receives the whole list (points, line, polygon) adds a point (on a polyline, at the nearest segment) and Alt+click on a marker removes it, within min and max. ¦ vs = handles([0, 1, i], add = true); polygon(vs) ;; ps = handles([-1, 0, 1]); interpolate(map(ps, re), map(ps, im)) ¦
group ¦ draw ¦ group(g₁, g₂, …, atributos) ¦ Agrupa gráficos; os atributos do grupo valem para as primitivas que não os definem (o filho prevalece). ¦ Groups graphics; the group's attributes apply to primitives that do not set them (the child wins). ¦ group(circle(0, 1), segment(-1, 1), color = "red", width = 2) ¦
style ¦ draw ¦ style(g, atributos) ¦ Impõe atributos a todas as primitivas de g, sobrescrevendo os que elas já tinham. Útil com |>. ¦ Imposes attributes on every primitive of g, overriding those they already had. Handy with |>. ¦ [segment(0, exp(i*k*pi/6)) | k <- 1..12] |> style(color = "gray", width = 0.5) ¦
draw ¦ draw ¦ draw(g, xlim=, ylim=, zlim=, aspect="equal", axes=true, grid=true, frame=true, box=true, title=, width=, height=) ¦ Ajusta a janela de um gráfico (ou lista de gráficos). Sem draw, uma célula cujo valor é um gráfico ou uma lista só de gráficos já é desenhada. aspect = "equal" mantém a mesma escala nos eixos (padrão para primitivas; plot usa "auto"). width e height em px. Em gráficos 3D: zlim fixa o intervalo de z, box = false esconde a caixa e aspect = "auto" leva os três eixos a proporções fixas. ¦ Sets the window of a graphic (or list of graphics). Without draw, a cell whose value is a graphic or a list of graphics only is drawn anyway. aspect = "equal" keeps the same scale on both axes (the default for primitives; plot uses "auto"). width and height in px. In 3D graphics: zlim fixes the z range, box = false hides the box and aspect = "auto" brings the three axes to fixed proportions. ¦ draw([circle(0, 1), segment(-1, 1)], axes = false, grid = false) ;; draw(circle(0, 1), xlim = [0, 2], ylim = [0, 2]) ¦
surface ¦ 3d ¦ surface((u, v) -> (x, y, z), [u₀, u₁], [v₀, v₁], points=40, xlim=, ylim=, zlim=, exclude=true, mesh=true, colormap=, atributos) ¦ Superfície paramétrica, amostrada numa grade (points = n ou [nu, nv]); onde a função falha a superfície tem buracos. xlim, ylim e zlim fixam a caixa, e o que sai dela é cortado (útil perto de polos). Um polo entre amostras ligaria os dois lados por uma parede falsa: exclude = true (padrão) descarta as células onde o salto inverte o sentido das vizinhas; exclude = "arb" avalia f em bolas que cobrem cada célula e descarta as que podem conter um polo (rigoroso e mais lento; funções como weierstrassp dão bolas largas e perdem células demais); exclude = false desenha tudo. Arraste para girar; clique na figura e use a roda para aproximar; duplo clique volta à vista inicial. mesh = false esconde as linhas da malha; colormap = "z" colore pela altura; color e opacity como nas outras primitivas. ¦ Parametric surface, sampled on a grid (points = n or [nu, nv]); where the function fails the surface has holes. xlim, ylim and zlim fix the box, and whatever leaves it is clipped (useful near poles). A pole between samples would join both sides by a spurious wall: exclude = true (the default) drops the cells where the jump reverses the direction of its neighbors; exclude = "arb" evaluates f on balls covering each cell and drops those that may contain a pole (rigorous and slower; functions such as weierstrassp give wide balls and lose too many cells); exclude = false draws everything. Drag to rotate; click the figure and use the wheel to zoom; double-click goes back to the initial view. mesh = false hides the mesh lines; colormap = "z" colors by height; color and opacity as for the other primitives. ¦ surface((u, v) -> ((2 + cos(v))*cos(u), (2 + cos(v))*sin(u), sin(v)), [0, 2pi], [0, 2pi]) ;; surface((u, v) -> (u - u^3/3 + u*v^2, v - v^3/3 + v*u^2, u^2 - v^2), [-2, 2], [-2, 2], colormap = "z") ¦
plot3d ¦ 3d ¦ plot3d((x, y) -> z, [x₀, x₁], [y₀, y₁], points=50, xlim=, ylim=, zlim=, exclude=true, mesh=true, colormap="z", atributos) ¦ Gráfico de uma função de duas variáveis, colorido pela altura. Os eixos ficam em proporções fixas (como aspect = "auto"); o intervalo de z ignora polos, ou é fixado por zlim, e o que sai da caixa é cortado. exclude como em surface: sem ele, 1/x teria uma parede em x = 0. ¦ Graph of a function of two variables, colored by height. The axes have fixed proportions (as aspect = "auto"); the z range ignores poles, or is fixed by zlim, and whatever leaves the box is clipped. exclude as in surface: without it, 1/x would have a wall at x = 0. ¦ plot3d((x, y) -> sin(x)*cos(y), [-3, 3], [-3, 3]) ;; plot3d((x, y) -> x*y/(x^2 + y^2), [-1, 1], [-1, 1], colormap = false) ;; plot3d((x, y) -> tan(x*y), [-3, 3], [-3, 3], zlim = [-5, 5], exclude = "arb") ¦
sphere ¦ 3d ¦ sphere(c, r, atributos) ¦ Esfera de centro c (tupla (x, y, z)) e raio r. Atributos: color, opacity. ¦ Sphere with center c (a tuple (x, y, z)) and radius r. Attributes: color, opacity. ¦ sphere((0, 0, 0), 1) ;; sphere((0, 0, 0), 1, opacity = 0.4) + point((0, 0, 1)) ¦
plane ¦ 3d ¦ plane(p, n, atributos) ¦ Plano por p com vetor normal n, cortado pela caixa da cena; translúcido por padrão (opacity = 0.5). ¦ Plane through p with normal vector n, clipped by the scene box; translucent by default (opacity = 0.5). ¦ sphere((0, 0, 0), 1) + plane((0, 0, 1/2), (0, 0, 1)) ;; plane((0, 0, 0), (1, 1, 1)) + infline((0, 0, 0), (1, 1, 1)) ¦
translate ¦ draw ¦ translate(g, v) ¦ Desloca g pelo vetor v (complexo ou tupla). Como todas as transformações, aceita um gráfico ou lista de gráficos e combina com |>. ¦ Translates g by the vector v (complex or tuple). Like every transformation, it takes a graphic or list of graphics and combines with |>. ¦ translate(circle(0, 1), 2 + i) ;; [translate(circle(0, 1/2), k) | k <- 1..5] ¦
rotate ¦ draw ¦ rotate(g, θ, c=0) ¦ Gira g de θ radianos (anti-horário) em torno de c. Círculos e arcos continuam exatos; o texto muda de lugar mas não gira. ¦ Rotates g by θ radians (counterclockwise) about c. Circles and arcs stay exact; text moves but is not rotated. ¦ [rotate(segment(0, 1), k*pi/8) | k <- 1..16] ;; rotate(rect(0, 2 + i), pi/6, 1 + i/2) + rect(0, 2 + i) ¦
scale ¦ draw ¦ scale(g, k, c=0), scale(g, (kx, ky), c=0) ¦ Homotetia de razão k com centro c; com (kx, ky), escala cada eixo (círculos viram elipses, desenhadas como poligonais). ¦ Homothety with ratio k about c; with (kx, ky), scales each axis (circles become ellipses, drawn as polylines). ¦ [scale(polygon([1, i, -1, -i]), 0.8^k) | k <- 0..10] ;; scale(circle(0, 1), (2, 1)) ¦
reflect ¦ draw ¦ reflect(g, a, b) ¦ Reflexão na reta que passa por a e b. ¦ Reflection in the line through a and b. ¦ g = polygon([1, 2, 2 + i]); g + reflect(g, 0, i) ;; arc(0, 1, 0, pi/2) + reflect(arc(0, 1, 0, pi/2), 0, 1 + i) ¦

      if (document.activeElement !== inp) inp.value = fmtCoord(v.at[k]);
    });
  }
}

function mountSlot(c, slot, d, name) {
  if (d.t === 'graphics3d') {
    const w = Math.max(300, Math.min(760, ($('#cells').clientWidth || 700) - 60));
    mount3d(c.figs3d ??= new Map(), slot.dataset.slot ?? '0', slot, d, w);
    return;
  }
  if (d.t === 'graphics') {
    const w = Math.max(300, Math.min(760, ($('#cells').clientWidth || 700) - 60));
    // Depois de arrastar um ponto, a janela fica fixa até a célula ser editada.
    const view = c.view && c.viewSrc === c.src ? c.view : null;
    const svg = renderGraphics(d, w, { view, interact: interactFor(c) });
    slot.replaceWith(svg);
    if (drag && drag.cell === c) {
      drag.svg = svg;
      svg.querySelector(`[data-h="${drag.key}"]`)?.classList.add('active');
    }
    if (c.focusKey) {
      const g = svg.querySelector(`[data-h="${c.focusKey}"]`);
      if (g) g.focus({ preventScroll: true });
    }
    return;
  }
  if (d.t === 'widget') {
    const wrap = document.createElement('div');
    wrap.className = 'widget';
    const label = d.spec.label ?? name ?? '';
    const idx = d.spec.index;
    const sendValue = (v) => {
      c.widgets[idx] = { kind: d.kind, value: v };
      save();
      sendWidget({ type: 'widget', id: c.id, index: idx, value: v });
    };
    if (d.kind === 'slider') {
      wrap.innerHTML = `<label><span class="wl">${esc(label)}</span><input type="range" min="${d.spec.min}" max="${d.spec.max}" step="${d.spec.step}" value="${d.value}"><output>${esc(d.value)}</output></label>`;
      const input = $('input', wrap);
      const outv = $('output', wrap);
      input.addEventListener('input', () => {
        outv.textContent = input.value;
        sendValue(Number(input.value));
      });
    } else if (d.kind === 'checkbox') {
      wrap.innerHTML = `<label><input type="checkbox" ${d.value ? 'checked' : ''}><span class="wl">${esc(label)}</span></label>`;
      $('input', wrap).addEventListener('change', (ev) => sendValue(ev.target.checked));
    } else if (d.kind === 'text' || d.kind === 'number') {
      wrap.innerHTML = `<label><span class="wl">${esc(label)}</span><input type="text" value="${esc(d.value)}"></label>`;
      $('input', wrap).addEventListener('change', (ev) => sendValue(ev.target.value));
    } else if (d.kind === 'handle') {
      const [x, y] = d.value.at;
      wrap.innerHTML = `<label><span class="wl">${esc(label)}</span><output>${esc(d.value.text)}</output></label>` +
        `<label class="xy">x <input type="text" class="coord" size="9" value="${esc(fmtCoord(x))}">` +
        ` y <input type="text" class="coord" size="9" value="${esc(fmtCoord(y))}"></label>`;
      const [ix, iy] = wrap.querySelectorAll('input');
      const commit = () => sendValue({ from: d.spec.from, at: [ix.value.trim(), iy.value.trim()] });
      ix.addEventListener('change', commit);
      iy.addEventListener('change', commit);
    } else if (d.kind === 'handles') {
      wrap.innerHTML = `<label><span class="wl">${esc(label)}</span><output>${esc(d.value.text)}</output></label>`;
    } else if (d.kind === 'select') {
      const opts = d.spec.options.map((o, i) => `<option value="${i}" ${i === d.value ? 'selected' : ''}>${esc(o)}</option>`).join('');
      wrap.innerHTML = `<label><span class="wl">${esc(label)}</span><select>${opts}</select></label>`;
      $('select', wrap).addEventListener('change', (ev) => sendValue(Number(ev.target.value)));
    }
    slot.replaceWith(wrap);
  }
}

// --------------------------------------------------------- pontos de controle
// Arrastar um ponto envia o novo valor à célula dona do handle (como um
// slider); a janela do gráfico fica fixa para os eixos não se moverem sob o
// cursor. O marcador anda na hora; o resto do gráfico segue o worker.
let drag = null; // {cell, h, key, svg}

const fmtCoord = (x) => String(+(+x).toPrecision(10));

function viewOf(svg) {
  const { x0, x1, y0, y1, width, height } = svg.cauchyView;
  return { x0, x1, y0, y1, width, height };
}

function freeze(c, svg) {
  if (!(c.view && c.viewSrc === c.src)) {
    c.view = viewOf(svg);
    c.viewSrc = c.src;
  }
}

function toData(svg, ev) {
  const v = svg.cauchyView;
  const rect = svg.getBoundingClientRect();
  const px = ((ev.clientX - rect.left) / rect.width) * v.width;
  const py = ((ev.clientY - rect.top) / rect.height) * v.height;
  const x = v.x0 + ((px - v.m.l) / v.W) * (v.x1 - v.x0);
  const y = v.y1 - ((py - v.m.t) / v.H) * (v.y1 - v.y0);
  return [Math.min(v.x1, Math.max(v.x0, x)), Math.min(v.y1, Math.max(v.y0, y))];
}

// Decimal com a resolução de um pixel da janela.
function decimal(svg, x) {
  const v = svg.cauchyView;
  const d = Math.max(0, Math.min(15, Math.ceil(-Math.log10((v.x1 - v.x0) / v.W))));
  const s = x.toFixed(d);
  return /^-0(\.0*)?$/.test(s) ? s.slice(1) : s;
}

function sendHandle(h, value) {
  const owner = cellById(h.id);
  if (owner) {
    owner.widgets[h.index] = { kind: h.entries ? 'handles' : 'handle', value };
    save();
  }
  sendWidget({ type: 'widget', id: h.id, index: h.index, value });
}

function moveHandle(h, xy, svg) {
  const at = xy.map((v) => decimal(svg, v));
  if (h.entries) {
    const pts = [...h.entries];
    pts[h.sub] = at;
    sendHandle(h, { from: h.from, pts });
  } else sendHandle(h, { from: h.from, at });
  const v = svg.cauchyView;
  const g = svg.querySelector(`[data-h="${handleKey(h)}"]`);
  const px = v.m.l + ((xy[0] - v.x0) / (v.x1 - v.x0)) * v.W;
  const py = v.m.t + v.H - ((xy[1] - v.y0) / (v.y1 - v.y0)) * v.H;
  g?.setAttribute('transform', `translate(${px.toFixed(2)},${py.toFixed(2)})`);
}

function interactFor(c) {
  return {
    down(h, ev, svg) {
      freeze(c, svg);
      c.focusKey = null;
      drag = { cell: c, h, key: handleKey(h), svg };
      svg.querySelector(`[data-h="${drag.key}"]`)?.classList.add('active');
      document.body.classList.add('dragging');
      const move = (e) => {
        if (drag) moveHandle(drag.h, toData(drag.svg, e), drag.svg);
      };
      const up = () => {
        drag?.svg.querySelector('.handle.active')?.classList.remove('active');
        drag = null;
        document.body.classList.remove('dragging');
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    },
    nudge(h, p, [dx, dy], big, svg) {
      freeze(c, svg);
      c.focusKey = handleKey(h);
      const v = svg.cauchyView;
      const step = Math.max(((v.x1 - v.x0) / v.W) * (big ? 10 : 1), h.snap ?? 0);
      moveHandle(h, [p[0] + dx * step, p[1] + dy * step], svg);
    },
    add(leaf, xy, svg) {
      const meta = leaf.dragList;
      if (meta.max !== null && meta.entries.length >= meta.max) return;
      freeze(c, svg);
      // Numa poligonal, o ponto novo entra no segmento mais próximo.
      let pos = meta.entries.length;
      if (leaf.g === 'line' && leaf.pts.length >= 2) {
        const n = leaf.pts.length;
        let best = Infinity;
        for (let i = 0; i < (leaf.closed ? n : n - 1); i++) {
          const [a, b] = [leaf.pts[i], leaf.pts[(i + 1) % n]];
          const [ux, uy] = [b[0] - a[0], b[1] - a[1]];
          const t = Math.max(0, Math.min(1, ((xy[0] - a[0]) * ux + (xy[1] - a[1]) * uy) / (ux * ux + uy * uy || 1)));
          const dd = Math.hypot(a[0] + t * ux - xy[0], a[1] + t * uy - xy[1]);
          // Além das pontas de uma poligonal aberta, o ponto estende a linha.
          if (dd < best) [best, pos] = [dd, !leaf.closed && i === 0 && t === 0 ? 0 : !leaf.closed && i === n - 2 && t === 1 ? n : i + 1];
        }
      }
      const pts = [...meta.entries];
      pts.splice(pos, 0, xy.map((v) => decimal(svg, v)));
      sendHandle(meta, { from: meta.from, pts });
    },
    remove(h, svg) {
      if (h.entries.length <= (h.min ?? 0)) return;
      freeze(c, svg);
      const pts = [...h.entries];
      pts.splice(h.sub, 1);
      sendHandle(h, { from: h.from, pts });
    },
  };
}

document.addEventListener('pointerdown', (ev) => {
  for (const c of state.cells) if (c.focusKey && !ev.target.closest?.('.handle')) c.focusKey = null;
});

// --------------------------------------------------------------- status

function setStatus(key, kind, cancellable = false, arg) {
  const s = $('#status');
  s.className = `status ${kind}`;
  state.status = [key, kind, cancellable, arg];
  $('#status-text').textContent = t(key, arg);
  $('#stop').hidden = !cancellable;
}

// --------------------------------------------------------------- persistência

function serialize() {
  return { title: state.title, cells: state.cells.map((c) => ({ src: c.src, widgets: c.widgets, ...(c.hidden ? { hidden: true } : {}) })) };
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(serialize()));
  } catch {
    // armazenamento indisponível: segue sem salvar
  }
}

function load(nb) {
  for (const c of state.cells) {
    c.el.remove();
    send({ type: 'update', changes: [{ id: c.id, src: null }] });
  }
  state.cells = [];
  state.title = nb.title ? pick(nb.title, getLang()) : '';
  $('#title').value = state.title;
  for (const cell of nb.cells ?? []) {
    const c = createCell(typeof cell === 'string' || !('src' in cell) ? pick(cell, getLang()) : cell.src);
    c.widgets = cell.widgets ?? [];
    if (cell.hidden) setHidden(c, true);
  }
  if (!state.cells.length) createCell('');
  save();
  evalAll();
}

async function compress(text) {
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = '';
  for (const b of buf) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function decompress(b64) {
  const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  const buf = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(stream).text();
}

async function share() {
  const data = await compress(JSON.stringify(serialize()));
  const url = `${location.origin}${location.pathname}#nb=${data}`;
  history.replaceState(null, '', url);
  try {
    await navigator.clipboard.writeText(url);
    toast(t('link-copied'));
  } catch {
    toast(t('link-in-url'));
  }
}

function exportFile() {
  const blob = new Blob([JSON.stringify(serialize(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${(state.title || t('untitled')).replace(/[^\p{L}\p{N}_-]+/gu, '_') || 'notebook'}.cauchy.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async () => {
    const f = input.files[0];
    if (!f) return;
    try {
      load(JSON.parse(await f.text()));
    } catch (e) {
      toast(t('bad-file', e.message));
    }
  };
  input.click();
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t.timer);
  t.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

// --------------------------------------------------------------- referência

const TYPE_NAMES = {
  fmpz: 'ZZ', fmpq: 'QQ', arb: 'RR', acb: 'CC', zmod: 'Zmod(n)', fq: 'GF(q)', si: 'int', ui: 'int ≥ 0', d: 'real',
  str: 'string', int: 'int', fmpz_poly: 'ZZ[x]', fmpq_poly: 'QQ[x]', arb_poly: 'RR[x]', acb_poly: 'CC[x]',
  zmod_poly: 'Zmod(n)[x]', fq_poly: 'GF(q)[x]', fmpz_mat: 'Mat(ZZ)', fmpq_mat: 'Mat(QQ)', arb_mat: 'Mat(RR)',
  acb_mat: 'Mat(CC)', zmod_mat: 'Mat(Zmod(n))', fq_mat: 'Mat(GF(q))', modctx: 'R', fqctx: 'F',
};
const FLINT_GROUPS = ['fmpz_poly', 'fmpq_poly', 'arb_poly', 'acb_poly', 'zmod_poly', 'fq_poly', 'fmpz_mat', 'fmpq_mat',
  'arb_mat', 'acb_mat', 'zmod_mat', 'fq_mat', 'fmpz', 'fmpq', 'arb', 'acb', 'zmod', 'fq', 'n'];

function refEntries() {
  const out = [...REF.values()];
  // Builtins sem entrada detalhada (não deveria acontecer) entram em "Diversos".
  for (const [n, d] of state.docs) {
    if (!REF.has(n) && !ALIASES[n]) out.push({ name: n, cat: 'misc', sig: n, pt: d, en: d, examples: [], flint: [] });
  }
  return out;
}

function flintLinks(fns) {
  return fns.map((fn) => {
    const url = flintDocUrl(fn);
    return url ? `<a href="${url}" target="_blank" rel="noopener"><code>${esc(fn)}</code></a>` : `<code>${esc(fn)}</code>`;
  }).join(' ');
}

function drawFunctions(q, cat) {
  const lang = getLang();
  const aliasOf = Object.entries(ALIASES).filter(([a, n]) => a.toLowerCase().includes(q) && q).map(([, n]) => n);
  const items = refEntries().filter((e) => (!cat || e.cat === cat) && (!q || aliasOf.includes(e.name) ||
    [e.name, e.sig, e[lang], ...e.flint].some((x) => x.toLowerCase().includes(q))));
  if (!items.length) return `<p class="muted">—</p>`;
  const exact = items.find((e) => e.name.toLowerCase() === q) ?? (aliasOf.length === 1 ? items.find((e) => e.name === aliasOf[0]) : null);
  return CATEGORIES.map(([id, pt, en]) => {
    const group = items.filter((e) => e.cat === id);
    if (!group.length) return '';
    return `<h3>${esc(lang === 'pt' ? pt : en)}</h3>` + group.map((e) => `
      <details class="fn" ${e === exact || items.length === 1 ? 'open' : ''}>
        <summary><code class="sig">${esc(e.sig)}</code><span class="desc">${esc(e[lang])}</span></summary>
        <div class="fn-body">
          ${e.examples.length ? `<div class="lbl2">${t('ref.examples')}</div>` + e.examples.map((x) => `
            <div class="ex"><code>${esc(x)}</code><button data-ex="${esc(x)}" title="${esc(t('ref.newcell'))}">${t('ref.insert')}</button></div>`).join('') : ''}
          ${e.flint.length ? `<div class="lbl2">${t('ref.uses')}</div><div class="fl">${flintLinks(e.flint)}</div>` : ''}
        </div>
      </details>`).join('');
  }).join('');
}

function drawFlint(q) {
  const names = Object.keys(state.sigs).filter((n) => !q || n.toLowerCase().includes(q) || state.sigs[n][2].toLowerCase().includes(q));
  const groups = new Map();
  for (const n of names) {
    const g = FLINT_GROUPS.find((p) => n.startsWith(p + '_')) ?? 'n';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(n);
  }
  const row = (n) => {
    const [ret, args, cfn] = state.sigs[n];
    const shown = args.filter((a) => a !== 'prec').map((a) => TYPE_NAMES[a] ?? a);
    const call = `flint("${n}"${shown.length ? ', ' + shown.join(', ') : ''})`;
    const r = TYPE_NAMES[ret.split('@')[0]] ?? ret;
    const c = cfn.startsWith('h_') ? `<span class="muted">${esc(cfn)}</span>` : flintLinks([cfn]);
    return `<div class="fx"><button class="fx-call" data-ex="${esc(`flint("${n}", )`)}"><code>${esc(call)}</code></button>
      <span class="fx-meta">→ ${esc(r)} · ${c}</span></div>`;
  };
  return `<p class="muted intro">${esc(t('ref.flint-intro'))}</p><p class="muted">${esc(t('ref.count', names.length))}</p>` +
    [...groups].map(([g, ns]) => `<h3>${esc(g === 'n' ? 'ulong / outros' : g)}</h3>${ns.map(row).join('')}`).join('');
}

function drawSyntax() {
  const lang = getLang();
  return `<pre class="syntax-code">${esc(SYNTAX_CODE[lang])}</pre><div class="syntax-notes">${SYNTAX_NOTES[lang]}</div>`;
}

function buildReference() {
  const body = $('#ref-body');
  const filter = $('#ref-filter');
  const catSel = $('#ref-cat');
  const lang = getLang();
  const cur = catSel.value;
  catSel.innerHTML = `<option value="">${esc(t('ref.all'))}</option>` +
    CATEGORIES.map(([id, pt, en]) => `<option value="${id}">${esc(lang === 'pt' ? pt : en)}</option>`).join('');
  catSel.value = cur;
  const draw = () => {
    const q = filter.value.trim().toLowerCase();
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === state.refTab));
    catSel.hidden = state.refTab !== 'functions';
    filter.hidden = state.refTab === 'syntax';
    body.innerHTML = state.refTab === 'functions' ? drawFunctions(q, catSel.value)
      : state.refTab === 'flint' ? drawFlint(q) : drawSyntax();
  };
  filter.oninput = draw;
  catSel.onchange = draw;
  document.querySelector('.tabs').onclick = (ev) => {
    const b = ev.target.closest('button[data-tab]');
    if (!b) return;
    state.refTab = b.dataset.tab;
    draw();
  };
  body.onclick = (ev) => {
    const b = ev.target.closest('button[data-ex]');
    if (!b) return;
    const src = b.dataset.ex;
    const ta = state.lastTa;
    const after = ta ? state.cells.find((c) => c.el.contains(ta)) : state.cells[state.cells.length - 1];
    // Célula vazia corrente é reaproveitada.
    let c = after && !after.src.trim() ? after : createCell(src, after ?? null);
    if (c === after) {
      const t2 = $('textarea', c.el);
      t2.value = src;
      c.src = src;
      refreshHighlight(c);
      autosize(c);
    }
    const t3 = $('textarea', c.el);
    t3.focus();
    if (src.endsWith(', )')) t3.setSelectionRange(src.length - 1, src.length - 1);
    else evalCell(c);
    save();
    c.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };
  draw();
}

function applyLang(lang) {
  setLang(lang);
  $('#lang').value = lang;
  applyStatic();
  state.cells.forEach((c) => applyStatic(c.el));
  if (!state.title) $('#title').placeholder = t('untitled');
  $('#examples').innerHTML = `<option value="">${esc(t('examples'))}</option>` +
    EXAMPLES.map((e, i) => `<option value="${i}">${esc(pick(e.title, lang))}</option>`).join('');
  if (state.status) setStatus(...state.status);
  if (state.live !== undefined) $('#live').textContent = t('objects', state.live);
  buildReference();
  for (const c of state.cells) if (c.result) { c.relang = true; showResult(c, c.result); c.relang = false; }
}

// Troca ->, <-, =>, |>, <=, >= e != por →, ←, ⇒, ▷, ≤, ≥ e ≠ quando o segundo
// caractere é digitado. Usa execCommand para que Ctrl+Z desfaça a troca; o
// evento de entrada aninhado cuida do resto (devolve true nesse caso).
function symbolize(ta, ev) {
  if (!$('#unicode').checked || ev.inputType !== 'insertText' || !['>', '-', '='].includes(ev.data)) return false;
  const end = ta.selectionStart;
  if (end !== ta.selectionEnd) return false;
  const sym = symbolAt(ta.value, end);
  if (!sym) return false;
  ta.setSelectionRange(end - 2, end);
  if (document.execCommand && document.execCommand('insertText', false, sym)) return true;
  ta.setRangeText(sym, end - 2, end, 'end');
  return false;
}

// --------------------------------------------------------------- assistência

// Aplica uma edição de editing.js. Usa execCommand para que Ctrl+Z desfaça;
// o evento de entrada resultante atualiza a célula.
function applyEdit(ta, r) {
  ta.setSelectionRange(r.start, r.end);
  if (r.start !== r.end || r.text) {
    const ok = document.execCommand && document.execCommand(r.text ? 'insertText' : 'delete', false, r.text);
    if (!ok) {
      ta.setRangeText(r.text, r.start, r.end, 'end');
      ta.dispatchEvent(new Event('input'));
    }
  }
  ta.setSelectionRange(...r.sel);
}

// Pares de delimitadores, Backspace num par vazio e Enter com indentação.
function editKey(ev, ta) {
  if (ev.ctrlKey || ev.metaKey || ev.altKey || ev.isComposing) return false;
  const s = ta.selectionStart, e = ta.selectionEnd;
  let r = null;
  if (ev.key.length === 1 && '()[]{}"'.includes(ev.key)) r = typeChar(ta.value, s, e, ev.key);
  else if (ev.key === 'Backspace') r = backspace(ta.value, s, e);
  else if (ev.key === 'Enter' && !ev.shiftKey) r = newline(ta.value, s, e);
  if (!r) return false;
  ev.preventDefault();
  applyEdit(ta, r);
  return true;
}

const docMap = () => (state.docMap ??= new Map(state.docs));

// Assinatura de um nome: a da referência ou a do docstring da função.
function signatureOf(name) {
  const ref = REF.get(ALIASES[name] ?? name);
  if (ref) return ref.sig;
  const doc = docMap().get(name);
  if (!doc) return null;
  const k = doc.indexOf('): ');
  return k >= 0 ? doc.slice(0, k + 1) : null;
}

// Elemento flutuante (lista de sugestões ou assinatura), junto ao cursor.
function assistEl() {
  let el = $('#assist');
  if (!el) {
    el = document.createElement('div');
    el.id = 'assist';
    el.setAttribute('role', 'listbox');
    el.hidden = true;
    // Clicar numa sugestão não tira o foco do editor.
    el.addEventListener('mousedown', (ev) => {
      ev.preventDefault();
      const li = ev.target.closest('[data-k]');
      if (li && state.assist?.items) { state.assist.idx = +li.dataset.k; acceptCompletion(); }
    });
    document.body.append(el);
  }
  return el;
}

// Posição do cursor na tela: espelho do editor com um marcador no ponto.
function caretRect(ta, pos) {
  const pre = document.createElement('pre');
  pre.className = 'mirror';
  pre.textContent = ta.value.slice(0, pos);
  const mark = document.createElement('span');
  mark.textContent = '​';
  pre.append(mark);
  ta.parentElement.append(pre);
  const r = mark.getBoundingClientRect();
  pre.remove();
  return r;
}

function placeAssist(ta, pos) {
  const el = assistEl();
  el.hidden = false;
  const r = caretRect(ta, pos);
  const h = el.offsetHeight, w = el.offsetWidth;
  const below = r.bottom + 2 + h <= window.innerHeight || r.top - h - 2 < 0;
  el.style.top = `${below ? r.bottom + 2 : r.top - h - 2}px`;
  el.style.left = `${Math.max(4, Math.min(r.left, window.innerWidth - w - 4))}px`;
}

function closeAssist() {
  state.assist = null;
  const el = $('#assist');
  if (el) el.hidden = true;
}

// Candidatos: palavras-chave, funções embutidas e nomes do caderno.
function candidates() {
  const kind = new Map();
  for (const c of state.cells) for (const n of identifiers(c.src)) kind.set(n, 'var');
  for (const n of state.builtins) kind.set(n, 'bi');
  for (const n of KEYWORDS) kind.set(n, 'kw');
  return kind;
}

function showCompletions(ta, explicit = false) {
  const pos = ta.selectionStart;
  if (pos !== ta.selectionEnd) return closeAssist();
  const w = wordBefore(ta.value, pos) ?? (explicit ? { word: '', start: pos } : null);
  if (!w || (!explicit && w.word.length < 2)) return closeAssist();
  // Não sugere no meio de uma palavra.
  if (/(?![⁰¹²³⁴⁵⁶⁷⁸⁹])[\p{L}\p{N}_']/u.test(ta.value[pos] ?? '')) return closeAssist();
  const kind = candidates();
  const items = complete(w.word, kind.keys(), explicit ? 30 : 12);
  if (!items.length) return explicit ? showSignature(ta) : closeAssist();
  // Enter só aceita depois de escolher com as setas (ou com Ctrl+Espaço),
  // para não atrapalhar quem só quer mudar de linha; Tab sempre aceita.
  state.assist = { ta, start: w.start, items, idx: 0, kind, chosen: explicit };
  drawCompletions();
  placeAssist(ta, w.start);
}

function drawCompletions() {
  const a = state.assist;
  const el = assistEl();
  el.className = 'completions';
  const lang = getLang();
  el.innerHTML = a.items.map((n, k) => {
    const sig = a.kind.get(n) === 'bi' ? signatureOf(n) : null;
    const ref = k === a.idx ? REF.get(ALIASES[n] ?? n) : null;
    const desc = ref ? `<div class="ac-desc">${esc(ref[lang] ?? ref.pt)}</div>` : '';
    return `<div class="ac-item${k === a.idx ? ' sel' : ''}" data-k="${k}" role="option" aria-selected="${k === a.idx}">` +
      `<span class="ac-name t-${a.kind.get(n)}">${esc(n)}</span>` +
      (sig && sig !== n ? `<span class="ac-sig">${esc(sig)}</span>` : '') + desc + '</div>';
  }).join('');
  el.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
}

// Funções recebem parênteses (com o cursor dentro); constantes e anéis não.
function isFunction(name) {
  const sig = signatureOf(name);
  return !!sig && sig.startsWith(name + '(');
}

function acceptCompletion() {
  const a = state.assist;
  const { ta } = a;
  const name = a.items[a.idx];
  const pos = ta.selectionStart;
  if (wordBefore(ta.value, pos)?.start !== a.start) return closeAssist();
  const call = a.kind.get(name) === 'bi' && isFunction(name) && ta.value[pos] !== '(';
  const text = call ? name + '()' : name;
  const at = a.start + name.length + (call ? 1 : 0);
  closeAssist();
  applyEdit(ta, { text, start: a.start, end: pos, sel: [at, at] });
  closeAssist();
  if (call) showSignature(ta);
}

// Navegação na lista de sugestões; Ctrl+Espaço abre a lista.
function assistKey(ev, ta) {
  if (ev.key === ' ' && (ev.ctrlKey || ev.metaKey)) {
    ev.preventDefault();
    showCompletions(ta, true);
    return true;
  }
  const a = state.assist;
  if (!a) return false;
  if (ev.key === 'Escape') {
    ev.preventDefault();
    closeAssist();
    return true;
  }
  if (!a.items) return false;
  const mods = ev.ctrlKey || ev.metaKey || ev.altKey || ev.shiftKey;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    const n = a.items.length;
    a.idx = (a.idx + (ev.key === 'ArrowDown' ? 1 : n - 1)) % n;
    a.chosen = true;
    drawCompletions();
    return true;
  }
  if (((ev.key === 'Enter' && a.chosen) || ev.key === 'Tab') && !mods) {
    ev.preventDefault();
    acceptCompletion();
    return true;
  }
  if (ev.key === 'Enter' || ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') closeAssist();
  return false;
}

// Assinatura da função cuja chamada contém o cursor, com o argumento
// corrente em destaque.
function showSignature(ta) {
  const pos = ta.selectionStart;
  const call = pos === ta.selectionEnd ? callAt(ta.value, pos) : null;
  const sig = call && signatureOf(call.name);
  if (!sig) return closeAssist();
  const el = assistEl();
  el.className = 'signature';
  el.innerHTML = signatureHtml(sig, call.name, call.arg);
  state.assist = { ta, sig: true };
  placeAssist(ta, pos);
}

// Divide nas vírgulas de nível 0 (fora de parênteses e colchetes).
function splitTop(s) {
  const out = [];
  let depth = 0, a = 0;
  for (let k = 0; k < s.length; k++) {
    if ('([{'.includes(s[k])) depth++;
    else if (')]}'.includes(s[k])) depth--;
    else if (s[k] === ',' && depth === 0) { out.push(s.slice(a, k)); a = k + 1; }
  }
  out.push(s.slice(a));
  return out.map((x) => x.trim());
}

// A assinatura pode ter várias formas ("gen(R), gen(R, k)"): mostra a
// primeira com argumentos suficientes.
function signatureHtml(sig, name, arg) {
  const forms = splitTop(sig).filter((f) => f.includes('('));
  const parsed = forms.map((f) => {
    const a = f.indexOf('('), b = f.lastIndexOf(')');
    return { head: f.slice(0, a), args: b > a + 1 ? splitTop(f.slice(a + 1, b)) : [], tail: f.slice(b + 1) };
  });
  const form = parsed.find((p) => p.args.length > arg) ?? parsed[parsed.length - 1];
  if (!form) return esc(sig);
  const args = form.args.map((x, k) => (k === arg ? `<b>${esc(x)}</b>` : esc(x))).join(', ');
  return `<span class="t-bi">${esc(form.head)}</span>(${args})${esc(form.tail)}`;
}

function assistOnInput(ta, ev) {
  const typed = ev.inputType === 'insertText' && ev.data && /(?![⁰¹²³⁴⁵⁶⁷⁸⁹])[\p{L}\p{N}_']$/u.test(ev.data);
  if (typed || (ev.inputType?.startsWith('delete') && state.assist?.items)) showCompletions(ta);
  else if (state.assist?.items) closeAssist();
  if (!state.assist?.items) showSignature(ta);
}

// --------------------------------------------------------------- tema

// Tema efetivo: escolha salva (data-theme) ou, sem ela, o do sistema.
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
const currentTheme = () => document.documentElement.dataset.theme ?? (darkQuery.matches ? 'dark' : 'light');

function showThemeIcon() {
  // O ícone indica o tema para o qual o botão leva.
  $('#theme').textContent = currentTheme() === 'dark' ? '☀' : '☾';
}

function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try {
    localStorage.setItem('cauchy.theme', next);
  } catch {
    // sem armazenamento: vale só nesta sessão
  }
  showThemeIcon();
}

// --------------------------------------------------------------- inicialização

async function initialNotebook() {
  const m = /#nb=([\w-]+)/.exec(location.hash);
  if (m) {
    try {
      return JSON.parse(await decompress(m[1]));
    } catch {
      toast(t('bad-link'));
    }
  }
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) return JSON.parse(saved);
  } catch {
    // ignora
  }
  return EXAMPLES[0];
}

async function main() {
  applyLang(detectLang());
  $('#lang').onchange = (ev) => applyLang(ev.target.value);
  $('#theme').onclick = toggleTheme;
  darkQuery.addEventListener('change', showThemeIcon);
  showThemeIcon();
  const examples = $('#examples');
  examples.onchange = () => {
    const e = EXAMPLES[+examples.value];
    examples.value = '';
    if (e) load(e);
  };
  $('#title').oninput = (ev) => { state.title = ev.target.value; save(); };
  $('#add').onclick = () => createCell('', state.cells[state.cells.length - 1], true);
  $('#run-all').onclick = () => evalAll();
  $('#stop').onclick = () => interrupt();
  $('#share').onclick = () => share();
  $('#export').onclick = () => exportFile();
  $('#import').onclick = () => importFile();
  $('#new').onclick = () => load({ title: '', cells: [''] });
  $('#help').onclick = () => document.body.classList.toggle('show-ref');
  $('#autorun').checked = localStorage.getItem('cauchy.autorun') !== '0';
  $('#autorun').onchange = (ev) => localStorage.setItem('cauchy.autorun', ev.target.checked ? '1' : '0');
  $('#unicode').checked = localStorage.getItem('cauchy.unicode') !== '0';
  $('#unicode').onchange = (ev) => localStorage.setItem('cauchy.unicode', ev.target.checked ? '1' : '0');
  document.addEventListener('focusin', (ev) => { if (ev.target.tagName === 'TEXTAREA') state.lastTa = ev.target; });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === '.' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); interrupt(); }
  });
  window.addEventListener('resize', () => state.cells.forEach(autosize));
  window.addEventListener('scroll', closeAssist, true);

  startWorker();
  const nb = await initialNotebook();
  load(nb);
}

main();



return { ringName };
