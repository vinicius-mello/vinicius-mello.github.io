<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cauchy</title>
<meta name="description" content="Ambiente reativo de exploração numérica sobre FLINT, no navegador.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23233'/%3E%3Ctext x='16' y='23' font-family='serif' font-size='20' font-style='italic' fill='%23fc6' text-anchor='middle'%3E%E2%88%AE%3C/text%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem('cauchy.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<style>/* JetBrains Mono (variável, recortado), licença SIL OFL 1.1: src/ui/fonts/OFL-JetBrainsMono.txt */
@font-face {
  font-family: "Cauchy Mono";
  src: url("cauchy-mono.woff2") format("woff2");
  font-weight: 100 800;
  font-display: swap;
}

:root {
  --bg: #f7f5f0;
  --paper: #fffdf8;
  --ink: #1f2328;
  --muted: #6b6f76;
  --faint: #e7e3da;
  --line: #d9d4c8;
  --accent: #9a5b13;
  --accent-soft: #f4e7d3;
  --ok: #2f7d4f;
  --err: #b42318;
  --err-soft: #fdecea;
  --run: #c58a1b;
  --code-bg: #fbfaf6;
  --t-kw: #8b3fa1;
  --t-num: #1b6ca8;
  --t-str: #2f7d4f;
  --t-c: #8a8f98;
  --t-bi: #9a5b13;
  --t-call: #2c4a7a;
  --t-ring: #0e7c86;
  --t-op: #6b6f76;
  --s0: #1b6ca8; --s1: #c2410c; --s2: #2f7d4f; --s3: #8b3fa1; --s4: #b8860b; --s5: #0e7c86;
  --mono: "Cauchy Mono", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --math: "STIX Two Math", "Cambria Math", "Latin Modern Math", "STIX Two Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --paper: #1c1f23; --ink: #e6e3dc; --muted: #9aa0a8; --faint: #2a2e34; --line: #353a41;
    --accent: #e3a35a; --accent-soft: #3a2c1b; --ok: #5cbf86; --err: #f07167; --err-soft: #3a1f1f; --run: #e3b04b;
    --code-bg: #191c20; --t-kw: #d29bea; --t-num: #7cc0f5; --t-str: #8fd4a4; --t-c: #6f757e; --t-bi: #e3a35a;
    --t-call: #a9c1ee; --t-ring: #62c9d2; --t-op: #9aa0a8;
    --s0: #7cc0f5; --s1: #f59f6b; --s2: #8fd4a4; --s3: #d29bea; --s4: #e8c46a; --s5: #62c9d2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --paper: #1c1f23; --ink: #e6e3dc; --muted: #9aa0a8; --faint: #2a2e34; --line: #353a41;
  --accent: #e3a35a; --accent-soft: #3a2c1b; --ok: #5cbf86; --err: #f07167; --err-soft: #3a1f1f; --run: #e3b04b;
  --code-bg: #191c20; --t-kw: #d29bea; --t-num: #7cc0f5; --t-str: #8fd4a4; --t-c: #6f757e; --t-bi: #e3a35a;
  --t-call: #a9c1ee; --t-ring: #62c9d2; --t-op: #9aa0a8;
  --s0: #7cc0f5; --s1: #f59f6b; --s2: #8fd4a4; --s3: #d29bea; --s4: #e8c46a; --s5: #62c9d2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
button, select, input { font: inherit; color: inherit; }
button {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px 10px;
  cursor: pointer;
}
button:hover { background: var(--faint); }
button.icon { min-width: 2.2em; padding-left: 0; padding-right: 0; font-size: 15px; line-height: 1; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }

/* ---------------------------------------------------------------- topo */
.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 20px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .02em; }
.logo { font-family: var(--math); font-style: italic; font-size: 22px; color: var(--accent); line-height: 1; }
.title {
  flex: 1 1 160px; min-width: 120px;
  background: transparent; border: 1px solid transparent; border-radius: 6px;
  padding: 3px 8px; font-size: 16px;
}
.title:hover, .title:focus { border-color: var(--line); background: var(--paper); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- layout */
.layout { flex: 1; display: flex; gap: 24px; padding: 20px; max-width: 1400px; width: 100%; margin: 0 auto; }
.cells { flex: 1; min-width: 0; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 40vh; }
.ref { display: none; }
body.show-ref .ref {
  display: flex; flex-direction: column;
  width: 420px; flex: 0 0 420px;
  position: sticky; top: 64px; align-self: flex-start;
  max-height: calc(100vh - 110px);
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden;
}
.ref-head { padding: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.ref-head input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--bg); }
.ref-head select { width: 100%; }
.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1; border-radius: 6px; font-size: 13px; color: var(--muted); }
.tabs button.active { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.ref-body { overflow-y: auto; padding: 4px 12px 16px; font-size: 13px; }
.ref-body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; font-weight: 600; }
.ref-body a { color: var(--accent); text-decoration: none; }
.ref-body a:hover { text-decoration: underline; }
.ref-body code { font: 12px var(--mono); }
details.fn { border-bottom: 1px solid var(--faint); }
details.fn summary { cursor: pointer; padding: 5px 0; list-style: none; display: flex; flex-direction: column; gap: 1px; }
details.fn summary::-webkit-details-marker { display: none; }
details.fn summary:hover .sig { text-decoration: underline; }
details.fn .sig { color: var(--accent); }
details.fn .desc { color: var(--muted); }
details.fn[open] .desc { color: var(--ink); }
.fn-body { padding: 2px 0 8px 10px; border-left: 2px solid var(--accent-soft); margin-bottom: 6px; }
.lbl2 { font-size: 11px; color: var(--muted); margin: 6px 0 2px; }
.ex { display: flex; align-items: center; gap: 6px; justify-content: space-between; padding: 2px 0; }
.ex code { background: var(--code-bg); border-radius: 4px; padding: 2px 5px; overflow-x: auto; white-space: nowrap; min-width: 0; }
.ex button { font-size: 11px; padding: 0 6px; flex: none; }
.fl { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.fx { padding: 3px 0; border-bottom: 1px solid var(--faint); display: flex; flex-direction: column; }
.fx-call { border: 0; padding: 0; text-align: left; color: var(--t-call); }
.fx-call:hover { background: none; text-decoration: underline; }
.fx-meta { color: var(--muted); font-size: 12px; }
.intro { margin-top: 8px; }
.syntax-code { font: 12px/1.45 var(--mono); background: var(--code-bg); padding: 8px; border-radius: 6px; overflow-x: auto; margin: 10px 0; }
.syntax-notes p { margin: 6px 0; color: var(--muted); }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
#lang { padding: 3px 4px; }

/* ---------------------------------------------------------------- células */
.cell {
  position: relative;
  display: grid;
  grid-template-columns: 18px 1fr;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: border-color .15s, box-shadow .15s;
}
.cell:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: 0 1px 6px color-mix(in srgb, var(--accent) 12%, transparent); }
.gutter { display: flex; justify-content: center; padding-top: 14px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background .2s; }
.cell.ok .dot { background: var(--ok); }
.cell.error .dot { background: var(--err); }
.cell.upstream .dot { background: color-mix(in srgb, var(--err) 45%, var(--line)); }
.cell.stale .dot { background: var(--run); opacity: .6; }
.cell.running .dot { background: var(--run); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.body { min-width: 0; padding: 6px 12px 6px 4px; }

.editor { position: relative; font: 14px/1.55 var(--mono); }
.editor pre, .editor textarea {
  margin: 0; padding: 4px 6px; border: 0;
  font: inherit; letter-spacing: 0; tab-size: 2;
  white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
}
.editor pre { color: var(--ink); pointer-events: none; min-height: 1.55em; }
.editor textarea {
  position: absolute; inset: 0; width: 100%; height: 100%;
  resize: none; overflow: hidden;
  background: transparent; color: transparent; caret-color: var(--ink);
  outline: none;
}
.editor textarea::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); color: transparent; }
/* espelho invisível para medir a posição do cursor */
.editor pre.mirror { position: absolute; inset: 0; visibility: hidden; }

/* sugestões e assinatura junto ao cursor */
#assist {
  position: fixed; z-index: 50; max-width: min(560px, calc(100vw - 8px));
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 4px 14px rgb(0 0 0 / .14); font: 13px/1.45 var(--mono);
}
#assist[hidden] { display: none; }
#assist.completions { max-height: 260px; overflow-y: auto; padding: 3px 0; }
#assist.signature { padding: 3px 8px; white-space: pre-wrap; }
#assist.signature b { color: var(--accent); }
.ac-item { padding: 1px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-item.sel { background: var(--accent-soft); white-space: normal; }
.ac-name { font-weight: 500; }
.ac-sig { color: var(--muted); margin-left: 10px; font-size: 12px; }
.ac-desc { font: 12px/1.4 var(--sans); color: var(--muted); margin: 1px 0 3px; white-space: normal; }

.t-kw { color: var(--t-kw); font-weight: 500; }
.t-num { color: var(--t-num); }
.t-s { color: var(--t-str); }
.t-c { color: var(--t-c); font-style: italic; }
.t-bi { color: var(--t-bi); }
.t-call { color: var(--t-call); }
.t-ring { color: var(--t-ring); font-weight: 600; }
.t-op { color: var(--t-op); }
.t-err { text-decoration: wavy underline var(--err); text-decoration-skip-ink: none; text-underline-offset: 3px; background: var(--err-soft); }

.out:empty { display: none; }
.out { padding: 6px 6px 4px; border-top: 1px dashed var(--faint); margin-top: 4px; position: relative; }
.cell.stale .out { opacity: .55; }
.val { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lbl { font: 14px var(--mono); color: var(--muted); white-space: nowrap; }
.math { font-family: var(--math); font-size: 18px; line-height: 1.6; min-width: 0; max-width: 100%; overflow-x: auto; overflow-y: hidden; }
.err { color: var(--err); background: var(--err-soft); border-radius: 6px; padding: 6px 10px; font-size: 14px; white-space: pre-wrap; }
.ms { position: absolute; right: 6px; bottom: 2px; font-size: 11px; color: var(--muted); }

.tools {
  position: absolute; right: 8px; top: -13px;
  display: none; gap: 2px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 2px;
}
.cell:hover .tools, .cell:focus-within .tools { display: flex; }
.tools button { border: 0; padding: 0 7px; font-size: 13px; color: var(--muted); }
.tools button:hover { color: var(--ink); }
.cell.slow .tools button[data-act="run"] { color: var(--run); }
/* Código oculto: só a saída; sem saída, um aviso que mostra o código. */
.cell.hide-src .editor { display: none; }
.cell.hide-src .out { border-top: 0; margin-top: 0; }
.hidden-note { display: none; border: 0; background: none; padding: 8px 6px; font: 12px var(--mono); color: var(--muted); cursor: pointer; }
.hidden-note:hover { color: var(--ink); }
.cell.hide-src .out:empty + .hidden-note { display: block; }
.cell.hide-src .tools button[data-act="hide"] { color: var(--accent); }

/* ---------------------------------------------------------------- matemática */
.n { font-variant-numeric: lining-nums; overflow-wrap: anywhere; word-break: break-all; }
.bigint .trunc { word-break: break-all; }
.expand { font: 12px var(--sans); margin-left: 8px; padding: 0 6px; color: var(--muted); vertical-align: middle; }
.ball .rad { color: var(--muted); font-size: .78em; white-space: nowrap; }
.imag, .var { font-style: italic; }
.imag { margin-left: 1px; }
.op { margin: 0 .28em; color: var(--ink); }
.factored .op { margin: 0 .18em; }
.paren, .br { color: var(--muted); }
.sep { color: var(--muted); }
.list, .tuple { overflow-wrap: anywhere; }
.note { color: var(--muted); font-family: var(--sans); font-size: 12px; margin-left: 6px; }
.text { font-family: var(--sans); font-size: 15px; white-space: pre-wrap; }
.str { color: var(--t-str); font-family: var(--mono); font-size: .8em; }
.bool { font-family: var(--mono); font-size: .85em; color: var(--t-kw); }
.fnv { font-family: var(--mono); font-size: .85em; color: var(--t-call); }
.ring { font-size: 1.05em; }
sup { font-size: .68em; line-height: 0; }
.frac {
  display: inline-flex; flex-direction: column; vertical-align: middle;
  text-align: center; font-size: .82em; line-height: 1.15; margin: 0 .1em;
}
.frac .fn { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.frac .fd { padding: 0 .15em; }
.mat {
  display: inline-block; vertical-align: middle; position: relative;
  padding: 2px 10px; margin: 2px 0;
}
.mat::before, .mat::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 6px;
  border: 1.5px solid var(--ink);
}
.mat::before { left: 0; border-right: 0; border-radius: 3px 0 0 3px; }
.mat::after { right: 0; border-left: 0; border-radius: 0 3px 3px 0; }
.mgrid { display: grid; grid-template-columns: repeat(var(--cols), auto); column-gap: 1.1em; row-gap: .1em; justify-items: end; align-items: center; }
.mc { white-space: nowrap; }

/* ---------------------------------------------------------------- gráficos */
.plot { display: block; max-width: 100%; height: auto; font-family: var(--sans); }
.plot .grid line { stroke: var(--faint); stroke-width: 1; }
.plot .axes line { stroke: var(--muted); stroke-width: 1; }
.plot .frame { fill: none; stroke: var(--line); }
.plot .tick { font-size: 11px; fill: var(--muted); }
.plot .ptitle { font-size: 13px; fill: var(--ink); }
.plot .gtext { font-family: var(--sans); }
.plot3d { position: relative; max-width: 100%; font-family: var(--sans); outline: none; border-radius: 6px; }
.plot3d:focus-visible { box-shadow: 0 0 0 2px var(--line); }
.plot3d canvas { display: block; touch-action: none; cursor: grab; }
.plot3d canvas:active { cursor: grabbing; }
.overlay3d { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.overlay3d span { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; }
.tick3d { font-size: 11px; color: var(--muted); }
.axis3d { font-size: 12px; font-style: italic; color: var(--ink); }
.text3d { font-size: 13px; color: var(--ink); }
.title3d { position: absolute; top: 6px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--ink); }
.loading3d { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: var(--muted); }
.plot .hover { pointer-events: none; }
.plot .hover line { stroke: var(--muted); stroke-dasharray: 3 3; }
.plot .hover circle { fill: var(--accent); }
.plot .hoverlabel { fill: var(--ink); }
.plot .handle { cursor: grab; outline: none; touch-action: none; }
.plot .handle .hit { fill: transparent; }
.plot .handle .knob { fill: var(--paper); stroke-width: 2; }
.plot .handle:hover .knob, .plot .handle:focus-visible .knob { fill: var(--accent-soft); stroke-width: 2.5; }
.plot .handle.active .knob { fill: var(--accent); }
.plot.addable { cursor: crosshair; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
.widget .xy { margin-left: 1em; color: var(--muted); font-size: 0.9em; }
.widget input.coord { width: 7em; font-family: var(--mono); }

/* ---------------------------------------------------------------- widgets */
.widget label { display: flex; align-items: center; gap: 10px; font-size: 14px; flex-wrap: wrap; }
.widget .wl { font-family: var(--mono); color: var(--muted); }
.widget input[type="range"] { width: min(360px, 60vw); accent-color: var(--accent); }
.widget output { font-family: var(--math); font-size: 18px; min-width: 3ch; }
/* Vários controles numa célula: rótulos alinhados na largura do maior. */
.panel { display: flex; flex-direction: column; gap: 8px; }
.panel .wl { min-width: var(--wl, auto); }
.panel + .val { margin-top: 10px; }
.widget input[type="text"] { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; background: var(--bg); font-family: var(--mono); }

/* ---------------------------------------------------------------- rodapé */
.bottom {
  position: sticky; bottom: 0; z-index: 5;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 6px 20px; font-size: 13px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--line);
}
.status { display: flex; align-items: center; gap: 8px; }
.status .spinner { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.status.busy .spinner { background: var(--run); animation: pulse 1s infinite; }
.status.error .spinner { background: var(--err); }
.status button { padding: 0 8px; border-color: var(--run); color: var(--run); }
.auto { display: flex; gap: 6px; align-items: center; color: var(--muted); }
.auto input { accent-color: var(--accent); }
.muted { color: var(--muted); }
#version { margin-left: auto; }
.toast {
  position: fixed; left: 50%; bottom: 56px; transform: translate(-50%, 20px);
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px;
  opacity: 0; pointer-events: none; transition: all .2s; font-size: 14px;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  .top { padding: 8px 16px; gap: 8px; }
  .layout { padding: 12px 16px; }
  body.show-ref .layout { flex-direction: column; }
  body.show-ref .ref { width: 100%; flex: none; position: static; max-height: 60vh; order: -1; }
  .bottom { padding: 6px 16px; }
  .math { font-size: 16px; }
  #version { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">∮</span><span>Cauchy</span></div>
  <input id="title" class="title" data-i18n-aria="title.a" value="">
  <nav class="actions">
    <button id="run-all" data-i18n="run-all" data-i18n-title="run-all.t"></button>
    <button id="add" data-i18n="add" data-i18n-title="add.t"></button>
    <select id="examples"></select>
    <button id="new" data-i18n="new" data-i18n-title="new.t"></button>
    <button id="import" data-i18n="import" data-i18n-title="import.t"></button>
    <button id="export" data-i18n="export" data-i18n-title="export.t"></button>
    <button id="share" data-i18n="share" data-i18n-title="share.t"></button>
    <button id="help" data-i18n="help" data-i18n-title="help.t"></button>
    <button id="theme" class="icon" data-i18n-title="theme.t" data-i18n-aria="theme.t"></button>
    <select id="lang" data-i18n-aria="lang.a"><option value="pt">PT</option><option value="en">EN</option></select>
  </nav>
</header>
<div class="layout">
  <main id="cells" class="cells"></main>
  <aside class="ref">
    <div class="ref-head">
      <input id="ref-filter" data-i18n-ph="ref.search" type="search">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="functions" data-i18n="ref.functions" class="active"></button>
        <button role="tab" data-tab="flint" data-i18n="ref.flint"></button>
        <button role="tab" data-tab="syntax" data-i18n="ref.syntax"></button>

const ORDERS = ['lex', 'deglex', 'degrevlex'];

// Polinômios em várias variáveis (ZZ, QQ ou Z/nZ). Os nomes das variáveis e a
// ordem monomial ficam aqui; a FLINT só conhece os índices.
class MPolyRing extends Ring {
  constructor(base, vars, order) {
    const tag = MPOLY_TAG[base.tag];
    if (!tag) fail(`polinômios em várias variáveis sobre ${base} não são suportados (use ZZ, QQ ou Zmod(n))`);
    const ord = ORDERS.indexOf(order);
    const ctx = tag === 'zmod_mpoly'
      ? F.raw('mctx_new_zmod_mpoly', vars.length, ord, base.n.ptr)
      : F.raw(`mctx_new_${tag}`, vars.length, ord);
    super(tag, ctx);
    this.base = base;
    this.vars = vars;
    this.order = order;
    this.name = `${base}[${vars.join(', ')}${order === 'degrevlex' ? '' : `, order = "${order}"`}]`;
  }

  get nvars() { return this.vars.length; }
  index(v) { return this.vars.indexOf(v); }

  // Elementos de S que vêm para cá: escalares, R[x] e R[x, ...] com variáveis
  // contidas nas deste anel.
  accepts(S) {
    if (S === this) return true;
    if (S instanceof MPolyRing) return S.vars.every((v) => this.vars.includes(v)) && this.acceptsBase(S.base);
    if (S instanceof PolyRing) return this.vars.includes(S.v) && this.acceptsBase(S.base);
    if (S instanceof MatSpace) return false;
    return this.acceptsBase(S);
  }

  acceptsBase(S) {
    return this.base.accepts(S) || (this.base instanceof ZmodRing && S === QQ);
  }

  coerce(x) {
    const S = x.ring;
    if (S === this) return x;
    if (S instanceof MPolyRing) {
      const map = S.vars.map((v) => this.index(v));
      if (map.includes(-1)) fail(`não é possível converter ${S} em ${this}`);
      return this.fromTerms(S.terms(x).map(({ c, e }) => {
        const f = new Array(this.nvars).fill(0);
        e.forEach((k, i) => { f[map[i]] = k; });
        return { c, e: f };
      }));
    }
    if (S instanceof PolyRing) {
      const j = this.index(S.v);
      if (j < 0) fail(`não é possível converter ${S} em ${this}`);
      return this.fromTerms(S.coeffs(x).map((c, i) => {
        const e = new Array(this.nvars).fill(0);
        e[j] = i;
        return { c, e };
      }));
    }
    if (this.acceptsBase(S)) return this.constant(x);
    return super.coerce(x);
  }

  constant(c) {
    return this.wrap(F.raw(`const_${this.tag}`, coerce(c, this.base).ptr, this.ctx));
  }

  len(p) { return F.raw(`len_${this.tag}`, p.ptr, this.ctx); }

  // Termos na ordem monomial do anel (do maior para o menor): [{c, e}].
  terms(p) {
    const n = this.len(p);
    const k = this.nvars;
    const buf = F.M._malloc(8 * Math.max(1, k));
    try {
      const out = [];
      for (let i = 0; i < n; i++) {
        if (!F.raw(`term_exp_${this.tag}`, p.ptr, i, buf, this.ctx)) fail('expoente grande demais');
        const e = Array.from(F.M.HEAPU32.subarray(buf >> 2, (buf >> 2) + k));
        out.push({ c: this.base.wrap(F.raw(`term_coeff_${this.tag}`, p.ptr, i, this.ctx)), e });
      }
      return out;
    } finally {
      F.M._free(buf);
    }
  }

  fromTerms(terms) {
    const p = this.wrap(F.raw(`new_${this.tag}`, this.ctx));
    const k = this.nvars;
    const buf = F.M._malloc(4 * Math.max(1, k));
    try {
      for (const { c, e } of terms) {
        for (let i = 0; i < k; i++) F.M.HEAPU32[(buf >> 2) + i] = e[i];
        F.raw(`push_${this.tag}`, p.ptr, coerce(c, this.base).ptr, buf, this.ctx);
      }
      F.raw(`finish_${this.tag}`, p.ptr, this.ctx);
    } finally {
      F.M._free(buf);
    }
    return p;
  }

  gen(i = 0) { return this.wrap(F.raw(`gen_${this.tag}`, i, this.ctx)); }
  gens() { return this.vars.map((_, i) => this.gen(i)); }

  // Constante (todos os expoentes nulos)? Devolve o coeficiente ou null.
  constantValue(p) {
    const n = this.len(p);
    if (n === 0) return this.base.zero();
    if (n > 1 || this.totalDegree(p) !== 0) return null;
    return this.terms(p)[0].c;
  }

  totalDegree(p) { return this.op(`${this.tag}_total_degree`, p); }
  degreeIn(p, i) { return this.op(`${this.tag}_degree`, p, i); }
  degree(p) { return this.len(p) ? this.totalDegree(p) : -1; }

  // Variáveis que aparecem em p (índices).
  usedVars(p) {
    const used = new Set();
    for (let i = 0; i < this.nvars; i++) if (this.len(p) && this.degreeIn(p, i) > 0) used.add(i);
    return [...used];
  }

  scalarMul(p, c) { return this.op(`${this.tag}_scalar_mul`, p, coerce(c, this.base)); }
  pow(p, e) { return this.op(`${this.tag}_pow`, p, e); }
  isZero(p) { return this.len(p) === 0; }
  isField() { return false; }
  requirePrime(what) {
    if (this.base instanceof ZmodRing && !this.base.prime) fail(`${what} em ${this} requer n primo`);
  }
}

class MatSpace extends Ring {
  constructor(base) {
    const tag = MAT_TAG[base.tag];
    if (!tag) fail(`matrizes sobre ${base} não são suportadas`);
    super(tag, base.ctx);
    this.base = base;
    this.name = `Mat(${base})`;
  }

  accepts(S) {
    return S === this || (S instanceof MatSpace && this.base.accepts(S.base));
  }

  coerce(x) {
    const S = x.ring;
    if (S === this) return x;
    if (S instanceof MatSpace && this.base.accepts(S.base)) {
      const special = MAT_CONV[`${S.tag}>${this.tag}`];
      if (special) return special(this, x);
      return this.fromRows(S.rows(x).map((r) => r.map((e) => this.base.coerce(e))));
    }
    return super.coerce(x);
  }

  nrows(m) { return F.raw(`nrows_${this.tag}`, m.ptr, this.ctx); }
  ncols(m) { return F.raw(`ncols_${this.tag}`, m.ptr, this.ctx); }
  entry(m, i, j) { return this.base.wrap(F.raw(`entry_${this.tag}`, m.ptr, i, j, this.ctx)); }
  rows(m) {
    const r = this.nrows(m), c = this.ncols(m);
    const out = [];
    for (let i = 0; i < r; i++) {
      const row = [];
      for (let j = 0; j < c; j++) row.push(this.entry(m, i, j));
      out.push(row);
    }
    return out;
  }

  alloc(r, c) { return this.wrap(F.raw(`new_${this.tag}`, r, c, this.ctx)); }

  fromRows(rows) {
    const r = rows.length;
    const c = r ? rows[0].length : 0;
    for (const row of rows) if (row.length !== c) fail('linhas da matriz com tamanhos diferentes');
    const m = this.alloc(r, c);
    rows.forEach((row, i) => row.forEach((e, j) => {
      F.raw(`setentry_${this.tag}`, m.ptr, i, j, this.base.coerce(e).ptr, this.ctx);
    }));
    return m;
  }

  identity(n) {
    const one = this.base.one();
    const m = this.alloc(n, n);
    for (let i = 0; i < n; i++) F.raw(`setentry_${this.tag}`, m.ptr, i, i, one.ptr, this.ctx);
    return m;
  }

  scalarMul(m, c) {
    c = this.base.coerce(c);
    if (this.has('scalar_mul')) return this.op(`${this.tag}_scalar_mul`, m, c);
    return this.fromRows(this.rows(m).map((r) => r.map((e) => this.base.mul(e, c))));
  }

  mul(a, b) {
    if (this.ncols(a) !== this.nrows(b)) {
      fail(`dimensões incompatíveis: ${this.nrows(a)}×${this.ncols(a)} · ${this.nrows(b)}×${this.ncols(b)}`);
    }
    return this.op(`${this.tag}_mul`, a, b);
  }

  checkSame(a, b) {
    if (this.nrows(a) !== this.nrows(b) || this.ncols(a) !== this.ncols(b)) {
      fail(`dimensões incompatíveis: ${this.nrows(a)}×${this.ncols(a)} e ${this.nrows(b)}×${this.ncols(b)}`);
    }
  }

  add(a, b) { this.checkSame(a, b); return super.add(a, b); }
  sub(a, b) { this.checkSame(a, b); return super.sub(a, b); }
  eq(a, b) {
    if (this.nrows(a) !== this.nrows(b) || this.ncols(a) !== this.ncols(b)) return false;
    return super.eq(a, b);
  }
  neg(a) {
    if (this.has('neg')) return super.neg(a);
    return this.scalarMul(a, this.base.fromInt(-1));
  }
  isSquare(a) { return this.nrows(a) === this.ncols(a); }
}

const POLY_CONV = {
  'fmpz_poly>fmpq_poly': (R, x) => R.op('fmpq_poly_set_fmpz_poly', x),
  'fmpq_poly>arb_poly': (R, x) => R.op('arb_poly_set_fmpq_poly', x),
  'fmpz_poly>arb_poly': (R, x) => R.op('arb_poly_set_fmpq_poly', QQx(x.ring.v).coerce(x)),
  'fmpq_poly>acb_poly': (R, x) => R.op('acb_poly_set_fmpq_poly', x),
  'fmpz_poly>acb_poly': (R, x) => R.op('acb_poly_set_fmpq_poly', QQx(x.ring.v).coerce(x)),
  'arb_poly>acb_poly': (R, x) => R.op('acb_poly_set_arb_poly', x),
  'fmpz_poly>zmod_poly': (R, x) => R.op('zmod_poly_set_fmpz_poly', x),
};

const MAT_CONV = {
  'fmpz_mat>fmpq_mat': (R, x) => R.op('fmpq_mat_set_fmpz_mat', x),
  'fmpq_mat>arb_mat': (R, x) => R.op('arb_mat_set_fmpq_mat', x),
  'fmpz_mat>arb_mat': (R, x) => R.op('arb_mat_set_fmpq_mat', Mat(QQ).coerce(x)),
  'arb_mat>acb_mat': (R, x) => R.op('acb_mat_set_arb_mat', x),
  'fmpz_mat>zmod_mat': (R, x) => R.op('zmod_mat_set_fmpz_mat', x),
};

const ZZ = new IntegerRing();
const QQ = new RationalField();
const RR = new RealField();
const CC = new ComplexField();
for (const R of [ZZ, QQ, RR, CC]) {
  R.key = R.name;
  cache.set(R.name, R);
}

const STD_BY_TAG = { fmpz: () => ZZ, fmpq: () => QQ, arb: () => RR, acb: () => CC };

// Anéis criados fora de arenas: seus parâmetros (n, p) são permanentes.
function permanent(fn) {
  const saved = F.arena;
  F.arena = null;
  try {
    return fn();
  } finally {
    F.arena = saved;
  }
}

function Zmod(n) {
  const key = `Zmod(${ZZ.toStr(n)})`;
  return intern(key, () => {
    if (ZZ.cmp(n, ZZ.fromInt(1)) <= 0) fail('Zmod(n) requer n > 1');
    return permanent(() => new ZmodRing(ZZ.copy(n)));
  });
}

function GF(p, k = 1, v = 'a') {
  const key = `GF(${ZZ.toStr(p)},${k},${v})`;
  return intern(key, () => permanent(() => new FiniteField(ZZ.copy(p), k, v)));
}

function Poly(base, v) {
  return intern(`${base.key}[${v}]`, () => new PolyRing(base, v));
}

// R[x, y, ...]; com uma só variável é o anel univariado R[x].
function MPoly(base, vars, order = 'degrevlex') {
  if (new Set(vars).size !== vars.length) fail('variáveis repetidas');
  if (!ORDERS.includes(order)) fail(`ordem monomial desconhecida: ${order} (use lex, deglex ou degrevlex)`);
  if (vars.length === 1) return Poly(base, vars[0]);
  return intern(`${base.key}[${vars.join(',')};${order}]`, () => new MPolyRing(base, vars, order));
}

function Mat(base) {
  return intern(`Mat(${base.key})`, () => new MatSpace(base));
}

const QQx = (v) => Poly(QQ, v);

// ------------------------------------------------------------ coerção

function isScalarRing(R) {
  return !(R instanceof PolyRing) && !(R instanceof MPolyRing) && !(R instanceof MatSpace);
}

const isPolyRing = (R) => R instanceof PolyRing || R instanceof MPolyRing;
const varsOf = (R) => (R instanceof MPolyRing ? R.vars : R instanceof PolyRing ? [R.v] : []);

function commonRing(A, B) {
  if (A === B) return A;
  if (B.accepts(A)) return B;
  if (A.accepts(B)) return A;
  if (A instanceof MatSpace || B instanceof MatSpace) {
    if (A instanceof MatSpace && B instanceof MatSpace) return Mat(commonRing(A.base, B.base));
    fail(`não há anel comum para ${A} e ${B}`);
  }
  // Variáveis diferentes (ou algum lado já multivariado): junta as variáveis.
  if (A instanceof MPolyRing || B instanceof MPolyRing ||
      (A instanceof PolyRing && B instanceof PolyRing && A.v !== B.v)) {
    const vars = [...varsOf(A)];
    for (const v of varsOf(B)) if (!vars.includes(v)) vars.push(v);
    const base = commonRing(isPolyRing(A) ? A.base : A, isPolyRing(B) ? B.base : B);
    const order = A instanceof MPolyRing ? A.order : B instanceof MPolyRing ? B.order : 'degrevlex';
    return MPoly(base, vars, order);
  }
  if (A instanceof PolyRing || B instanceof PolyRing) {
    const va = A instanceof PolyRing ? A.v : null;
    const vb = B instanceof PolyRing ? B.v : null;
    if (va && vb && va !== vb) fail(`polinômios em variáveis diferentes: ${A} e ${B}`);
    const base = commonRing(A instanceof PolyRing ? A.base : A, B instanceof PolyRing ? B.base : B);
    return Poly(base, va ?? vb);
  }
  if (A instanceof ZmodRing && B === QQ) return A;
  if (B instanceof ZmodRing && A === QQ) return B;
  if (A instanceof FiniteField && B instanceof ZmodRing && ZZ.cmp(B.n, A.p) === 0) return A;
  if (B instanceof FiniteField && A instanceof ZmodRing && ZZ.cmp(A.n, B.p) === 0) return B;
  fail(`não há anel comum para ${A} e ${B}`);
}

function coerce(x, R) {
  if (x.ring === R) return x;
  if (R instanceof MPolyRing && R.accepts(x.ring)) return R.coerce(x);
  if (R instanceof ZmodRing && x.ring === QQ) return R.coerce(x);
  if (R instanceof FiniteField && x.ring instanceof ZmodRing) return R.coerce(x);
  if (!R.accepts(x.ring)) fail(`não é possível converter ${x.ring} em ${R}`);
  return R.coerce(x);
}

function unify(a, b) {
  const R = commonRing(a.ring, b.ring);
  return [R, coerce(a, R), coerce(b, R)];
}

// --------------------------------------------------------- aritmética

function add(a, b) {
  const [R, x, y] = unify(a, b);
  return R.add(x, y);
}

function sub(a, b) {
  const [R, x, y] = unify(a, b);
  return R.sub(x, y);
}

function neg(a) {
  return a.ring.neg(a);
}

function mul(a, b) {
  const A = a.ring, B = b.ring;
  // Escalar × matriz e escalar × polinômio sem promover o escalar.
  if (A instanceof MatSpace && !(B instanceof MatSpace)) return scalarMat(a, b);
  if (B instanceof MatSpace && !(A instanceof MatSpace)) return scalarMat(b, a);
  const [R, x, y] = unify(a, b);
  return R.mul(x, y);
}

function scalarMat(m, c) {
  const base = commonRing(m.ring.base, c.ring);
  const S = Mat(base);
  return S.scalarMul(coerce(m, S), coerce(c, base));
}

function isZero(x) {
  const R = x.ring;
  if (R === ZZ) return ZZ.isZero(x);
  if (R === QQ) return QQ.isZero(x);
  if (R === RR) return F.raw('arb_cmp3', x.ptr, RR.zero().ptr, 0) === 1;
  if (R === CC) return F.raw('acb_eq3', x.ptr, CC.zero().ptr) === 1;
  if (R instanceof PolyRing || R instanceof MPolyRing) return R.len(x) === 0;
  return R.eq(x, R.zero());
}

function div(a, b) {
  const A = a.ring, B = b.ring;
  if (A instanceof MatSpace && isScalarRing(B)) return mul(a, inv(b));
  if (B instanceof MatSpace) return mul(a, inv(b));
  let [R, x, y] = unify(a, b);
  if (R === ZZ) {
    if (ZZ.isZero(y)) fail('divisão por zero');
    return QQ.op('fmpq_div', QQ.coerce(x), QQ.coerce(y));
  }
  if (R === QQ) {
    if (QQ.isZero(y)) fail('divisão por zero');
    return QQ.op('fmpq_div', x, y);
  }
  if (R === RR || R === CC || R instanceof ZmodRing || R instanceof FiniteField) {
    if (R instanceof ZmodRing && ZZ.isZero(y)) fail('divisão por zero');
    return R.div ? R.div(x, y) : R.op(`${R.tag}_div`, x, y);
  }
  if (R instanceof PolyRing) return polyDiv(R, x, y);
  if (R instanceof MPolyRing) return mpolyDiv(R, x, y);
  fail(`divisão não suportada em ${R}`);
}

function mpolyDiv(R, x, y) {
  if (R.isZero(y)) fail('divisão por zero');
  const c = R.constantValue(y);
  if (c !== null) {
    if (R.base === ZZ) return mpolyDiv(MPolyQQ(R), coerce(x, MPolyQQ(R)), coerce(y, MPolyQQ(R)));
    return R.scalarMul(x, inv(c));
  }
  R.requirePrime('divisão');
  try {
    return R.op(`${R.tag}_divides`, x, y);
  } catch (e) {
    if (R.base === ZZ) return mpolyDiv(MPolyQQ(R), coerce(x, MPolyQQ(R)), coerce(y, MPolyQQ(R)));
    if (/divisão não exata/.test(e.message)) fail('divisão não exata de polinômios; use divrem, quo ou rem');
    throw e;
  }
}

const MPolyQQ = (R) => MPoly(QQ, R.vars, R.order);

// Divisão de a pelos polinômios bs (algoritmo de divisão multivariado na
// ordem do anel): [[q1, ...], r] com a = Σ qi·bi + r.
function mdivrem(a, bs) {
  let R = a.ring;
  for (const b of bs) R = commonRing(R, b.ring);
  if (!(R instanceof MPolyRing)) fail('divrem com lista de divisores requer polinômios em várias variáveis');
  if (R.base === ZZ) R = MPolyQQ(R);
  R.requirePrime('divrem');
  const n = bs.length;
  const arr = F.M._malloc(4 * Math.max(1, n));
  try {
    const ys = bs.map((b) => coerce(b, R));
    ys.forEach((y, i) => { F.M.HEAPU32[(arr >> 2) + i] = y.ptr; });
    const v = F.vec(F.raw(`divrem_ideal_${R.tag}`, coerce(a, R).ptr, arr, n, R.ctx)).map((p) => R.wrap(p));
    return [v.slice(1), v[0]];
  } finally {
    F.M._free(arr);
  }
}

function polyDiv(R, x, y) {
  if (R.len(y) === 0) fail('divisão por zero');
  if (R.len(y) === 1) {
    // Divisão por constante.
    const c = R.coeff(y, 0);
    if (R.base === ZZ) return polyDiv(Poly(QQ, R.v), coerce(x, Poly(QQ, R.v)), coerce(y, Poly(QQ, R.v)));
    return R.scalarMul(x, inv(c));
  }
  if (R.base === ZZ) {
    try {
      return R.op('fmpz_poly_divides', x, y);
    } catch {
      return polyDiv(Poly(QQ, R.v), coerce(x, Poly(QQ, R.v)), coerce(y, Poly(QQ, R.v)));
    }
  }
  if (R.base === RR || R.base === CC) fail('divisão de polinômios reais/complexos: use divrem(p, q)');
  const [q, r] = divrem(x, y);
  if (R.len(r) !== 0) fail('divisão não exata de polinômios; use divrem, quo ou rem');
  return q;
}

function divrem(a, b) {
  let [R, x, y] = unify(a, b);
  if (R instanceof MPolyRing) {
    const [[q], r] = mdivrem(x, [y]);
    return [q, r];
  }
  if (R === ZZ) {
    return F.vec(F.raw('divrem_fmpz', x.ptr, y.ptr, 0)).map((p) => ZZ.wrap(p));
  }
  if (R instanceof PolyRing) {
    if (R.base === ZZ) {
      R = Poly(QQ, R.v);
      x = coerce(x, R);
      y = coerce(y, R);
    }
    if (R.base instanceof ZmodRing && !R.base.prime) fail('divrem em Z/nZ[x] requer n primo');
    F.raw('set_prec', F.prec);
    return F.vec(F.raw(`divrem_${R.tag}`, x.ptr, y.ptr, R.ctx)).map((p) => R.wrap(p));
  }
  fail(`divrem não suportado em ${R}`);
}

function inv(a) {
  const R = a.ring;
  if (R === ZZ || R === QQ) {
    if (isZero(a)) fail('divisão por zero');
    return QQ.op('fmpq_inv', QQ.coerce(a));
  }
  if (R === RR) return RR.op('arb_div', RR.one(), a);
  if (R === CC) return CC.op('acb_div', CC.one(), a);
  if (R instanceof ZmodRing) return R.op('zmod_inv', a);
  if (R instanceof FiniteField) return R.div(R.one(), a);
  if (R instanceof MatSpace) return matInv(a);
  if (R instanceof PolyRing && R.len(a) === 1) return R.fromCoeffs([inv(R.coeff(a, 0))]);
  if (R instanceof MPolyRing) {
    const c = R.constantValue(a);
    if (c !== null) return coerce(inv(c), R.base === ZZ ? MPolyQQ(R) : R);
  }
  fail(`inverso não suportado em ${R}`);
}

function matInv(m) {
  let R = m.ring;
  if (!R.isSquare(m)) fail('a matriz deve ser quadrada');
  if (R.base === ZZ) {
    R = Mat(QQ);
    m = coerce(m, R);
  }
  switch (R.tag) {
    case 'fmpq_mat': return R.wrap(F.raw('fmpq_mat_inv', m.ptr));
    case 'arb_mat': return R.wrap(F.raw('arb_mat_inv', m.ptr, F.prec));
    case 'acb_mat': return R.wrap(F.raw('acb_mat_inv', m.ptr, F.prec));
    case 'zmod_mat': return R.wrap(F.raw('zmod_mat_inv', m.ptr, R.ctx));
    case 'fq_mat': return R.wrap(F.raw('fq_mat_inv', m.ptr, R.ctx));
  }
  fail(`inversa não suportada em ${R}`);
}

// Expoente: Elem de ZZ (ou QQ/RR/CC para potências reais).
function pow(a, e) {
  const A = a.ring;
  if (e.ring === ZZ) {
    const n = ZZ.toSmall(e);

  const pick = (a, b, takeB) => {

      for (let i = 0; i < Math.min(a.length, b.length); i++) {

  // --------------------------------------------------------- acesso direto à FLINT
  // flint("arb_gamma", x): chama um binding de bindings.def, convertendo os

  const tagRing = (tag, base, v, mring) => {
    if (tag.endsWith('_mpoly')) {

  // --------------------------------------------------------- strings e tipos

  def('error', 1, ([m]) => fail(String(typeof m === 'string' ? m : showText(m))), 'error(msg): interrompe com erro');
  def('assert', null, ([c, m]) => (toBool(c) ? true : fail(m ? String(m) : 'asserção falhou')), 'assert(cond, msg)');

  // --------------------------------------------------------- gráficos
  const toNum = (v) => {

      const xy = [RR.mid(CC.re(c)), RR.mid(CC.im(c))];
      if (xy.every(Number.isFinite)) return xy;

    fail(`${what} deve ser um número complexo ou uma tupla (x, y)`);

  const is3 = (p) => unw(p) instanceof Tuple && unw(p).items.length === 3;
  const pt3 = (p, what = 'ponto') => {
    p = unw(p);
    if (p instanceof Tuple && p.items.length === 3) {

  const ptsDrag = (ps) => {
    const raw = list(unw(ps)).map(unw);

  const real = (v, what) => {

  // Atributos visuais, validados aqui e interpretados por src/ui/plot.js.

  const two = (a, b) => drags([[0, a], [1, b]]);
  def('point', 1, ([p], kw) => prim('points', { pts: [ptN(p)], ...drags([[0, p]]) }, kw), 'point(p): ponto (complexo, tupla (x, y) ou (x, y, z))');

  def('segment', 2, ([a, b], kw) => prim('line', { pts: pts([a, b], 2, 'segment'), ...two(a, b) }, kw), 'segment(a, b): segmento de a a b');

  def('circle', 2, ([c, r], kw) => only2d(c, 'circle') ?? prim('circle', { c: pt(c, 'centro'), r: positive(r, 'raio'), ...drags([['c', c]]) }, kw), 'circle(c, r): circunferência');

  // Conjunto zero de p(x, y): fatoração exata na FLINT (cada fator irredutível

  const IMPLICIT_OPTS = ['xlim', 'ylim', 'resolution', 'vars'];
  def('implicitplot', 1, ([p], kw) => {
    if (!isPoly(p)) fail('implicitplot espera um polinômio em x e y');
    const R = p.ring;
    if (R.base !== ZZ && R.base !== QQ) fail('implicitplot requer coeficientes em ZZ ou QQ');
    const names = R instanceof MPolyRing ? R.vars : [R.v];

    if (kw.vars !== undefined) {
      axes = iterable(kw.vars).map(varName);

  // Fatores irredutíveis (com multiplicidade) de um polinômio de ZZ/QQ.
  const factored0 = (p) => env.lookup('factor').impl([p]);
  // Matriz C[i][j] (coeficiente de u^i v^j, normalizada) ou null se constante.
  const denseFloat = (q, [u, v]) => {
    const R = q.ring;
    const terms = termsOf(q);
    const iu = R instanceof MPolyRing ? R.index(u) : R.v === u ? 0 : -1;
    const iv = R instanceof MPolyRing ? R.index(v) : R.v === v ? 0 : -1;
    const eu = (e) => (iu < 0 ? 0 : e[iu]), ev = (e) => (iv < 0 ? 0 : e[iv]);
    const dx = Math.max(...terms.map(({ e }) => eu(e))), dy = Math.max(...terms.map(({ e }) => ev(e)));
    if (dx === 0 && dy === 0) return null;
    const C = Array.from({ length: dx + 1 }, () => new Array(dy + 1).fill(0));
    let big = 0;
    for (const { c, e } of terms) {
      const d = c.ring.toNumber(c);
      if (!Number.isFinite(d)) fail('implicitplot: coeficientes grandes demais');
      C[eu(e)][ev(e)] = d;
      big = Math.max(big, Math.abs(d));
    }
    for (const row of C) for (let j = 0; j < row.length; j++) row[j] /= big;
    return C;
  };
  def('text', 2, ([str, p], kw) => {
    const POS = ['c', 'n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'];
    const pos = kw.pos ?? 'c';
    if (!POS.includes(pos)) fail(`pos deve ser um de: ${POS.join(', ')}`);
    return prim('text', { s: typeof str === 'string' ? str : showText(str), p: ptN(p), pos, ...drags([['p', p]]) }, kw, ['pos']);
  }, 'text(s, p, pos="c"): texto no ponto p');
  def('group', null, (args, kw) => {
    const g = graphic(args, 'group');
    return new Graphic([{ g: 'group', items: g.items, ...(g.is3d ? { d3: true } : {}), attrs: attrsOf(kw) }], g.opts);
  }, 'group(g₁, g₂, …, attrs): grupo; atributos valem para os filhos que não os definem');
  def('style', 1, ([g], kw) => {
    const a = attrsOf(kw);
    const apply = (it) => ({ ...it, attrs: { ...it.attrs, ...a }, ...(it.items ? { items: it.items.map(apply) } : {}) });
    const G = graphic(g, 'style');

  def('draw', null, ([g], kw) => {
    const G = graphic(g ?? [], 'draw');
    const opts = { ...G.opts };
    const lim = limits(kw);
    if (lim.xlim) opts.xlim = lim.xlim;
    if (lim.ylim) opts.ylim = lim.ylim;
    if (lim.zlim) opts.zlim = lim.zlim;
    for (const [k, v] of Object.entries(kw)) {
      if ((k === 'zlim' || k === 'box') && !G.is3d) fail(`${k} só vale para gráficos 3D`);
      if (k === 'xlim' || k === 'ylim' || k === 'zlim') continue;
      if (k === 'aspect') {
        if (v !== 'equal' && v !== 'auto') fail('aspect deve ser "equal" ou "auto"');

      } else if (k === 'axes' || k === 'grid' || k === 'frame' || k === 'box') opts[k] = toBool(v, k);
      else if (k === 'title') opts.title = typeof v === 'string' ? v : showText(v);
      else if (k === 'width' || k === 'height') opts[k] = Math.min(2000, Math.max(100, positive(v, k)));

  }, 'draw(g, xlim=, ylim=, zlim=, aspect="equal", axes=true, grid=true, frame=true, box=true, title=, width=, height=)');
  const unit = (v, what) => {
    const x = real(v, what);
    if (x < 0 || x > 1) fail(`${what} deve estar entre 0 e 1`);
    return x;
  };
  def('rgb', 3, ([r, g, b]) => `rgb(${[r, g, b].map((v) => Math.round(unit(v, 'componente de cor') * 255)).join(', ')})`,
    'rgb(r, g, b): cor com componentes em [0, 1]');
  def('hsl', 3, ([h, s, l]) => {
    const hh = ((real(h, 'matiz') % 1) + 1) % 1;

  // Transformações: afins são exatas (círculos continuam círculos sob
  // semelhanças); funções arbitrárias amostram e mapeiam cada ponto.
  const withItems = (g, what, f) => {
    const G = graphic(g, what);
    if (G.is3d) fail(`${what} ainda não aceita gráficos 3D`);
    return new Graphic(f(G.items), G.opts);
  };
  const center = (c) => (c === undefined ? [0, 0] : pt(c, 'centro'));
  def('translate', 2, ([g, v]) => withItems(g, 'translate', (items) => affineItems(items, affine.translate(...pt(v, 'deslocamento')))),
    'translate(g, v): desloca g pelo vetor v');
  def('rotate', null, ([g, t, c]) => {
    const th = real(t, 'ângulo');
    return withItems(g, 'rotate', (items) => affineItems(items, affine.rotate(th, ...center(c))));
  }, 'rotate(g, θ, c=0): gira g de θ radianos em torno de c');
  def('scale', null, ([g, k, c]) => {
    const [kx, ky] = k instanceof Tuple ? pt(k, 'fator') : [real(k, 'fator'), real(k, 'fator')];
    if (kx === 0 || ky === 0) fail('fator de escala não pode ser zero');
    return withItems(g, 'scale', (items) => affineItems(items, affine.scale(kx, ky, ...center(c))));
  }, 'scale(g, k, c=0): homotetia de razão k (ou (kx, ky)) com centro c');
  def('reflect', 3, ([g, a, b]) => {
    const [p, q] = distinct(pt(a), pt(b));
    return withItems(g, 'reflect', (items) => affineItems(items, affine.reflect(...p, ...q)));
  }, 'reflect(g, a, b): reflexão na reta por a e b');
  def('transform', null, ([g, f], kw) => {
    if (f instanceof Elem && f.ring instanceof MatSpace) {
      const rows = f.ring.rows(f);
      if (rows.length !== 2 || rows[0].length !== 2) fail('transform espera uma matriz 2×2');
      const [[a, b], [c, d]] = rows.map((r) => r.map((x) => real(x, 'entrada da matriz')));
      if (a * d - b * c === 0) fail('a matriz de transform deve ser invertível');
      return withItems(g, 'transform', (items) => affineItems(items, affine.linear(a, b, c, d)));
    }
    fn(f);
    const steps = kw.steps !== undefined ? Math.max(1, Math.min(256, toInt(kw.steps, 'steps'))) : null;
    const map = ([x, y]) => {
      try {
        return sharp(callValue(f, [CC.fromParts(RR.fromNumber(x), RR.fromNumber(y))]));
      } catch (e) {
        if (e.name === 'CauchyError' && /recursão/.test(e.message)) throw e;
        return null;
      }
    };
    return withItems(g, 'transform', (items) => flint().withPrec(64, () => mapItems(items, map, { steps })));
  }, 'transform(g, z -> f(z), steps=) ou transform(g, A): imagem de g por uma função complexa ou matriz 2×2');

  // Gráficos de funções e dados: produzem primitivas marcadas como séries
  // de dados (intervalo vertical robusto e leitura de coordenadas por x).
  const PLOT_OPTS = ['points', 'xlim', 'ylim', 'title', 'joined'];
  const plotOpts = (kw, aspect) => ({ aspect, title: kw.title ?? null, ...limits(kw) });
  def('plot', null, ([fs, a, b], kw) => {
    const funcs = Array.isArray(fs) ? fs : [fs];
    const n = kw.points ? toInt(kw.points) : 400;
    const extra = attrsOf(kw, PLOT_OPTS);
    const items = funcs.map((f, i) => ({
      g: 'line', data: true, pts: sample(fn(f), a, b, n),
      attrs: { color: (i % 6) + 1, ...(funcs.length > 1 ? { label: f.name ?? `f${i + 1}` } : {}), ...extra },
    }));
    return new Graphic(items, plotOpts(kw, 'auto'));
  }, 'plot(f, a, b) ou plot([f, g], a, b, points=400, xlim=[lo, hi], ylim=[lo, hi], attrs)');
  def('listplot', null, ([xs], kw) => {
    const points = list(xs).map((p, i) => {
      if (p instanceof Tuple) return [toNum(p.items[0]), toNum(p.items[1])];
      return [i + 1, toNum(p)];
    }).map(([x, y]) => [x, Number.isFinite(y) ? y : null]);
    const item = { g: kw.joined === true ? 'line' : 'points', data: true, pts: points, attrs: { color: 1, ...attrsOf(kw, PLOT_OPTS) } };
    return new Graphic([item], plotOpts(kw, 'auto'));
  }, 'listplot(ys) ou listplot([(x, y), ...], joined=false, xlim=, ylim=, attrs)');
  def('complexplot', null, ([zs], kw) => {
    const points = list(zs).map((z) => {
      const c = CC.coerce(elem(z));
      return [RR.mid(CC.re(c)), RR.mid(CC.im(c))];
    });
    return new Graphic([{ g: 'points', pts: points, attrs: { color: 1, ...attrsOf(kw, PLOT_OPTS) } }], plotOpts(kw, 'equal'));
  }, 'complexplot(zs, xlim=, ylim=, attrs): pontos no plano complexo');

  // --------------------------------------------------------- gráficos 3D
  // Retas e planos viajam como dados e são recortados pela caixa da cena na
  // UI (plot3d.js); superfícies são grades (nu + 1)×(nv + 1) de vértices em
  // Float32Array, com NaN onde a função não está definida.
  const vec3 = (v, what) => {
    const p = pt3(v, what);
    if (p.every((x) => x === 0)) fail(`${what} não pode ser nulo`);
    return p;
  };
  def('plane', 2, ([p, n], kw) => prim('plane', { p: pt3(p), n: vec3(n, 'normal') }, kw), 'plane(p, n): plano por p com normal n');
  def('sphere', 2, ([c, r], kw) => prim('sphere', { c: pt3(c, 'centro'), r: positive(r, 'raio') }, kw), 'sphere(c, r): esfera');
  const range2 = (v, what) => {
    const ab = iterable(v ?? fail(`${what}: faltou o intervalo [lo, hi]`)).map(toNum);
    if (ab.length !== 2 || !ab.every(Number.isFinite) || !(ab[1] > ab[0])) fail(`${what} deve ser [lo, hi] com lo < hi`);

  };
  const gridSize = (kw, n0) => {
    if (kw.points === undefined) return [n0, n0];

    if (ns.length !== 2) fail('points deve ser n ou [nu, nv]');
    return ns.map((n) => Math.min(400, Math.max(2, toInt(n, 'points'))));

  // Amostra f(u, v) na grade; val converte o valor em [x, y, z] ou null.
  const grid3 = (f, [u0, u1], [v0, v1], [nu, nv], val) => {
    const pos = new Float32Array((nu + 1) * (nv + 1) * 3).fill(NaN);
    flint().withPrec(64, () => {
      for (let i = 0; i <= nu; i++) {
        const u = u0 + ((u1 - u0) * i) / nu;
        for (let j = 0; j <= nv; j++) {
          const v = v0 + ((v1 - v0) * j) / nv;
          let w;
          try {
            w = callValue(f, [RR.fromNumber(u), RR.fromNumber(v)]);
          } catch (e) {
            if (e.name === 'CauchyError' && /recursão/.test(e.message)) throw e;
            continue;
          }
          const p = val(w, u, v);
          if (p && p.every(Number.isFinite)) pos.set(p, (i * (nv + 1) + j) * 3);
        }
      }
    });
    return pos;
  };
  // exclude = "arb": avalia f na bola que cobre cada célula da grade; se o
  // resultado não é finito (ou a avaliação falha), a célula pode conter um
  // polo e não é desenhada. Rigoroso, mas exclui também células grandes
  // demais para a bola ficar finita.
  const finiteBall = (w) => {
    if (w instanceof Tuple) return w.items.every(finiteBall);
    if (!(w instanceof Elem)) return true;
    if (w.ring === RR) return bool(RR.op('arb_is_finite', w));
    if (w.ring === CC) return bool(CC.op('acb_is_finite', w));
    return true;
  };
  const cutCells = (f, [u0, u1], [v0, v1], [nu, nv], DEPTH = 1) => {
    const cut = new Uint8Array(nu * nv);
    const F = flint();
    const ball = (a, b) => RR.op('arb_set_interval', RR.fromNumber(a), RR.fromNumber(b));
    F.withPrec(64, () => {
      const saved = F.intervalMode;
      F.intervalMode = true;
      try {
        // Célula rejeitada é dividida em quatro (até DEPTH vezes): só fica de
        // fora se algum pedaço continuar sem valor finito.
        const finite = (a0, a1, b0, b1, depth) => {
          let ok;
          try {
            ok = finiteBall(callValue(f, [ball(a0, a1), ball(b0, b1)]));
          } catch (e) {
            if (e.name === 'CauchyError' && /recursão/.test(e.message)) throw e;
            ok = false;
          }
          if (ok || depth === 0) return ok;
          const am = (a0 + a1) / 2, bm = (b0 + b1) / 2;
          return finite(a0, am, b0, bm, depth - 1) && finite(am, a1, b0, bm, depth - 1)
            && finite(a0, am, bm, b1, depth - 1) && finite(am, a1, bm, b1, depth - 1);
        };
        for (let i = 0; i < nu; i++) {
          for (let j = 0; j < nv; j++) {
            const ok = finite(u0 + ((u1 - u0) * i) / nu, u0 + ((u1 - u0) * (i + 1)) / nu,
              v0 + ((v1 - v0) * j) / nv, v0 + ((v1 - v0) * (j + 1)) / nv, DEPTH);

      }

  };
  const excludeOpt = (kw) => {
    const e = kw.exclude;
    if (e === undefined || e === true) return 'auto';
    if (e === false) return false;

  };
  const MESH_OPTS = ['points', 'xlim', 'ylim', 'zlim', 'exclude'];
  // Só os limites dados: os ausentes continuam vindo dos dados.
  const lims3 = (kw) => Object.fromEntries(Object.entries(limits(kw)).filter(([, v]) => v));
  const mesh = (f, ur, vr, n, exclude, pos, extra) => ({
    g: 'mesh', d3: true, nu: n[0], nv: n[1], pos, exclude,
    ...(exclude === 'arb' ? { cut: cutCells(f, ur, vr, n) } : {}), ...extra,

  def('surface', 3, ([f, ur, vr], kw) => {
    const n = gridSize(kw, 40), ex = excludeOpt(kw);

    });

  def('plot3d', 3, ([f, xr, yr], kw) => {

    return new Graphic([mesh(F, X, Y, n, ex, pos, { data: true, attrs: { color: 1, colormap: 'z', ...attrsOf(kw, MESH_OPTS) } })],

  }, 'plot3d((x, y) -> z, [x₀, x₁], [y₀, y₁], points=50, zlim=, exclude=true): gráfico de função de duas variáveis');

  // --------------------------------------------------------- widgets
  const widget = (kind, spec, defVal, parse) => {
    const c = currentContext();
    const { key, prev } = c.widgetSlot(kind);
    const raw = prev !== undefined ? prev : defVal;
    c.storeWidget(key, kind, raw);
    return new Widget(kind, { ...spec, index: key }, parse(raw), raw);
  };
  def('slider', null, ([a, b, step], kw) => {
    const lo = toNum(a), hi = toNum(b);
    const st = step !== undefined ? toNum(step) : kw.step !== undefined ? toNum(kw.step) : 1;
    const isInt = [a, b].every((x) => x instanceof Elem && x.ring === ZZ) && Number.isInteger(st);
    const init = kw.value !== undefined ? toNum(kw.value) : lo;
    return widget('slider', { min: lo, max: hi, step: st, label: kw.label ?? null }, init,
      (v) => (isInt ? int(Math.round(v)) : QQ.fromDecimal(String(v))));
  }, 'slider(a, b, passo=1, value=): controle deslizante');
  // --------------------------------------------------------- pontos de controle
  // O estado cru vem da UI: {from, at: [x, y]} (handle) ou {from, pts: [...]}
  // (handles), com x e y como strings decimais; "from" identifica o valor
  // inicial no código, para que editá-lo reposicione o ponto.
  const handleOpts = (kw) => {
    let snap = null;
    if (kw.snap !== undefined) {
      snap = elem(kw.snap, 'snap');
      if ((snap.ring !== ZZ && snap.ring !== QQ) || compare(snap, int(0), '<=')) fail('snap deve ser um racional positivo, como 1/10');
    }
    let on = null;
    if (kw.on !== undefined) on = fn(kw.on);
    return { snap, on, ...limits(kw) };
  };
  const decimal = (v, lim) => {
    let x = Number(v);
    if (!Number.isFinite(x)) fail('posição inválida para o ponto de controle');
    if (lim) x = Math.min(lim[1], Math.max(lim[0], x));
    return x === Number(v) ? QQ.fromDecimal(String(v)) : QQ.fromDecimal(String(x));
  };
  const snapTo = (q, snap) => (snap ? mul(int(Math.round(toNum(q) / toNum(snap))), snap) : q);
  // Ponto (cópia nova, para não marcar valores compartilhados) a partir do
  // valor inicial ou da posição arrastada; aplica snap, limites e on. Com
  // tuple, o ponto é a tupla (x, y) e as posições arrastadas são racionais
  // exatos (múltiplos de snap); senão, um complexo.
  const handlePoint = (init, at, o, tuple) => {
    let z;
    if (at) {
      const x = snapTo(decimal(at[0], o.xlim), o.snap), y = snapTo(decimal(at[1], o.ylim), o.snap);
      z = tuple ? new Tuple([x, y]) : CC.fromParts(RR.coerce(x), RR.coerce(y));
    } else {
      pt(init, 'ponto inicial');
      if (tuple) z = new Tuple([...init.items]);
      else z = init instanceof Tuple ? CC.fromParts(RR.coerce(init.items[0]), RR.coerce(init.items[1])) : CC.op('acb_set', CC.coerce(init));
    }
    if (o.on) {
      const w = callValue(o.on, [z]);
      pt(w, 'on(z)');
      z = w instanceof Elem ? w.ring.copy(w) : new Tuple([...w.items]);
    }
    return z;
  };
  // Leitura compacta do ponto (as bolas de decimais como 0.1 têm raio ínfimo).
  const pointText = ([x, y]) => {
    const f = (v) => String(+v.toPrecision(10));
    if (y === 0) return f(x);
    const im = Math.abs(y) === 1 ? 'i' : `${f(Math.abs(y))}·i`;
    if (x === 0) return y < 0 ? `-${im}` : im;
    return `${f(x)} ${y < 0 ? '-' : '+'} ${im}`;
  };
  const handleSpec = (o, kw, from) => ({
    label: kw.label ?? null, from,
    snap: o.snap ? toNum(o.snap) : null, xlim: o.xlim, ylim: o.ylim,
  });
  def('handle', null, ([z0], kw) => {
    const c = currentContext();
    const o = handleOpts(kw);
    const init = z0 ?? int(0);
    const from = showText(init);
    const { key: i, prev } = c.widgetSlot('handle');
    const raw = prev && prev.from === from ? prev : null;
    c.storeWidget(i, 'handle', raw);
    const z = handlePoint(init, raw && raw.at, o, init instanceof Tuple);
    HANDLE_OF.set(z, { id: c.cellId, index: i, from, snap: o.snap ? toNum(o.snap) : null });
    return new Widget('handle', { ...handleSpec(o, kw, from), index: i }, z, { text: z instanceof Tuple ? showText(z) : pointText(pt(z)), at: pt(z) });
  }, 'handle(z₀, snap=, xlim=, ylim=, on=): ponto de controle arrastável nos gráficos; com z₀ = (x, y), devolve uma tupla de racionais');
  def('handles', 1, ([zs], kw) => {
    const c = currentContext();
    const o = handleOpts(kw);
    const inits = list(zs).map(unw);
    const from = showText(inits);
    const min = kw.min === undefined ? 0 : ui(kw.min, 'min');
    const max = kw.max === undefined ? Infinity : ui(kw.max, 'max');
    const { key: i, prev } = c.widgetSlot('handles');
    const raw = prev && prev.from === from ? prev : null;
    c.storeWidget(i, 'handles', raw);
    // Entradas: número k = k-ésimo ponto inicial; [x, y] = posição arrastada.
    const entries = raw ? raw.pts : inits.map((_, k) => k);
    const tuple = inits.length > 0 && inits.every((z) => z instanceof Tuple);
    const base = { id: c.cellId, index: i, from, entries, snap: o.snap ? toNum(o.snap) : null, min };
    const vs = entries.map((e, k) => {
      const z = typeof e === 'number' ? handlePoint(inits[e], null, o, tuple) : handlePoint(null, e, o, tuple);
      HANDLE_OF.set(z, { ...base, sub: k });
      return z;
    });
    HANDLE_OF.set(vs, { ...base, list: true, add: kw.add === true, max: Number.isFinite(max) ? max : null });
    const at = vs.map((z) => pt(z));
    return new Widget('handles', { ...handleSpec(o, kw, from), index: i }, vs, { text: tuple ? showText(vs) : `[${at.map(pointText).join(', ')}]`, at });
  }, 'handles([z₁, …], add=false, min=, max=, snap=, ...): lista de pontos de controle');
  def('checkbox', null, (args, kw) => widget('checkbox', { label: kw.label ?? null }, kw.value === true, (v) => !!v), 'checkbox(value=false)');
  def('textinput', null, (args, kw) => widget('text', { label: kw.label ?? null }, kw.value ?? '', (v) => String(v)), 'textinput(value=""): campo de texto');
  def('numinput', null, (args, kw) => widget('number', { label: kw.label ?? null }, kw.value !== undefined ? showText(kw.value) : '0',
    (v) => {
      const s = String(v).trim();
      if (/^-?\d+$/.test(s)) return ZZ.fromString(s);
      if (/^-?\d+\/\d+$/.test(s)) { const [n, d] = s.split('/'); return QQ.frac(ZZ.fromString(n), ZZ.fromString(d)); }

  // eslint-disable-next-line no-undef
  const factory = createCauchy;
  const F = await loadFlint(factory, { locateFile: () => wasmUrl });
  setFlint(F);
  nb = new Notebook({
    onStart: (id) => post({ type: 'start', id }),
    onResult: (r) => post({ type: 'result', ...r }),
  });
  post({ type: 'ready', version: F.version(), docs: [...DOCS], sigs: F.signatures() });
}

self.onmessage = async (ev) => {
  const msg = ev.data;
  try {
    switch (msg.type) {
      case 'init':
        await init(msg.wasmUrl);
        return;
      case 'update':
        nb.update(msg.changes, { skip: msg.skip ?? [] });
        break;
      case 'widget':
        nb.setWidget(msg.id, msg.index, msg.value);
        break;
    }
    post({ type: 'done', live: nb.liveCount() });
  } catch (e) {
    post({ type: 'fatal', message: String(e?.stack ?? e) });
  }
};

return {  };

let lang = 'pt';

function detectLang() {
  try {
    const saved = localStorage.getItem('cauchy.lang');
    if (saved && LANGS[saved]) return saved;
  } catch {
    // sem armazenamento
  }
  return (navigator.language || 'pt').toLowerCase().startsWith('pt') ? 'pt' : 'en';
}

function setLang(l) {
  lang = LANGS[l] ? l : 'pt';
  if (typeof document === 'undefined') return;
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  try {
    localStorage.setItem('cauchy.lang', lang);
  } catch {
    // ignora
  }
}

function getLang() {
  return lang;
}

function t(key, ...args) {
  const v = STRINGS[lang][key] ?? STRINGS.pt[key] ?? key;
  return typeof v === 'function' ? v(...args) : v;
}

// Aplica textos a elementos com data-i18n (conteúdo), data-i18n-title e
// data-i18n-aria.
function applyStatic(root = document) {
  root.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  root.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t(el.dataset.i18nTitle); });
  root.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  root.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
}

prem ¦ mpoly ¦ prem(f, g, x), prem(f, cs, vars=[…]) ¦ Pseudo-resto de f por g na variável x: r com lc(g)ᵏ·f = q·g + r e grau em x menor que o de g (lc é o coeficiente líder em x, um polinômio nas demais variáveis). Com uma cadeia cs (como a de charset), reduz f por cada polinômio, da maior variável principal para a menor. ¦ Pseudo-remainder of f by g in the variable x: r with lc(g)ᵏ·f = q·g + r and degree in x smaller than g's (lc is the leading coefficient in x, a polynomial in the other variables). With a chain cs (such as charset's), reduces f by each polynomial, from the highest main variable down. ¦ (x, y) = gens(QQ[x, y]); prem(x^3 + y, x^2*y - 1, x) ;; (x, y) = gens(QQ[x, y]); prem(y^2 - x, charset([x^2 - 2, y^2 - x])) ¦
charset ¦ mpoly ¦ charset(ps), charset(ps, vars=[…]) ¦ Conjunto característico de Wu–Ritt: uma cadeia triangular cujos zeros contêm os de ps e que pseudo-reduz todo polinômio de ps a 0. As variáveis vão da menor para a maior na ordem do anel ou na lista vars (as que ficam fora vêm antes, como parâmetros); cada polinômio da cadeia introduz uma variável principal nova. Devolve [1] se o sistema não tem solução. ¦ Wu–Ritt characteristic set: a triangular chain whose zeros contain those of ps and which pseudo-reduces every polynomial of ps to 0. Variables go from lowest to highest in the ring's order or in the list vars (those left out come first, as parameters); each polynomial of the chain introduces a new main variable. Returns [1] if the system has no solution. ¦ (x, y) = gens(QQ[x, y]); charset([x^2 + y^2 - 1, x*y - 1/2]) ;; (x, y) = gens(QQ[x, y]); charset([x^2 + y^2 - 1, x*y - 1/2], vars = [y, x]) ¦
initials ¦ mpoly ¦ initials(cs), initials(cs, vars=[…]) ¦ Iniciais de uma cadeia: o coeficiente líder de cada polinômio na sua variável principal (as constantes ficam de fora). Fora dos zeros dos iniciais, a cadeia descreve o conjunto de soluções. ¦ Initials of a chain: the leading coefficient of each polynomial in its main variable (constants are left out). Away from the zeros of the initials, the chain describes the solution set. ¦ (x, y) = gens(QQ[x, y]); initials(charset([x^2 + y^2 - 1, x*y - 2])) ¦
wuprove ¦ mpoly ¦ wuprove(hs, g), wuprove(hs, g, vars=[…]) ¦ Método de Wu para demonstrar teoremas: calcula o conjunto característico das hipóteses hs e pseudo-reduz a conclusão g por ele. Devolve (r, conds): se r = 0, g se anula em toda solução de hs em que nenhum polinômio de conds se anula (condições de não degenerescência, suficientes mas nem sempre necessárias). ¦ Wu's method for proving theorems: computes the characteristic set of the hypotheses hs and pseudo-reduces the conclusion g by it. Returns (r, conds): if r = 0, g vanishes at every solution of hs where no polynomial in conds vanishes (non-degeneracy conditions, sufficient but not always necessary). ¦ (u1, u2, u3, x1, x2) = gens(QQ[u1, u2, u3, x1, x2]); wuprove([2*u1*x1 - u1^2, 2*u2*x1 + 2*u3*x2 - u2^2 - u3^2], (x1 - u1)^2 + x2^2 - (x1 - u2)^2 - (x2 - u3)^2) ¦
wudecomp ¦ mpoly ¦ wudecomp(ps), wudecomp(ps, vars=[…]) ¦ Decomposição de Wu: lista de cadeias cujas componentes, cada uma fora dos zeros dos seus iniciais, somam exatamente os zeros de ps. Cada polinômio das cadeias é irredutível sobre QQ (mas a cadeia pode ainda se decompor sobre extensões); componentes contidas em outras são omitidas. A ordem das variáveis é a de charset. ¦ Wu's decomposition: a list of chains whose components, each away from the zeros of its initials, add up exactly to the zeros of ps. Each polynomial of the chains is irreducible over QQ (but a chain may still split over extensions); components contained in others are left out. The variable order is the one of charset. ¦ (x, y, z) = gens(QQ[x, y, z]); wudecomp([x*y, x*z]) ;; (x, y, z) = gens(QQ[x, y, z]); wudecomp([x*z - y^2, y*z - x^2, z^2 - x*y]) ¦
