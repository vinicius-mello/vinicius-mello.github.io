<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CindyJS Editor</title>
  <link rel="stylesheet" href="css/codemirror.css">
  <link rel="stylesheet" href="css/darcula.css">
  <link rel="stylesheet" href="css/show-hint.css">
  <link rel="stylesheet" href="https://cindyjs.org/dist/latest/CindyJS.css">
  <script src="js/codemirror.js"></script>
  <script src="js/javascript.js"></script>
  <script src="js/matchbrackets.js"></script>
  <script src="js/closebrackets.js"></script>
  <script src="js/show-hint.js"></script>
  <script src="js/placeholder.js"></script>
  <script src="https://cindyjs.org/dist/latest/Cindy.js"></script>
  <script src="https://cindyjs.org/dist/latest/CindyGL.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --panel-bg: rgba(17, 24, 39, 0.82);
      --panel-border: rgba(148, 163, 184, 0.16);
      --panel-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      --text-main: #e5edf7;
      --text-soft: #8ca0b8;
      --accent: #f97316;
      --radius-lg: 28px;
      --canvas-size: min(100%, calc(100vh - 72px), 512px);
      --workspace-canvas-width: 50%;
      --workspace-gap: 10px;
      font-family: "Segoe UI", "Noto Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(249, 115, 22, 0.24), transparent 32%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.16), transparent 28%),
        linear-gradient(160deg, #10141d 0%, #161c28 48%, #0c1017 100%);
      color: var(--text-main);
      overflow: hidden;
    }

    body {
      padding: 10px;
    }

    .page-shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      display: grid;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(514px, var(--workspace-canvas-width)) 12px minmax(0, 1fr);
      gap: var(--workspace-gap);
      align-items: stretch;
      height: calc(100vh - 20px);
    }

    .workspace.is-resizing {
      cursor: col-resize;
      user-select: none;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--panel-shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
      min-width: 0;
    }

    .canvas-panel {
      grid-column: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .splitter {
      grid-column: 2;
      position: relative;
      height: 100%;
      cursor: col-resize;
      touch-action: none;
    }

    .splitter::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 10px;
      bottom: 10px;
      width: 2px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
      transition: background 120ms ease, box-shadow 120ms ease;
    }

    .splitter::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 56px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
    }

    .splitter:hover::before,
    .workspace.is-resizing .splitter::before {
      background: rgba(249, 115, 22, 0.72);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.14);
    }

    .canvas-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.88), rgba(15, 23, 42, 0.92));
    }

    #port {
      width: 512px;
      height: 512px;
      flex: 0 0 auto;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
      background: #0b1120;
    }

    .editor-panel {
      grid-column: 3;
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      display: block;
      padding: 10px 6px 10px 10px;
      border-right: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(12, 18, 29, 0.32);
    }

    .tablist {
      display: flex;
      flex-direction: column;
      gap: 4px;
      height: 100%;
      overflow: hidden;
      padding-right: 2px;
    }

    .tab-button {
      border: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(15, 23, 42, 0.7);
      color: var(--text-soft);
      padding: 5px 8px;
      border-radius: 10px;
      font: inherit;
      font-size: 0.6rem;
      line-height: 0.95;
      text-align: left;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, color 120ms ease;
      white-space: nowrap;
    }

    .tab-button:hover,
    .tab-button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(249, 115, 22, 0.42);
      color: var(--text-main);
      outline: none;
    }

    .tab-button[aria-selected="true"] {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.18), rgba(251, 146, 60, 0.22));
      border-color: rgba(249, 115, 22, 0.52);
      color: var(--text-main);
      box-shadow: inset 0 0 0 1px rgba(251, 146, 60, 0.12);
    }

    .button,
    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 26px;
      padding: 0 8px;
      border-radius: 10px;
      border: 1px solid transparent;
      font: inherit;
      font-size: 0.62rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 120ms ease, filter 120ms ease, border-color 120ms ease;
    }

    .button:hover,
    .file-button:hover,
    .button:focus-visible,
    .file-button:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.05);
      outline: none;
    }

    .button-primary {
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: #1a1106;
      font-weight: 700;
    }

    .button-secondary,
    .file-button {
      background: rgba(15, 23, 42, 0.82);
      border-color: rgba(148, 163, 184, 0.18);
      color: var(--text-main);
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .example-select {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      max-width: 152px;
      padding: 0 8px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.82);
      color: var(--text-main);
      font: inherit;
      font-size: 0.62rem;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, border-color 120ms ease;
    }

    .example-select:hover,
    .example-select:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.05);
      border-color: rgba(249, 115, 22, 0.42);
      outline: none;
    }

    .example-select option {
      background: #10141d;
      color: var(--text-main);
    }

    .editor-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 8px;
      padding: 10px;
      min-height: 0;
    }

    .editor-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .editor-frame {
      height: 100%;
      min-height: 0;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    .output-console {
      min-height: calc(4.5 * 1.2em + 10px);
      max-height: calc(4.5 * 1.2em + 10px);
      margin: 0;
      padding: 5px 56px 5px 8px;
      overflow: auto;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(11, 17, 30, 0.92);
      color: #b9c9dc;
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 10px;
      line-height: 1.2;
      white-space: pre-wrap;
    }

    .console-wrap {
      position: relative;
    }

    .console-clear-button {
      position: absolute;
      top: 4px;
      right: 16px;
      min-height: 20px;
      padding: 0 6px;
      font-size: 0.55rem;
      z-index: 1;
    }

    .CodeMirror {
      height: 100%;
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 13px;
      line-height: 1.35;
    }

    .cm-s-darcula.CodeMirror {
      background: #0f1722;
      color: #d9e7f3;
    }

    .cm-s-darcula .CodeMirror-gutters {
      background: #121a27;
      border-right: 1px solid rgba(148, 163, 184, 0.1);
    }

    .CodeMirror-scroll {
      overflow-x: hidden !important;
    }

    .cm-cindy-keyword {
      color: #f59e0b;
      font-weight: 600;
    }

    .cm-cindy-function {
      color: #60a5fa;
      font-weight: 600;
    }

    .cm-cindy-constant {
      color: #34d399;
      font-weight: 600;
    }

    .cm-cindy-modifier {
      color: #f472b6;
      font-weight: 600;
    }

    .CodeMirror-hints {
      max-height: min(42vh, 320px);
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 12px;
      background: #0b1220;
      border: 1px solid rgba(148, 163, 184, 0.55);
      color: #e6edf7;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
      z-index: 50;
    }

    .CodeMirror-hint {
      color: #e6edf7;
      padding: 4px 8px;
    }

    li.CodeMirror-hint-active {
      background: #f97316;
      color: #111827;
    }

    .docs-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(3, 7, 18, 0.72);
      backdrop-filter: blur(8px);
      z-index: 120;
    }

    .docs-overlay.is-open {
      display: flex;
    }

    .docs-dialog {
      width: min(1080px, 100%);
      height: min(84vh, 100%);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: rgba(11, 18, 32, 0.98);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .docs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(15, 23, 42, 0.94);
    }

    .docs-title {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #f8fafc;
    }

    .docs-status {
      color: var(--text-soft);
      font-size: 0.66rem;
    }

    .docs-search {
      flex: 0 1 220px;
      min-width: 0;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px;
      color: var(--text-main);
      font: inherit;
      font-size: 0.68rem;
      padding: 6px 10px;
    }

    .docs-search::placeholder {
      color: var(--text-soft);
    }

    .docs-search:focus-visible {
      outline: none;
      border-color: rgba(249, 115, 22, 0.55);
    }

    .docs-body {
      display: grid;
      grid-template-columns: 176px minmax(0, 1fr);
      min-height: 0;
      background: linear-gradient(180deg, rgba(10, 15, 27, 0.98), rgba(15, 23, 42, 0.96));
    }

    .docs-nav {
      list-style: none;
      margin: 0;
      padding: 10px 8px;
      overflow-y: auto;
      border-right: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(9, 13, 22, 0.6);
    }

    .docs-nav li + li {
      margin-top: 2px;
    }

    .docs-nav-link {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-soft);
      font: inherit;
      font-size: 0.64rem;
      line-height: 1.3;
      padding: 6px 8px;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    .docs-nav-link:hover,
    .docs-nav-link:focus-visible {
      color: var(--text-main);
      border-color: rgba(249, 115, 22, 0.32);
      outline: none;
    }

    .docs-nav-link.is-hidden {
      display: none;
    }

    .docs-content {
      overflow-y: auto;
      padding: 16px 20px 24px;
    }

    .docs-section {
      padding-top: 6px;
      margin-bottom: 22px;
      scroll-margin-top: 8px;
    }

    .docs-section.is-hidden {
      display: none;
    }

    .docs-section-title {
      margin: 0 0 10px;
      font-size: 0.86rem;
      font-weight: 700;
      color: #f8fafc;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }

    .docs-block {
      margin-bottom: 12px;
    }

    .docs-block-label {
      margin: 0 0 5px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    .docs-text {
      margin: 0 0 4px;
      font-size: 0.74rem;
      line-height: 1.55;
      color: #d7e1ee;
    }

    .docs-code {
      margin: 0;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-left: 3px solid rgba(148, 163, 184, 0.32);
      background: rgba(8, 12, 20, 0.78);
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 11.5px;
      line-height: 1.55;
      color: #d9e7f3;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .docs-code.is-example {
      border-left-color: rgba(249, 115, 22, 0.6);
    }

    .docs-list {
      margin: 0;
      padding-left: 18px;
      font-size: 0.74rem;
      line-height: 1.6;
      color: #d7e1ee;
    }

    .docs-link {
      color: #fb923c;
      text-decoration: none;
      word-break: break-all;
    }

    .docs-link:hover {
      text-decoration: underline;
    }

    .doc-kw {
      color: #f59e0b;
      font-weight: 600;
    }

    .doc-fn {
      color: #60a5fa;
      font-weight: 600;
    }

    .doc-const {
      color: #34d399;
      font-weight: 600;
    }

    .doc-mod {
      color: #f472b6;
      font-weight: 600;
    }

    .docs-empty {
      color: var(--text-soft);
      font-size: 0.72rem;
      padding: 12px 2px;
    }

    @media (max-width: 1120px) {
      body {
        padding: 8px;
      }

      .workspace {
        grid-template-columns: minmax(514px, var(--workspace-canvas-width)) 10px minmax(0, 1fr);
        height: calc(100vh - 16px);
      }

      .editor-panel {
        grid-template-columns: 98px minmax(0, 1fr);
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 6px;
      }

      .workspace {
        grid-template-columns: minmax(514px, var(--workspace-canvas-width)) 8px minmax(0, 1fr);
        gap: 8px;
        height: calc(100vh - 12px);
      }

      .editor-panel {
        grid-template-columns: 84px minmax(0, 1fr);
      }

      .canvas-panel,
      .editor-shell {
        padding: 8px;
      }

      .sidebar {
        padding: 8px 4px 8px 8px;
      }

      .tab-button {
        font-size: 0.54rem;
        padding: 4px 6px;
      }

      .button,
      .file-button {
        min-height: 24px;
        padding: 0 7px;
        font-size: 0.56rem;
      }

      .CodeMirror {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="workspace">
      <article class="panel canvas-panel">
        <div class="canvas-stage">
          <div id="port"></div>
        </div>
      </article>

      <div
        id="workspaceSplitter"
        class="splitter"
        role="separator"
        aria-label="Resize panel"
        aria-orientation="vertical"
        aria-valuemin="42"
        aria-valuemax="68"
        aria-valuenow="50"
        tabindex="0"
      ></div>

      <article class="panel editor-panel">
        <aside class="sidebar">
          <div id="bufferTabs" class="tablist" role="tablist" aria-label="Script buffers"></div>
        </aside>

        <div class="editor-shell">
          <div class="editor-actions">
            <button id="runButton" class="button button-primary" type="button" title="Shift-Enter">Run</button>
            <button id="saveButton" class="button button-secondary" type="button" title="Ctrl-S">Save</button>
            <label class="file-button" for="inputFile" title="Ctrl-F">Open</label>
            <button id="docsButton" class="button button-secondary" type="button">Docs</button>
            <select id="exampleSelect" class="example-select" title="Load example">
              <option value="" disabled selected>Examples…</option>
            </select>
            <input class="file-input" type="file" id="inputFile" accept=".js,.txt,.json">
          </div>
          <div class="editor-frame">
            <textarea id="editor"></textarea>
          </div>
          <div class="console-wrap">
            <button id="clearConsoleButton" class="button button-secondary console-clear-button" type="button">Clear</button>
            <pre id="console" class="output-console" aria-live="polite"></pre>
          </div>
        </div>
      </article>
    </section>
  </main>

  <div id="docsOverlay" class="docs-overlay" aria-hidden="true">
    <section class="docs-dialog" role="dialog" aria-modal="true" aria-labelledby="docsTitle">
      <header class="docs-header">
        <div>
          <h2 id="docsTitle" class="docs-title">CindyJS Summary</h2>
          <div id="docsStatus" class="docs-status">Local summary based on the official CindyJS documentation.</div>
        </div>
        <input id="docsSearch" class="docs-search" type="search" placeholder="Search function or keyword...">
        <button id="closeDocsButton" class="button button-secondary" type="button">Close</button>
      </header>
      <div class="docs-body">
        <ul id="docsNav" class="docs-nav"></ul>
        <div id="docsContent" class="docs-content"></div>
      </div>
    </section>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const bufferNames = [
        "draw",
        "init",
        "tick",
        "move",
        "mousedown",
        "mousemove",
        "mouseup",
        "mousedrag",
        "mouseclick",
        "keydown",
        "multidown",
        "multidrag",
        "multiup",
        "config"
      ];

      const defaultConfig = [
        "{",
        "  ports: [",
        "    {",
        "      id: `port`,",
        "      axes: false,",
        "      grid: 0,",
        "      background: `rgb(168,176,192)`",
        "    }",
        "  ],",
        "  animation:",
        "  {",
        "    autoplay: true",
        "  },",
        "  geometry: [",
        "    {",
        "      name: `A`,",
        "      kind: `P`,",
        "      type: `Free`,",
        "      pos: [0, 0]",
        "    },",
        "    {",
        "      name: `B`,",
        "      kind: `P`,",
        "      type: `Free`,",
        "      pos: [7, 7]",
        "    }",
        "  ]",
        "}"
      ].join("\n");

      const defaultDrawScript = [
        "repeat(500,i,",
        "  w=i*pi/180*(137.508+B.x*0.5);",
        "  p=A+(cos(w),sin(w))*0.3*sqrt(i);",
        "  a=i;",
        "  draw(p,size->sqrt(i)*.4,color->hue(i/34));",
        ");"
      ].join("\n");

      function exampleConfig(options) {
        const opts = options || {};
        const autoplay = opts.autoplay !== false;
        const background = opts.background || "rgb(168,176,192)";
        const points = opts.points || [];

        const geometryBlock = points.length
          ? "  geometry: [\n" + points.map(function (point, index) {
              return [
                "    {",
                "      name: `" + point.name + "`,",
                "      kind: `P`,",
                "      type: `Free`,",
                "      pos: [" + point.pos[0] + ", " + point.pos[1] + "]",
                "    }" + (index === points.length - 1 ? "" : ",")
              ].join("\n");
            }).join("\n") + "\n  ]"
          : "  geometry: []";

        return [
          "{",
          "  ports: [",
          "    {",
          "      id: `port`,",
          "      axes: false,",
          "      grid: 0,",
          "      background: `" + background + "`",
          "    }",
          "  ],",
          "  animation:",
          "  {",
          "    autoplay: " + autoplay,
          "  },",
          geometryBlock,
          "}"
        ].join("\n");
      }

      // Adapted from concepts shown in the official CindyJS gallery
      // (https://cindyjs.org/gallery/main/) - rewritten for this editor's
      // buffer/config model, not copied verbatim from the gallery sources.
      const EXAMPLES = [
        {
          label: "Sunflower Spiral",
          group: "Basic",
          config: defaultConfig,
          scripts: { draw: defaultDrawScript }
        },
        {
          label: "Chaos Game: Sierpinski",
          group: "Fractals",
          config: exampleConfig({
            autoplay: false,
            background: "rgb(18,20,26)",
            points: [

      function inspect(object, indent) {
        const currentIndent = indent || "";

        switch (typeof object) {
          case "undefined":
            return "undefined";
          case "string":
            return "\`" + object + "\`";
          case "object":
            if (object === null) {
              return "null";
            }

            if (Array.isArray(object)) {
              return "[" + object.map(function (item) {
                return inspect(item, currentIndent);
              }).join(", ") + "]";
            }

            return "\n" + currentIndent + "{\n" + currentIndent + "  " + Object.keys(object).map(function (key) {
              return key + ": " + inspect(object[key], currentIndent + "  ");
            }).join(",\n" + currentIndent + "  ") + "\n" + currentIndent + "}";
          default:
            return object.toString();
        }
      }

      function saveFile(name, type, data) {
        const blob = new Blob([data], { type: type });
        const anchor = document.createElement("a");
        const url = window.URL.createObjectURL(blob);

        anchor.href = url;
        anchor.download = name;
        anchor.style.display = "none";
        document.body.appendChild(anchor);
        anchor.click();
        window.URL.revokeObjectURL(url);
        anchor.remove();

      function saveSession() {
        try {
          const data = {
            buffers: state.buffers,
            activeBuffer: state.activeBuffer,
            workspaceWidth: workspaceWidthValue
          };
          localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(data));
        } catch (error) {
          // Storage unavailable (quota, private browsing) - session just won't persist.
        }
      }

      function scheduleSessionSave() {
        if (saveSessionTimer) {
          clearTimeout(saveSessionTimer);
        }
        saveSessionTimer = setTimeout(saveSession, 400);
      }

      function loadSession() {
        try {
          const raw = localStorage.getItem(SESSION_STORAGE_KEY);
          if (!raw) {
            return null;
          }
          const data = JSON.parse(raw);
          return data && typeof data === "object" ? data : null;
        } catch (error) {
          return null;
        }
      }

      function restoreSession() {
        const data = loadSession();
        if (!data || typeof data.buffers !== "object" || data.buffers === null) {
          return;
        }

        bufferNames.forEach(function (name) {
          if (typeof data.buffers[name] === "string") {
            state.buffers[name] = data.buffers[name];
          }
        });

        if (typeof data.activeBuffer === "string" && state.buffers.hasOwnProperty(data.activeBuffer)) {
          state.activeBuffer = data.activeBuffer;
        }

        if (typeof data.workspaceWidth === "number" && isFinite(data.workspaceWidth)) {

        }

      function getWordRange(cm) {
        const cursor = cm.getCursor();
        const line = cm.getLine(cursor.line);
        let start = cursor.ch;
        let end = cursor.ch;

        while (start > 0 && /[A-Za-z0-9_#\-]/.test(line.charAt(start - 1))) {
          start -= 1;
        }

        while (end < line.length && /[A-Za-z0-9_#\->]/.test(line.charAt(end))) {
          end += 1;
        }

        return {
          cursor: cursor,
          start: start,
          end: end,
          text: line.slice(start, end)
        };
      }

      function cindyHint(cm) {
        const range = getWordRange(cm);
        const query = range.text.toLowerCase();
        const list = cindyVocabulary.filter(function (item) {
          return query.length === 0 || item.toLowerCase().indexOf(query) === 0;
        }).map(function (item) {
          const normalized = item.endsWith("->") ? item.slice(0, -2) : item;
          const snippet = cindySnippets[normalized];

          if (!snippet) {
            return item;
          }

          return {
            text: item,
            displayText: item + "  ·  " + snippet.replace("__CURSOR__", "…"),
            hint: function (innerCm, self) {
              const marker = "__CURSOR__";
              const markerIndex = snippet.indexOf(marker);
              const inserted = snippet.replace(marker, "");
              innerCm.replaceRange(inserted, self.from, self.to);
              if (markerIndex >= 0) {
                innerCm.setCursor(CodeMirror.Pos(self.from.line, self.from.ch + markerIndex));
              }
            }
          };
        });

        return {
          list: list,
          from: CodeMirror.Pos(range.cursor.line, range.start),
          to: CodeMirror.Pos(range.cursor.line, range.end)
        };
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function highlightCindyLine(rawLine) {
        const pattern = /[A-Za-z_#][A-Za-z0-9_]*(?:->)?/g;
        let result = "";
        let lastIndex = 0;
        let match;

        while ((match = pattern.exec(rawLine))) {
          result += escapeHtml(rawLine.slice(lastIndex, match.index));
          const token = match[0];
          const isModifier = token.endsWith("->");
          const word = (isModifier ? token.slice(0, -2) : token).toLowerCase();
          let cssClass = null;

          if (isModifier || cindyModifierSet.has(word)) {
            cssClass = "doc-mod";
          } else if (cindyKeywordSet.has(word)) {
            cssClass = "doc-kw";
          } else if (cindyFunctionSet.has(word)) {
            cssClass = "doc-fn";
          } else if (cindyConstantSet.has(word)) {
            cssClass = "doc-const";
          }

          result += cssClass
            ? "<span class=\"" + cssClass + "\">" + escapeHtml(token) + "</span>"
            : escapeHtml(token);
          lastIndex = match.index + token.length;
        }

        result += escapeHtml(rawLine.slice(lastIndex));
        return result;
      }

      function highlightCindyBlock(code) {
        return code.split("\n").map(highlightCindyLine).join("\n");
      }

      function renderDocsBlock(block) {
        const labelHtml = block.label
          ? "<p class=\"docs-block-label\">" + escapeHtml(block.label) + "</p>"
          : "";

        if (block.kind === "text") {
          return "<div class=\"docs-block\">" + labelHtml + "<p class=\"docs-text\">" + escapeHtml(block.text) + "</p></div>";
        }

        if (block.kind === "list") {
          const items = block.items.map(function (item) {
            return "<li>" + escapeHtml(item) + "</li>";
          }).join("");
          return "<div class=\"docs-block\">" + labelHtml + "<ul class=\"docs-list\">" + items + "</ul></div>";
        }

        if (block.kind === "link") {
          return "<div class=\"docs-block\"><a class=\"docs-link\" href=\"" + escapeHtml(block.url) + "\" target=\"_blank\" rel=\"noopener\">" + escapeHtml(block.label || block.url) + "</a></div>";
        }

        if (block.kind === "examples") {
          return "<div class=\"docs-block\"><p class=\"docs-block-label\">Examples</p><pre class=\"docs-code is-example\">" + highlightCindyBlock(block.lines.join("\n")) + "</pre></div>";
        }

        const code = block.code !== undefined ? block.code : block.lines.join("\n");
        return "<div class=\"docs-block\">" + labelHtml + "<pre class=\"docs-code\">" + highlightCindyBlock(code) + "</pre></div>";
      }

      function blockSearchText(block) {
        if (block.kind === "text") {
          return block.text;
        }
        if (block.kind === "list") {
          return (block.label || "") + " " + block.items.join(" ");
        }
        if (block.kind === "link") {
          return (block.label || "") + " " + block.url;
        }
        return (block.label || "") + " " + (block.code !== undefined ? block.code : block.lines.join(" "));
      }

      let docsBuilt = false;

      function buildDocsUI() {
        const navFragments = [];
        const contentFragments = [];

        DOCS_SECTIONS.forEach(function (section, index) {
          const anchorId = "docs-section-" + index;
          const searchText = (section.title + " " + section.blocks.map(blockSearchText).join(" ")).toLowerCase();

          navFragments.push(
            "<li><button type=\"button\" class=\"docs-nav-link\" data-target=\"" + anchorId + "\">" + escapeHtml(section.title) + "</button></li>"
          );

          contentFragments.push(
            "<section class=\"docs-section\" id=\"" + anchorId + "\" data-search=\"" + escapeHtml(searchText) + "\">" +
              "<h3 class=\"docs-section-title\">" + escapeHtml(section.title) + "</h3>" +
              section.blocks.map(renderDocsBlock).join("") +
            "</section>"
          );
        });

        docsNav.innerHTML = navFragments.join("");
        docsContent.innerHTML = contentFragments.join("");

        docsNav.querySelectorAll(".docs-nav-link").forEach(function (button) {
          button.addEventListener("click", function () {
            const target = document.getElementById(button.dataset.target);
            if (target) {
              target.scrollIntoView({ block: "start", behavior: "smooth" });
            }
          });
        });
      }

      function filterDocs(query) {
        const normalized = query.trim().toLowerCase();
        const sections = docsContent.querySelectorAll(".docs-section");
        const navLinks = docsNav.querySelectorAll(".docs-nav-link");
        let visibleCount = 0;

        sections.forEach(function (section, index) {
          const matches = normalized === "" || section.dataset.search.indexOf(normalized) !== -1;
          section.classList.toggle("is-hidden", !matches);
          navLinks[index].classList.toggle("is-hidden", !matches);
          if (matches) {
            visibleCount += 1;
          }
        });

        let emptyState = docsContent.querySelector(".docs-empty");
        if (visibleCount === 0) {
          if (!emptyState) {
            emptyState = document.createElement("p");
            emptyState.className = "docs-empty";
            docsContent.appendChild(emptyState);
          }
          emptyState.textContent = "No results for \"" + query.trim() + "\".";
        } else if (emptyState) {
          emptyState.remove();
        }
      }

      function openDocs() {
        docsOverlay.classList.add("is-open");
        docsOverlay.setAttribute("aria-hidden", "false");

        if (!docsBuilt) {
          buildDocsUI();
          docsBuilt = true;
        }

        docsSearch.focus();
      }

      function closeDocs() {
        docsOverlay.classList.remove("is-open");
        docsOverlay.setAttribute("aria-hidden", "true");
        docsButton.focus();
      }

      const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
        mode: "javascript",
        theme: "darcula",
        autoCloseBrackets: true,
        matchBrackets: true,
        lineNumbers: true,
        tabSize: 2,
        indentUnit: 2,
        lineWrapping: true,
        placeholder: "Write the selected event code here..."
      });

      editor.setValue(state.buffers[state.activeBuffer]);
      editor.setOption("extraKeys", {
        "Shift-Enter": function () {
          runCode();
        },
        "Ctrl-S": function () {
          saveProject();
        },
        "Ctrl-F": function () {
          document.getElementById("inputFile").click();
        },
        "Ctrl-D": function () {
          openDocs();
        },
        "Ctrl-Space": function (cm) {
          cm.showHint({ hint: cindyHint, completeSingle: false });
        }
      });

      editor.addOverlay({
        token: function (stream) {
          if (stream.eatSpace()) {
            return null;
          }

          if (stream.match(/[A-Za-z#][A-Za-z0-9_]*/)) {
            const word = stream.current().toLowerCase();
            if (cindyKeywordSet.has(word)) {
              return "cindy-keyword";
            }
            if (cindyFunctionSet.has(word)) {
              return "cindy-function";
            }
            if (cindyConstantSet.has(word)) {
              return "cindy-constant";
            }
            if (cindyModifierSet.has(word)) {
              return "cindy-modifier";
            }
          }

          stream.next();
          return null;
        }
      });

      editor.on("inputRead", function (cm, change) {
        if (!change.text || !change.text.length || cm.state.completionActive) {
          return;
        }

        const typed = change.text.join("");
        if (/^[A-Za-z>]$/.test(typed)) {
          cm.showHint({ hint: cindyHint, completeSingle: false });
        }
      });

      editor.on("change", function () {
        persistActiveBuffer();
        scheduleSessionSave();
      });

      function applyWorkspaceWidth(value) {
        const nextValue = Math.min(resizeBounds.max, Math.max(resizeBounds.min, value));
        document.documentElement.style.setProperty("--workspace-canvas-width", nextValue + "%");
        splitter.setAttribute("aria-valuenow", String(Math.round(nextValue)));
        workspaceWidthValue = nextValue;
        scheduleSessionSave();
        editor.refresh();
      }

      function updateWorkspaceWidth(pointerClientX) {
        const rect = workspace.getBoundingClientRect();
        const percentage = ((pointerClientX - rect.left) / rect.width) * 100;
        applyWorkspaceWidth(percentage);
      }

      splitter.addEventListener("pointerdown", function (event) {
        event.preventDefault();
        workspace.classList.add("is-resizing");
        splitter.setPointerCapture(event.pointerId);
        updateWorkspaceWidth(event.clientX);
      });

      splitter.addEventListener("pointermove", function (event) {
        if (!splitter.hasPointerCapture(event.pointerId)) {
          return;
        }

        updateWorkspaceWidth(event.clientX);
      });

      splitter.addEventListener("pointerup", function (event) {
        if (splitter.hasPointerCapture(event.pointerId)) {
          splitter.releasePointerCapture(event.pointerId);
        }
        workspace.classList.remove("is-resizing");
      });

      splitter.addEventListener("pointercancel", function (event) {
        if (splitter.hasPointerCapture(event.pointerId)) {
          splitter.releasePointerCapture(event.pointerId);
        }
        workspace.classList.remove("is-resizing");
      });

      splitter.addEventListener("keydown", function (event) {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") {
          return;
        }

        event.preventDefault();
        const delta = event.key === "ArrowLeft" ? -2 : 2;
        const currentValue = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--workspace-canvas-width")) || 50;
        applyWorkspaceWidth(currentValue + delta);
      });

      function persistActiveBuffer() {
        state.buffers[state.activeBuffer] = editor.getValue();
      }

      function updateTabs() {
        state.tabs.forEach(function (button) {
          const selected = button.dataset.buffer === state.activeBuffer;
          button.setAttribute("aria-selected", String(selected));
          button.tabIndex = selected ? 0 : -1;
        });
      }

      function activateBuffer(name) {
        if (!state.buffers.hasOwnProperty(name) || state.activeBuffer === name) {
          return;
        }

        persistActiveBuffer();
        state.activeBuffer = name;
        editor.setValue(state.buffers[name]);
        updateTabs();
        editor.focus();
        scheduleSessionSave();
      }

      function collectScripts() {
        persistActiveBuffer();
        const scripts = {};

        bufferNames.forEach(function (name) {
          if (name !== "config") {
            scripts[name] = state.buffers[name];
          }
        });

        return scripts;
      }

      function buildConfig() {
        const config = parseConfig(state.buffers.config);
        config.scripts = collectScripts();
        config.csconsole = "console";
        return config;
      }

      function runCode() {
        const config = buildConfig();

        if (state.cindy) {
          state.cindy.shutdown();
        }

        state.cindy = CindyJS(config);
      }

      function saveProject() {
        const config = buildConfig();
        saveFile("file.js", "data:attachment/text", inspect(config));
      }

      function clearConsole() {
        if (consoleOutput) {
          consoleOutput.textContent = "";
        }
      }

      function loadProject(file) {
        const reader = new FileReader();
        reader.onload = function (event) {
          const loadedConfig = parseConfig(event.target.result);
          const loadedScripts = loadedConfig.scripts || {};

          bufferNames.forEach(function (name) {
            if (name !== "config") {
              state.buffers[name] = loadedScripts[name] || "";
            }
          });

          delete loadedConfig.scripts;
          state.buffers.config = inspect(loadedConfig).trimStart();
          editor.setValue(state.buffers[state.activeBuffer]);
          saveSession();
          runCode();
        };

        reader.readAsText(file);
      }

      function applyExample(example) {
        bufferNames.forEach(function (name) {
          if (name === "config") {
            return;
          }
          state.buffers[name] = (example.scripts && example.scripts[name]) || "";
        });

        state.buffers.config = example.config;
        state.activeBuffer = "draw";
        editor.setValue(state.buffers[state.activeBuffer]);
        updateTabs();
        saveSession();
        runCode();
      }

      function populateExamples() {
        const groups = {};

        EXAMPLES.forEach(function (example, index) {
          let optgroup = groups[example.group];
          if (!optgroup) {
            optgroup = document.createElement("optgroup");
            optgroup.label = example.group;
            exampleSelect.appendChild(optgroup);
            groups[example.group] = optgroup;
          }

          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = example.label;
          optgroup.appendChild(option);
        });
      }

      function createTabs() {
        state.tabs = bufferNames.map(function (name) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "tab-button";
          button.dataset.buffer = name;
          button.setAttribute("role", "tab");
          button.setAttribute("aria-controls", "editor");
          button.textContent = name;
          button.addEventListener("click", function () {
            activateBuffer(name);
          });
          tabsRoot.appendChild(button);
          return button;
        });

        updateTabs();
      }

      runButton.addEventListener("click", runCode);
      saveButton.addEventListener("click", saveProject);
      docsButton.addEventListener("click", openDocs);
      closeDocsButton.addEventListener("click", closeDocs);
      clearConsoleButton.addEventListener("click", clearConsole);
      docsSearch.addEventListener("input", function () {
        filterDocs(docsSearch.value);
      });
      docsOverlay.addEventListener("click", function (event) {
        if (event.target === docsOverlay) {
          closeDocs();
        }
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && docsOverlay.classList.contains("is-open")) {
          closeDocs();
        }
      });
      inputFile.addEventListener("change", function (event) {
        const file = event.target.files && event.target.files[0];
        if (file) {
          loadProject(file);
        }
        inputFile.value = "";
      });
      exampleSelect.addEventListener("change", function () {
        const index = Number(exampleSelect.value);
        if (!Number.isNaN(index) && EXAMPLES[index]) {
          applyExample(EXAMPLES[index]);
        }
        exampleSelect.selectedIndex = 0;
      });

      createTabs();
      populateExamples();
      applyWorkspaceWidth(workspaceWidthValue);
      state.cindy = CindyJS(parseConfig(state.buffers.config));
      editor.refresh();
      runCode();
    });
  </script>
