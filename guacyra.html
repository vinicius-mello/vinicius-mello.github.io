
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>Prof. Vinícius</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Source+Code+Pro&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/codemirror.css">
  <link rel="stylesheet" href="css/darcula.css">
  <link rel="stylesheet" href="css/show-hint.css">
  <script src="js/codemirror.js"></script>
  <script src="js/lua.js"></script>
  <script src="js/matchbrackets.js"></script>
  <script src="js/closebrackets.js"></script>
  <script src="js/show-hint.js"></script>
  <script src="js/placeholder.js"></script>
  <script src="js/fengari-web.js"></script>
  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://unpkg.com/jquery.terminal@2.37.2/js/jquery.terminal.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/jquery.terminal@2.x.x/css/jquery.terminal.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.11.1/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.11.1/dist/katex.min.js"></script>
<style>
.CodeMirror{
  font-family:'Source Code Pro',monospace;
  font-size:16px
}
.cm-s-darcula.CodeMirror{
  background:#1b120b;
  color:#e7d7bd
}
.terminal {
  --font:'Source Code Pro',monospace;
  --size: 1.15;
  --color: #e7d7bd;
  --background: #1b120b;
}

* {
  box-sizing: border-box;
}

html {
  background:
    radial-gradient(circle at 15% 0%, rgba(224, 164, 88, 0.16), transparent 45%),
    linear-gradient(160deg, #6b4e2f 0%, #4a341e 45%, #2b1d12 100%);
  height: 100%;
}

body {
  max-width: 1100px;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.app-header {
  display: flex;
  align-items: baseline;
  gap: 18px;
  margin-bottom: 16px;
  flex: 0 0 auto;
}

.back-link {
  font-family: 'Michroma', sans-serif;
  font-size: 0.7rem;
  color: rgba(255, 255, 255, 0.65) !important;
  text-decoration: none;
  white-space: nowrap;
}

.back-link:hover {
  color: white !important;
}

.app-header h1 {
  font-family: 'Michroma', sans-serif;
  font-size: 1.5rem;
  margin: 0;
  letter-spacing: 0.03em;
}

.panel {
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
  padding: 14px;
}

.row {
  display: flex;
  gap: 16px;
  flex: 1 1 auto;
  min-height: 0;
}

.column.left {
  flex: 0 0 190px;
  min-height: 0;
}

.column.right {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
}

.column.left .panel,
.column.right .panel {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.panel-label {
  font-family: 'Michroma', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.04em;
  color: rgba(255, 255, 255, 0.65);
  margin-bottom: 8px;
  flex: 0 0 auto;
}

.left ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}

.left .example {
  padding: 5px 9px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.12);
  cursor: pointer;
  font-family: 'Source Code Pro', monospace;
  font-size: 0.8rem;
  flex: 0 0 auto;
  transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
}

.left .example:hover {
  transform: translateX(2px);
  border-color: rgba(224, 164, 88, 0.7);
  background: rgba(255, 255, 255, 0.12);
}

.terminal-pane {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#terminal {
  border-radius: 10px;
  overflow: hidden;
  flex: 1 1 auto;
  min-height: 0;
}

.editor-pane {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  margin-top: 10px;
}

.editor-toggle {
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 0;
}

.editor-toggle .chevron {
  display: inline-block;
  transition: transform 0.15s ease;
  font-size: 0.9em;
}

.editor-pane.collapsed .editor-toggle .chevron {
  transform: rotate(-90deg);
}

.editor-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
  max-height: 220px;
  margin-top: 8px;
  opacity: 1;
  transition: max-height 0.2s ease, opacity 0.15s ease, margin-top 0.2s ease;
}

.editor-pane.collapsed .editor-body {
  max-height: 0;
  opacity: 0;
  margin-top: 0;
}

.run-btn {
  align-self: flex-start;
  font-family: 'Michroma', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.03em;
  color: white;
  background: rgba(224, 164, 88, 0.18);
  border: 1px solid rgba(224, 164, 88, 0.7);
  border-radius: 999px;
  padding: 7px 18px;
  cursor: pointer;
  flex: 0 0 auto;
  transition: background 0.15s ease, transform 0.15s ease;
}

.run-btn:hover {
  background: rgba(224, 164, 88, 0.32);
  transform: translateY(-1px);
}

#editor {
  width: 100%;
}

.editor-pane .CodeMirror {
  height: 180px;
}

.CodeMirror {
  border-radius: 10px;
  border: 1px solid rgba(224, 164, 88, 0.2);
}
</style>
</head>
<body>
  <div class="app-header">
    <a href="index.html" class="back-link">&larr; Prof. Vinícius</a>
    <h1>Guacyra</h1>
  </div>
  <div class="row">
    <div class="column left">
      <div class="panel">
        <div class="panel-label">Examples</div>
        <ul>
          <li class="example" onclick="tt('Expand((x+y)^2)')">Expand</li>
          <li class="example" onclick="tt('Diff(Sin(x)^2, x)')">Diff</li>
          <li class="example" onclick="tt('Integrate(Sin(2*x+1), x)')">Integrate</li>
          <li class="example" onclick="tt('Limit(Sin(x)/x, x, 0)')">Limit</li>
          <li class="example" onclick="tt('Series(Exp(x), x, 0, 4)')">Series</li>
          <li class="example" onclick="tt('Solve(x^2-5*x+6, x)')">Solve</li>
          <li class="example" onclick="tt('Factor(x^3-6*x^2+11*x-6)')">Factor</li>
          <li class="example" onclick="tt('Cancel((x^2-4)/(x-2))')">Cancel</li>
          <li class="example" onclick="tt('N(Pi)')">N(Pi)</li>
          <li class="example" onclick="tt('A=Rand({-2,2},4,4)','A','Det(A)')">Det</li>
          <li class="example" onclick="tt('A=Matrix({2,1},{1,2})','Eigenvalues(A,x)')">Eigenvalues</li>
          <li class="example" onclick="tt('Expand((x+y)^3):tex()')">TeX</li>
        </ul>
      </div>
    </div>
    <div class="column right">
      <div class="panel">
        <div class="terminal-pane">
          <div class="panel-label">REPL</div>
          <div id="terminal"></div>
        </div>
        <div class="editor-pane" id="editorPane">
          <div class="panel-label editor-toggle" onclick="toggleEditor()">
            <span class="chevron">&#9660;</span> Editor
          </div>
          <div class="editor-body">
            <textarea id="editor"></textarea>
            <button class="run-btn" onclick="runCode()">Run</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

<script>
$(function() {
  const luakeywords="and,break,do,else,elseif,end,false,for,function,if,in,local,nil,not,or,repeat,return,then,true,until,while,";
  function runLua(command) {
    let ret;
    let f = false;
    try {
      ret = fengari.load("return tostring("+command+")")();
    } catch(error) {
      f = true;
    }
    if(f) {
      try {
        ret = fengari.load(command)();
      } catch(error) {
        term.echo(error);
      }
    }
    return ret;
  }
  window.term = $('#terminal').terminal(function(command) {
    let ret = runLua(command);
    if(ret!==undefined) this.echo(ret);
  }, {
    greetings: `
 _____
|  __ \\
| |  \\/_   _  __ _  ___ _   _ _ __ __ _
| | __| | | |/ _\` |/ __| | | | '__/ _\` |
| |_\\ \\ |_| | (_| | (__| |_| | | | (_| |
 \\____/\\__,_|\\__,_|\\___|\\__, |_|  \\__,_|
                         __/ |
                        |___/
  Lua 5.3 + Guacyra
  `,
  completion: function(str,cb) {
    let ret=fengari.load("local r=''; for k,v in pairs(guacyra.__symbols) do r=r..','..k end; return r")()
    ret=(luakeywords+ret).split(',').sort();
    return ret.filter((g)=>g.startsWith(str));
  }
  });
  fengari.load("guacyra = require 'guacyra'; ")();
  fengari.load("js = require 'js'")();
  fengari.load("print = function(...) local term = js.global.term; local a={...}; local b = ''; for i=1,#a do if i>1 then b=b..'\\t' end; b = b..tostring(a[i]) end; term:echo(b);  end")();
  window.editor=CodeMirror.fromTextArea(
    $('#editor')[0], {
      mode:"lua",
      theme:"darcula",
      autoCloseBrackets:true,
      lineNumbers:true,
      placeholder: "Lua code goes here..."
    });
  window.runCode = function() {
    let command = editor.getValue();
    runLua(command)
  }
  window.toggleEditor = function() {
    const pane = document.getElementById('editorPane');
    pane.classList.toggle('collapsed');
    if (!pane.classList.contains('collapsed')) {
      setTimeout(() => editor.refresh(), 210);
    }
  }
  window.tt = function(...cmds) {
    var p = Promise.resolve();
    cmds.forEach(cmd =>
      p = p.then(() => term.exec(cmd, {typing: true}))
    );
    return p;
  }
  let complete=function(){CodeMirror.showHint(editor,
    function(){
      const cursor=editor.getCursor()
      const token=editor.getTokenAt(cursor)
      const start=token.start
      const end=cursor.ch
      const line=cursor.line
      const currentWord=token.string
      let ret=fengari.load("local r=''; for k,v in pairs(guacyra.__symbols) do r=r..','..k end; return r")()
      ret=(luakeywords+ret).split(',').sort();const st=ret.filter((g)=>g.startsWith(currentWord));return{list:st,from:CodeMirror.Pos(line,start),to:CodeMirror.Pos(line,end)}
    })
  }
  editor.setOption("extraKeys",
    {
      'Tab':complete,
      'Shift-Enter':function(cm){runCode()}
    })
});
</script>
</html>
