<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rotulador de Cor Media</title>
  <style>
    :root {
      --bg: #f3efe6;
      --panel: #fff9ef;
      --ink: #1f1b16;
      --accent: #1d6e63;
      --accent-soft: #d8efe8;
      --danger: #a93f3f;
      --line: #d7ccbb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, #fff6dc 0, transparent 40%),
        radial-gradient(circle at 80% 0%, #ffe4d5 0, transparent 35%),
        linear-gradient(160deg, #f8f0e2, #efe8d8);
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(31, 27, 22, 0.08);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .toolbar label {
      font-size: 14px;
      font-weight: 700;
    }

    .toolbar input[type="file"] {
      max-width: 290px;
    }

    .toolbar select,
    .toolbar input[type="number"] {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .toolbar input[type="number"] {
      width: 74px;
    }

    .mode-buttons {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    button {
      border: none;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      padding: 9px 12px;
      font-weight: 700;
      font-size: 14px;
      transition: background 120ms ease;
    }

    button:hover {
      background: #f5efe5;
    }

    button.active {
      background: var(--accent);
      color: #fff;
    }

    button.warn.active {
      background: var(--danger);
    }

    .canvas-wrap {
      overflow: auto;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: #fff;
      max-height: 75vh;
    }

    canvas {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
      cursor: crosshair;
    }

    .status {
      font-size: 14px;
      font-weight: 700;
      color: #4f463d;
    }

    .hint {
      margin-top: 6px;
      font-size: 13px;
      color: #665c51;
    }

    .spacer {
      flex: 1;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel toolbar">
      <label for="fileInput">Imagem:</label>
      <input id="fileInput" type="file" accept="image/*" />

      <div class="mode-buttons" role="group" aria-label="Modo de edicao">
        <button id="modeAdd" class="active" type="button" title="Adicionar rotulo">+</button>
        <button id="modeRemove" class="warn" type="button" title="Remover rotulo">-</button>
      </div>

      <label for="labelFormat">Formato:</label>
      <select id="labelFormat" aria-label="Formato do rotulo">
        <option value="tuple" selected>(R,G,B)</option>
        <option value="rgb">rgb(R,G,B)</option>
        <option value="hex">#RRGGBB</option>
        <option value="hsl">hsl(H,S%,L%)</option>
      </select>

      <label for="labelSize">Tamanho:</label>
      <input id="labelSize" type="number" min="10" max="36" step="1" value="16" aria-label="Tamanho do rotulo" />

      <button id="clearLabels" type="button">Limpar rotulos</button>
      <div class="spacer"></div>
      <button id="download" type="button" disabled>Baixar PNG rotulado</button>
    </section>

    <section class="panel">
      <div id="status" class="status">Carregue uma imagem para comecar.</div>
      <div class="hint">
        No modo +, clique na imagem para criar rotulo com a media RGB da vizinhanca 8x8. No modo -, clique em um rotulo para remover.
      </div>
    </section>

    <section class="panel canvas-wrap">
      <canvas id="canvas" width="960" height="540"></canvas>
    </section>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const modeAddBtn = document.getElementById("modeAdd");
    const modeRemoveBtn = document.getElementById("modeRemove");
    const labelFormatSelect = document.getElementById("labelFormat");
    const labelSizeSelect = document.getElementById("labelSize");
    const clearBtn = document.getElementById("clearLabels");
    const downloadBtn = document.getElementById("download");
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let mode = "+";
    let imageLoaded = false;
    let baseImageData = null;
    let labels = [];
    let labelFormat = "tuple";
    let labelFontSize = 16;

    function clampFontSize(value) {
      const raw = Number(value);
      if (Number.isNaN(raw)) {
        return 16;
      }
      return Math.max(10, Math.min(36, Math.round(raw)));
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function setMode(nextMode) {
      mode = nextMode;
      modeAddBtn.classList.toggle("active", mode === "+");
      modeRemoveBtn.classList.toggle("active", mode === "-");
      canvas.style.cursor = mode === "+" ? "crosshair" : "pointer";
      setStatus(mode === "+" ? "Modo +: clique para adicionar rotulo." : "Modo -: clique sobre um rotulo para remover.");
    }

    function rgbToHex(color) {
      const r = color.r.toString(16).padStart(2, "0");
      const g = color.g.toString(16).padStart(2, "0");
      const b = color.b.toString(16).padStart(2, "0");
      return `#${r}${g}${b}`.toUpperCase();
    }

    function rgbToHsl(color) {
      const r = color.r / 255;
      const g = color.g / 255;
      const b = color.b / 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const delta = max - min;

      let h = 0;
      if (delta !== 0) {
        if (max === r) {
          h = ((g - b) / delta) % 6;
        } else if (max === g) {
          h = (b - r) / delta + 2;
        } else {
          h = (r - g) / delta + 4;
        }
      }

      h = Math.round(h * 60);
      if (h < 0) {
        h += 360;
      }

      const l = (max + min) / 2;
      const s = delta === 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
      return {
        h,
        s: Math.round(s * 100),
        l: Math.round(l * 100),
      };
    }

    function srgbToLinear(v) {
      const c = v / 255;
      return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
    }

    function linearToSrgb(v) {
      const c = v <= 0.0031308 ? 12.92 * v : 1.055 * (v ** (1 / 2.4)) - 0.055;
      return Math.max(0, Math.min(1, c));
    }

    function rgbToLab(color) {
      const rLin = srgbToLinear(color.r);
      const gLin = srgbToLinear(color.g);
      const bLin = srgbToLinear(color.b);

      const x = (0.4124564 * rLin + 0.3575761 * gLin + 0.1804375 * bLin) * 100;
      const y = (0.2126729 * rLin + 0.7151522 * gLin + 0.0721750 * bLin) * 100;
      const z = (0.0193339 * rLin + 0.1191920 * gLin + 0.9503041 * bLin) * 100;

      const xn = 95.047;
      const yn = 100.0;
      const zn = 108.883;

      function f(t) {
        const delta = 6 / 29;
        return t > delta ** 3 ? t ** (1 / 3) : (t / (3 * delta ** 2)) + (4 / 29);
      }

      const fx = f(x / xn);
      const fy = f(y / yn);
      const fz = f(z / zn);

      return {
        l: (116 * fy) - 16,
        a: 500 * (fx - fy),
        b: 200 * (fy - fz),
      };
    }

    function labToRgb(lab) {
      const xn = 95.047;
      const yn = 100.0;
      const zn = 108.883;

      const fy = (lab.l + 16) / 116;
      const fx = fy + (lab.a / 500);
      const fz = fy - (lab.b / 200);

      function finv(t) {
        const delta = 6 / 29;
        return t > delta ? t ** 3 : 3 * (delta ** 2) * (t - 4 / 29);
      }

      const x = xn * finv(fx);
      const y = yn * finv(fy);
      const z = zn * finv(fz);

      const xNorm = x / 100;
      const yNorm = y / 100;
      const zNorm = z / 100;

      const rLin = 3.2404542 * xNorm - 1.5371385 * yNorm - 0.4985314 * zNorm;
      const gLin = -0.9692660 * xNorm + 1.8760108 * yNorm + 0.0415560 * zNorm;
      const bLin = 0.0556434 * xNorm - 0.2040259 * yNorm + 1.0572252 * zNorm;

      return {
        r: Math.round(linearToSrgb(rLin) * 255),
        g: Math.round(linearToSrgb(gLin) * 255),
        b: Math.round(linearToSrgb(bLin) * 255),
      };
    }

    function colorToText(color) {
      if (labelFormat === "rgb") {
        return `rgb(${color.r},${color.g},${color.b})`;
      }
      if (labelFormat === "hex") {
        return rgbToHex(color);
      }
      if (labelFormat === "hsl") {
        const hsl = rgbToHsl(color);
        return `hsl(${hsl.h},${hsl.s}%,${hsl.l}%)`;
      }
      return `(${color.r},${color.g},${color.b})`;
    }

    function textContrast(rgb) {
      const lum = 0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b;
      return lum > 150 ? "#000000" : "#ffffff";
    }

    function redraw() {
      if (!baseImageData) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      ctx.putImageData(baseImageData, 0, 0);
      ctx.font = `bold ${labelFontSize}px 'Trebuchet MS', sans-serif`;
      ctx.textBaseline = "top";

      labels.forEach((label) => {
        const text = colorToText(label.color);
        const metrics = ctx.measureText(text);
        const padX = labelFontSize <= 12 ? 4 : 6;
        const padY = labelFontSize <= 12 ? 3 : 4;
        const textWidth = Math.ceil(metrics.width);
        const textHeight = Math.ceil(labelFontSize * 1.1);
        const boxWidth = textWidth + padX * 2;
        const boxHeight = textHeight + padY * 2;
        const x = Math.max(0, Math.min(canvas.width - boxWidth, Math.round(label.x - boxWidth / 2)));
        const y = Math.max(0, Math.min(canvas.height - boxHeight, Math.round(label.y - boxHeight / 2)));

        label.box = {
          x,
          y,
          w: boxWidth,
          h: boxHeight,
        };

        ctx.fillStyle = "rgba(15, 15, 15, 0.55)";
        ctx.fillRect(label.box.x, label.box.y, label.box.w, label.box.h);

        ctx.strokeStyle = "rgba(255,255,255,0.55)";
        ctx.lineWidth = 1;
        ctx.strokeRect(label.box.x + 0.5, label.box.y + 0.5, label.box.w - 1, label.box.h - 1);

        ctx.fillStyle = textContrast(label.color);
        ctx.fillText(text, label.box.x + padX, label.box.y + padY);
      });

      setStatus(`Imagem pronta. Rotulos: ${labels.length}. Modo atual: ${mode}`);
    }

    function loadImageFromFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          ctx.drawImage(img, 0, 0);
          baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          labels = [];
          imageLoaded = true;
          downloadBtn.disabled = false;
          redraw();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function getCanvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = Math.floor((event.clientX - rect.left) * scaleX);
      const y = Math.floor((event.clientY - rect.top) * scaleY);
      return {
        x: Math.max(0, Math.min(canvas.width - 1, x)),
        y: Math.max(0, Math.min(canvas.height - 1, y)),
      };
    }

    function averageColor8x8(px, py) {
      const data = baseImageData.data;
      const windowSize = 8;
      const halfGeometric = 3.5;

      let startX = Math.round(px - halfGeometric);
      let startY = Math.round(py - halfGeometric);

      if (canvas.width > windowSize) {
        startX = Math.max(0, Math.min(canvas.width - windowSize, startX));
      } else {
        startX = 0;
      }

      if (canvas.height > windowSize) {
        startY = Math.max(0, Math.min(canvas.height - windowSize, startY));
      } else {
        startY = 0;
      }

      const endX = Math.min(canvas.width - 1, startX + (windowSize - 1));
      const endY = Math.min(canvas.height - 1, startY + (windowSize - 1));

      let lSum = 0;
      let aSum = 0;
      let bSum = 0;
      let count = 0;

      for (let y = startY; y <= endY; y += 1) {
        for (let x = startX; x <= endX; x += 1) {
          const idx = (y * canvas.width + x) * 4;
          const lab = rgbToLab({
            r: data[idx],
            g: data[idx + 1],
            b: data[idx + 2],
          });
          lSum += lab.l;
          aSum += lab.a;
          bSum += lab.b;
          count += 1;
        }
      }

      const meanLab = {
        l: lSum / count,
        a: aSum / count,
        b: bSum / count,
      };

      return labToRgb(meanLab);
    }

    function findLabelAtPoint(x, y) {
      for (let i = labels.length - 1; i >= 0; i -= 1) {
        const box = labels[i].box;
        if (!box) {
          continue;
        }

        const inside = x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h;
        if (inside) {
          return i;
        }
      }
      return -1;
    }

    fileInput.addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) {
        return;
      }
      loadImageFromFile(file);
    });

    modeAddBtn.addEventListener("click", () => setMode("+"));
    modeRemoveBtn.addEventListener("click", () => setMode("-"));

    labelFormatSelect.addEventListener("change", (event) => {
      labelFormat = event.target.value;
      redraw();
    });

    labelSizeSelect.addEventListener("input", (event) => {
      labelFontSize = clampFontSize(event.target.value);
      redraw();
    });

    labelSizeSelect.addEventListener("change", (event) => {
      labelFontSize = clampFontSize(event.target.value);
      event.target.value = String(labelFontSize);
      redraw();
    });

    clearBtn.addEventListener("click", () => {
      labels = [];
      redraw();
    });

    downloadBtn.addEventListener("click", () => {
      if (!imageLoaded) {
        return;
      }

      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = "imagem_rotulada.png";
      link.click();
    });

    canvas.addEventListener("click", (event) => {
      if (!imageLoaded) {
        setStatus("Carregue uma imagem antes de clicar no canvas.");
        return;
      }

      const { x, y } = getCanvasPoint(event);

      if (mode === "+") {
        const color = averageColor8x8(x, y);
        labels.push({ x, y, color, box: null });
      } else {
        const index = findLabelAtPoint(x, y);
        if (index >= 0) {
          labels.splice(index, 1);
        }
      }

      redraw();
    });

    setMode("+");
  </script>
</body>
</html>
