<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manip — manual</title>
  <meta name="description" content="Manual completo do Manip (manipulação algébrica pelo teclado), em português e inglês.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232462c9'/%3E%3Ctext x='16' y='22' font-family='serif' font-style='italic' font-size='17' text-anchor='middle' fill='white'%3Ex=%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    /* O manual é sempre claro (impressão), independente do tema do app. */
    :root {
      --bg: #ffffff; --panel: #ffffff; --ink: #1d1d22; --muted: #5d5c63; --line: #dcd8cf;
      --accent: #2462c9; color-scheme: light;
    }
    html, body { height: auto; }
    body { display: block; margin: 0 auto; max-width: 820px; padding: 32px 32px 48px; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55; }
    .doc-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
    .doc-head h1 { margin: 0; font: italic 500 28px/1.15 var(--math); }
    .tools { display: flex; gap: 8px; font-size: 14px; }
    .tools a, .tools button { font: inherit; color: var(--muted); text-decoration: none; cursor: pointer; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: none; }
    .tools a.active { color: var(--ink); border-color: var(--accent); }
    .subtitle { margin: 10px 0 8px; color: var(--muted); }
    h2 { margin: 30px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); font-size: 19px; font-weight: 600; break-after: avoid; }
    h2 { margin-top: 36px; }
    td:first-child strong { font-weight: 600; }
    h3 { margin: 22px 0 6px; font-size: 16.5px; font-weight: 600; break-after: avoid; }
    h4 { margin: 16px 0 4px; font-size: 14.5px; font-weight: 600; break-after: avoid; }
    .toc { columns: 2; column-gap: 32px; padding-left: 22px; }
    .toc a { color: inherit; text-decoration: none; }
    a { color: var(--accent); }
    .ops { margin-bottom: 8px; }
    .optable td.k, .keytable td.k { width: 1%; white-space: nowrap; }
    .optable td.name { width: 38%; padding-right: 14px; }
    .optable .formula, .syntax .formula { font-size: 16px; }
    .optable tr, .syntax tr, .keytable tr { break-inside: avoid; }
    table.optable, table.syntax, table.keytable { break-inside: auto; }
    kbd { font: 12px/1 ui-monospace, monospace; padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; margin-right: 3px; }
    p, li { margin: 6px 0; }
    ul { padding-left: 22px; }
    code { font-size: .88em; padding: 1px 5px; border-radius: 5px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .example { margin: 10px 0 14px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; break-inside: avoid; }
    .ex-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ex-line .formula, td .formula { font-size: 19px; line-height: 1.3; }
    .arrow, .or { color: var(--muted); }
    .ex-note { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
    .typed { font-size: 14px; }
    .tabchip { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
    .steps { margin: 6px 0 0; padding-left: 22px; }
    .steps li { margin: 6px 0; }
    table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-size: 14px; break-inside: avoid; }
    th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line); padding: 4px 8px 4px 0; }
    td:first-child code { white-space: nowrap; }
    td { padding: 5px 8px 5px 0; vertical-align: middle; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
    .callout { margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 0 8px 8px 0; break-inside: avoid; }
    .callout p { margin: 0; }
    .foot { margin-top: 28px; font-size: 12px; color: var(--muted); }
    @page { size: A4; margin: 16mm 15mm; }
    @media print {
      body { padding: 0; max-width: none; font-size: 11pt; }
      .tools { display: none; }
    }
  </style>
</head>
<body>
  <header class="doc-head">
    <h1 id="title">Manip</h1>
    <nav class="tools">
      <a href="?lang=pt" data-lang="pt">Português</a>
      <a href="?lang=en" data-lang="en">English</a>
      <button type="button" id="print"></button>
    </nav>
  </header>
  <p class="subtitle" id="subtitle"></p>
  <main id="doc"></main>
  <p class="foot" id="foot"></p>
  <script type="module" src="src/manual.js"></script>
</body>
</html>
