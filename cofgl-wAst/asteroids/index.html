<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Non-Euclidean Spaceship</title>
	<style>
		* {
			-webkit-touch-callout: none;
			-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
			user-select: none;
		}
		body {
			background: #222;
			color: #fff;
			font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
			margin: 0;
			padding: 40px 16px;
		}
		/* room left for the sidebar (240px + gap) and the page padding */
		.game-layout {
			--stage: min(768px, calc(100vw - 320px), calc(100vh - 80px));
			display: flex;
			align-items: center;
			gap: 28px;
		}
		.sidebar {
			flex: 0 0 240px;
			width: 240px;
		}
		.back-link {
			display: block;
			font-size: 13px;
			color: #bbb;
			text-decoration: none;
			margin-bottom: 14px;
		}
		.back-link:hover {
			color: #e0a458;
		}
		h1 {
			margin: 0;
			color: #ddd;
			font-weight: normal;
			font-size: 30px;
			letter-spacing: 0.03em;
		}
		.sidebar p {
			margin: 0;
			font-size: 14px;
		}
		.sidebar p.hint {
			margin-top: 8px;
			font-size: 12px;
			color: #999;
		}
		#geoselector {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 8px;
			margin: 20px 0;
			color: #ddd;
		}
		#geoselector label {
			padding: 6px 14px;
			border-radius: 999px;
			border: 1px solid #444;
			background: rgba(255, 255, 255, 0.05);
			cursor: pointer;
			font-size: 13px;
			transition: border-color 0.15s ease, background 0.15s ease;
		}
		#geoselector label:hover {
			border-color: #e0a458;
		}
		#geoselector input, .toggle input {
			accent-color: #e0a458;
			margin-right: 4px;
		}
		.sidebar p.caption {
			font-size: 13px;
			line-height: 1.45;
			color: #ccc;
			min-height: 5.8em;
		}
		.toggle {
			display: block;
			margin-top: 10px;
			font-size: 13px;
			color: #ddd;
			cursor: pointer;
		}
		.math-link {
			display: inline-block;
			margin-top: 14px;
			font-size: 13px;
			color: #e0a458;
			text-decoration: none;
		}
		.math-link:hover {
			text-decoration: underline;
		}
		/* the WebGL scene with the 2D HUD stacked on top of it */
		.stage {
			position: relative;
			width: var(--stage);
			height: var(--stage);
			flex: 0 0 auto;
			background: #000;
		}
		.stage canvas {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
		}
		#gui {
			touch-action: none;
		}
		.stage .error {
			padding: 20px;
			color: #ddd;
		}
		.stage .error a {
			color: #e0a458;
		}
		/* phones and narrow windows: game on top, controls below */
		@media (max-width: 700px) {
			body {
				padding: 16px;
			}
			.game-layout {
				--stage: min(100vw - 32px, 100vh - 32px);
				flex-direction: column-reverse;
				align-items: flex-start;
			}
			.sidebar {
				flex: none;
				width: auto;
			}
		}
	</style>
	<script type="module" src="js/game.js"></script>
</head>
<body>
<div class="game-layout">
	<div class="sidebar">
		<a href="../../index.html" class="back-link">&larr; Prof. Vinícius</a>
		<h1>Non-Euclidean Spaceship</h1>
		<p>Arrow/WASD keys to fly, SPACE to shoot, P to pause. The ship drifts: to stop, turn around and thrust.</p>
		<p class="hint">On touch screens, drag on the left half to steer and hold the right half to shoot.</p>
		<div id="geoselector">
			<label><input type="radio" name="geometry" value="euclidean" checked> Euclidean</label>
			<label><input type="radio" name="geometry" value="elliptic"> Elliptic</label>
			<label><input type="radio" name="geometry" value="hyperbolic"> Hyperbolic</label>
		</div>
		<p id="geocaption" class="caption"></p>
		<label class="toggle"><input type="checkbox" id="showgluing" checked> Show gluing</label>
		<a href="details.html" class="math-link">The math behind it &rarr;</a>
	</div>
	<div class="stage">
		<canvas id="viewport" width="768" height="768"></canvas>
		<canvas id="gui" width="768" height="768"></canvas>
	</div>
</div>
</body>
</html>
