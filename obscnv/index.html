<script type="module">

function inspect(object, indent) {
  if (indent == null) indent = "";
  switch (typeof(object)) {
  case "undefined":
    return "undefined";
  case "string":
    return "\`" + object + "\`";
  case "object":
    if (object == null) {
      return "null";
    }
    var a = [];
    if (object instanceof Array) {
      for (var i in object) {
        a.push(inspect(object[i], indent));
      }
      return "[" + a.join(", ") + "]";
    } else {
      for (var key in object) {
        if (object.hasOwnProperty(key)) {
          a.push(key + ": " + inspect(object[key], indent + "  "));
        }
      }
      return "\n" + indent + "{\n" + indent + "  " + a.join(",\n" + indent + "  ") + "\n" + indent + "}";
    }
  default:
    return object.toString();
  }
}

function saveFile(name, type, data) {
  if (data !== null && navigator.msSaveBlob) {
    return navigator.msSaveBlob(new Blob([data], { type: type }), name);
  }
  var a = $("<a style='display: none;'/>");
  var url = window.URL.createObjectURL(new Blob([data], { type: type }));
  a.attr("href", url);
  a.attr("download", name);
  $("body").append(a);
  a[0].click();
  window.URL.revokeObjectURL(url);
  a.remove();
}

window.save = function() {
  const ordered = topologicalSortDFS(variableDeps);
  saveFile("file.js", "data:attachment/text", inspect(
    ordered.map(v => variableText[v])
  ));
};

import { Runtime } from "runtime";
import { Inspector } from "inspector";
import * as Inputs from "inputs";
import * as htl from "htl";
import * as Promises from "promises";
import Split from "split";
import * as Generators from "generators";

const GeneratorFunction = function* () {}.constructor;

window.html = htl.html;
window.Inputs = Inputs;
window.Promises = Promises;
window.Generators = Generators;
window.Inspector = Inspector;
window.require = d3.require;

function Handle(x, y) {
  return FreeHandle(x, y);
}

function toFinitePointLike(value) {
  if (value === null || typeof value !== "object") {
    return null;
  }
  const x = Number(value.x);
  const y = Number(value.y);
  if (!Number.isFinite(x) || !Number.isFinite(y)) {
    return null;
  }
  return { x, y };
}

function attachHandleMeta(point, meta) {
  Object.defineProperty(point, "__handleMeta", {
    value: meta,
    enumerable: false,
    configurable: true,
    writable: true
  });
  return point;
}

function FreeHandle(x, y) {
  return {
    x: Number(x),
    y: Number(y)
  };
}

function FixedHandle(x, y) {
  return attachHandleMeta({
    x: Number(x),
    y: Number(y)
  }, {
    kind: "fixed"
  });
}

function SegmentHandle(h1, h2, t = 0.5) {
  const p1 = toFinitePointLike(h1);
  const p2 = toFinitePointLike(h2);
  const ratio = clamp(Number(t), 0, 1);
  if (!p1 || !p2 || !Number.isFinite(ratio)) {
    return { x: NaN, y: NaN };
  }
  return attachHandleMeta({
    x: (1 - ratio) * p1.x + ratio * p2.x,
    y: (1 - ratio) * p1.y + ratio * p2.y
  }, {
    kind: "segment",
    h1: p1,
    h2: p2,
    t: ratio
  });
}

function LineHandle(h1, h2, t = 0.5) {
  const p1 = toFinitePointLike(h1);
  const p2 = toFinitePointLike(h2);
  const ratio = Number(t);
  if (!p1 || !p2 || !Number.isFinite(ratio)) {
    return { x: NaN, y: NaN };
  }
  return attachHandleMeta({
    x: (1 - ratio) * p1.x + ratio * p2.x,
    y: (1 - ratio) * p1.y + ratio * p2.y
  }, {
    kind: "line",
    h1: p1,
    h2: p2,
    t: ratio
  });
}

function CircleHandle(h1, h2, angle = null) {
  const center = toFinitePointLike(h1);
  const boundary = toFinitePointLike(h2);
  if (!center || !boundary) {
    return { x: NaN, y: NaN };
  }
  const dx = boundary.x - center.x;
  const dy = boundary.y - center.y;
  const radius = Math.hypot(dx, dy);
  const theta = angle === null ? Math.atan2(dy, dx) : Number(angle);
  if (!Number.isFinite(radius) || !Number.isFinite(theta)) {
    return { x: NaN, y: NaN };
  }
  return attachHandleMeta({
    x: center.x + radius * Math.cos(theta),
    y: center.y + radius * Math.sin(theta)
  }, {
    kind: "circle",
    h1: center,
    h2: boundary,
    radius,
    angle: theta
  });
}

window.Handle = Handle;
window.FreeHandle = FreeHandle;
window.FixedHandle = FixedHandle;
window.SegmentHandle = SegmentHandle;
window.LineHandle = LineHandle;
window.CircleHandle = CircleHandle;

const interactiveCanvasState = {
  board: null,
  host: null,
  baseCanvas: null,
  baseCtx: null,
  canvas: null,
  ctx: null,
  width: 0,
  height: 0,
  dpr: 1,
  clearMode: "auto",
  drawLayers: new Map(),
  baseRedrawQueued: false,
  handles: new Map(),
  handleSpecs: new Map(),
  activeHandle: null,
  redrawQueued: false,
  resizeObserver: null
};

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function normalizeHandlePoint(value) {
  const point = toFinitePointLike(value);
  if (!point) {
    return null;
  }
  return {
    x: point.x,
    y: point.y,
    meta: value && typeof value === "object" ? value.__handleMeta : null
  };
}

function queueInteractiveRedraw() {
  if (interactiveCanvasState.redrawQueued || !interactiveCanvasState.ctx) {
    return;
  }
  interactiveCanvasState.redrawQueued = true;
  window.requestAnimationFrame(() => {
    interactiveCanvasState.redrawQueued = false;
    drawInteractiveCanvas();
  });
}

function clearMainCanvas() {
  const { baseCtx, width, height } = interactiveCanvasState;
  if (!baseCtx || width <= 0 || height <= 0) {
    return;
  }
  baseCtx.clearRect(0, 0, width, height);
}

function drawMainCanvasLayers() {
  const { baseCtx, baseCanvas, width, height, drawLayers, clearMode } = interactiveCanvasState;
  if (!baseCtx || !baseCanvas || width <= 0 || height <= 0) {
    return;
  }

  if (clearMode === "auto") {
    clearMainCanvas();
  }

  drawLayers.forEach((drawFn, name) => {
    try {
      drawFn(baseCtx, baseCanvas, { width, height, dpr: interactiveCanvasState.dpr });
    } catch (error) {
      console.error(`Canvas2D layer '${name}' failed:`, error);
    }
  });
}

function queueMainCanvasRedraw() {
  if (interactiveCanvasState.baseRedrawQueued || !interactiveCanvasState.baseCtx) {
    return;
  }
  interactiveCanvasState.baseRedrawQueued = true;
  window.requestAnimationFrame(() => {
    interactiveCanvasState.baseRedrawQueued = false;
    drawMainCanvasLayers();
  });
}

function createCanvas2DApi(state) {
  return {
  setClearMode(mode) {
    if (mode !== "auto" && mode !== "manual") {
      throw new Error("Canvas2D.setClearMode aceita apenas 'auto' ou 'manual'.");
    }
    state.clearMode = mode;
    queueMainCanvasRedraw();
  },
  getClearMode() {
    return state.clearMode;
  },
  layer(name, drawFn) {
    if (typeof name !== "string" || !name.trim()) {
      throw new Error("Canvas2D.layer requer um nome de camada.");
    }
    if (typeof drawFn !== "function") {
      throw new Error("Canvas2D.layer requer uma função de desenho.");
    }
    state.drawLayers.set(name, drawFn);
    queueMainCanvasRedraw();
    return name;
  },
  removeLayer(name) {
    if (state.drawLayers.delete(name)) {
      queueMainCanvasRedraw();
    }
  },
  clearLayers() {
    state.drawLayers.clear();
    queueMainCanvasRedraw();
  },
  clear() {
    clearMainCanvas();
  },
  render() {
    queueMainCanvasRedraw();
  }
  };
}

function createCanvas2DPresets(canvasApi) {
  return {
  grid(name = "grid", options = {}) {
    const step = Number.isFinite(Number(options.step)) ? Math.max(8, Number(options.step)) : 24;
    const color = options.color || "rgba(84, 112, 166, 0.18)";
    const lineWidth = Number.isFinite(Number(options.lineWidth)) ? Number(options.lineWidth) : 1;
    return canvasApi.layer(name, (ctx, _canvas, meta) => {
      const width = meta.width;
      const height = meta.height;
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      for (let x = step; x < width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, height);
        ctx.stroke();
      }
      for (let y = step; y < height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(width, y + 0.5);
        ctx.stroke();
      }
    });
  },
  segment(name, p1, p2, options = {}) {
    return canvasApi.layer(name, ctx => {
      if (!p1 || !p2) {
        return;
      }
      const x1 = Number(p1.x);
      const y1 = Number(p1.y);
      const x2 = Number(p2.x);
      const y2 = Number(p2.y);
      if (![x1, y1, x2, y2].every(Number.isFinite)) {
        return;
      }
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = options.color || "#e4572e";
      ctx.lineWidth = Number.isFinite(Number(options.lineWidth)) ? Number(options.lineWidth) : 2;
      ctx.stroke();
    });
  },
  point(name, p, options = {}) {
    return canvasApi.layer(name, ctx => {
      if (!p) {
        return;
      }
      const x = Number(p.x);
      const y = Number(p.y);
      if (!Number.isFinite(x) || !Number.isFinite(y)) {
        return;
      }
      const radius = Number.isFinite(Number(options.radius)) ? Number(options.radius) : 4;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = options.color || "#1f4b75";
      ctx.fill();
    });
  },
  label(name, p, text, options = {}) {
    return canvasApi.layer(name, ctx => {
      if (!p) {
        return;
      }
      const x = Number(p.x);
      const y = Number(p.y);
      if (!Number.isFinite(x) || !Number.isFinite(y)) {
        return;
      }
      ctx.fillStyle = options.color || "#123250";
      ctx.font = options.font || "12px Aptos, Segoe UI, sans-serif";
      ctx.textAlign = options.align || "left";
      ctx.textBaseline = options.baseline || "middle";
      ctx.fillText(String(text), x + (options.offsetX || 8), y + (options.offsetY || 0));
    });
  }
};
}

function installCanvasGlobals() {
  window.Canvas2D = createCanvas2DApi(interactiveCanvasState);
  window.Canvas2DPresets = createCanvas2DPresets(window.Canvas2D);
  window.clearCanvas = function() {
    clearMainCanvas();
  };
  window.drawOnCanvas = function(name, drawFn) {
    return window.Canvas2D.layer(name, drawFn);
  };
}

function drawInteractiveCanvas() {
  const { ctx, width, height, handles, activeHandle } = interactiveCanvasState;
  if (!ctx || width <= 0 || height <= 0) {
    return;
  }

  ctx.clearRect(0, 0, width, height);

  ctx.strokeStyle = "rgba(84, 112, 166, 0.18)";
  ctx.lineWidth = 1;
  const step = 24;
  for (let x = step; x < width; x += step) {
    ctx.beginPath();
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, height);
    ctx.stroke();
  }
  for (let y = step; y < height; y += step) {
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(width, y + 0.5);
    ctx.stroke();
  }

  handles.forEach(handle => {
    const isActive = activeHandle && activeHandle.varName === handle.varName;

    ctx.beginPath();
    ctx.arc(handle.x, handle.y, handle.radius + (isActive ? 3 : 0), 0, Math.PI * 2);
    ctx.fillStyle = isActive ? "rgba(15, 139, 141, 0.30)" : "rgba(22, 50, 79, 0.14)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(handle.x, handle.y, handle.radius, 0, Math.PI * 2);
    ctx.fillStyle = isActive ? "#0f8b8d" : "#1f4b75";
    ctx.fill();

    ctx.fillStyle = "#123250";
    ctx.font = "12px Aptos, Segoe UI, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(handle.varName, handle.x + handle.radius + 6, handle.y);
  });
}

function interactiveCanvasPoint(event) {
  const { canvas, width, height } = interactiveCanvasState;
  if (!canvas) {
    return null;
  }
  const rect = canvas.getBoundingClientRect();
  const x = clamp(event.clientX - rect.left, 0, width);
  const y = clamp(event.clientY - rect.top, 0, height);
  return { x, y };
}

function pickInteractiveHandle(point) {
  const handles = Array.from(interactiveCanvasState.handles.values()).reverse();
  for (const handle of handles) {
    const dx = point.x - handle.x;
    const dy = point.y - handle.y;
    const radius = handle.radius + 4;
    if (dx * dx + dy * dy <= radius * radius) {
      return handle;
    }
  }
  return null;
}

function syncHandleFromValue(varName, value) {
  const point = normalizeHandlePoint(value);
  if (!point) {
    unregisterHandle(varName);
    return;
  }

  const width = Math.max(1, interactiveCanvasState.width);
  const height = Math.max(1, interactiveCanvasState.height);
  const x = clamp(Math.round(point.x), 0, width);
  const y = clamp(Math.round(point.y), 0, height);
  const meta = point.meta || { kind: "free" };
  const kind = meta.kind || "free";
  const draggable = kind !== "fixed";
  const existing = interactiveCanvasState.handles.get(varName);

  if (existing) {
    existing.x = x;
    existing.y = y;
    existing.kind = kind;
    existing.draggable = draggable;
    existing.meta = meta;
  } else {
    interactiveCanvasState.handles.set(varName, {
      varName,
      x,
      y,
      radius: 8,
      kind,
      draggable,
      meta
    });
  }
  queueInteractiveRedraw();
}

function unregisterHandle(varName) {
  if (interactiveCanvasState.activeHandle && interactiveCanvasState.activeHandle.varName === varName) {
    interactiveCanvasState.activeHandle = null;
  }
  if (interactiveCanvasState.handles.delete(varName)) {
    queueInteractiveRedraw();
  }
}

function formatHandleNumber(value) {
  if (!Number.isFinite(value)) {
    return "0";
  }
  const rounded = Number(value.toFixed(6));
  return Number.isInteger(rounded) ? String(rounded) : String(rounded);
}

function projectTOnLine(point, h1, h2) {
  const vx = h2.x - h1.x;
  const vy = h2.y - h1.y;
  const denom = vx * vx + vy * vy;
  if (denom <= 0) {
    return 0;
  }
  return ((point.x - h1.x) * vx + (point.y - h1.y) * vy) / denom;
}

function redefineHandleVariable(varName, source) {
  const dependencies = new Set();
  const compiledSource = source.replaceAll(REACTIVE_REF_REGEX, reactiveName => {
    dependencies.add(reactiveName);
    return "$$" + reactiveName.slice(1);
  });
  const deps = Array.from(dependencies);
  let fn;
  try {
    fn = Function(...deps.map(dep => "$$" + dep.slice(1)), "return " + compiledSource);
  } catch (error) {
    console.error(`Failed to redefine handle '${varName}':`, error);
    return;
  }
  variableText[varName] = `${varName} = ${source}`;
  variableDeps[varName] = deps;
  if (variable[varName] !== undefined) {
    variable[varName].define(varName, deps, fn);
  }
}

function applyHandleDragValue(handle, point) {
  const varName = handle.varName;
  const spec = interactiveCanvasState.handleSpecs.get(varName);
  const kind = handle.kind || "free";

  if (kind === "fixed") {
    return;
  }

  if (!spec) {
    const source = `FreeHandle(${formatHandleNumber(point.x)}, ${formatHandleNumber(point.y)})`;
    redefineHandleVariable(varName, source);
    return;
  }

  if (kind === "free") {
    const source = `FreeHandle(${formatHandleNumber(point.x)}, ${formatHandleNumber(point.y)})`;
    redefineHandleVariable(varName, source);
    return;
  }

  if ((kind === "segment" || kind === "line") && handle.meta && handle.meta.h1 && handle.meta.h2) {
    const h1 = handle.meta.h1;
    const h2 = handle.meta.h2;
    let t = projectTOnLine(point, h1, h2);
    if (kind === "segment") {
      t = clamp(t, 0, 1);
    }
    const source = `${spec.kind}(${spec.args[0]}, ${spec.args[1]}, ${formatHandleNumber(t)})`;
    redefineHandleVariable(varName, source);
    return;
  }

  if (kind === "circle" && handle.meta && handle.meta.h1) {
    const center = handle.meta.h1;
    const angle = Math.atan2(point.y - center.y, point.x - center.x);
    const source = `${spec.kind}(${spec.args[0]}, ${spec.args[1]}, ${formatHandleNumber(angle)})`;
    redefineHandleVariable(varName, source);
    return;
  }

  const fallback = `FreeHandle(${formatHandleNumber(point.x)}, ${formatHandleNumber(point.y)})`;
  redefineHandleVariable(varName, fallback);
}

function onInteractivePointerDown(event) {
  const point = interactiveCanvasPoint(event);
  if (!point) {
    return;
  }
  const handle = pickInteractiveHandle(point);
  if (!handle) {
    return;
  }
  if (!handle.draggable) {
    return;
  }

  interactiveCanvasState.activeHandle = handle;
  if (interactiveCanvasState.canvas && typeof interactiveCanvasState.canvas.setPointerCapture === "function") {
    interactiveCanvasState.canvas.setPointerCapture(event.pointerId);
  }
  queueInteractiveRedraw();
  event.preventDefault();
}

function onInteractivePointerMove(event) {
  const activeHandle = interactiveCanvasState.activeHandle;
  if (!activeHandle) {
    return;
  }

  const point = interactiveCanvasPoint(event);
  if (!point) {
    return;
  }

  const nextX = Math.round(point.x);
  const nextY = Math.round(point.y);
  if (nextX === activeHandle.x && nextY === activeHandle.y) {
    return;
  }

  applyHandleDragValue(activeHandle, { x: nextX, y: nextY });
  queueInteractiveRedraw();
  event.preventDefault();
}

function onInteractivePointerUp() {
  if (!interactiveCanvasState.activeHandle) {
    return;
  }
  interactiveCanvasState.activeHandle = null;
  queueInteractiveRedraw();
}

function resizeInteractiveCanvas() {
  const { host, baseCanvas, baseCtx, canvas, ctx } = interactiveCanvasState;
  if (!host || !baseCanvas || !baseCtx || !canvas || !ctx) {
    return;
  }

  const rect = host.getBoundingClientRect();
  const width = Math.max(120, Math.round(rect.width));
  const height = Math.max(220, Math.round(rect.height));
  const dpr = window.devicePixelRatio || 1;

  interactiveCanvasState.width = width;
  interactiveCanvasState.height = height;
  interactiveCanvasState.dpr = dpr;

  const pixelWidth = Math.round(width * dpr);
  const pixelHeight = Math.round(height * dpr);

  baseCanvas.width = pixelWidth;
  baseCanvas.height = pixelHeight;
  baseCanvas.style.width = `${width}px`;
  baseCanvas.style.height = `${height}px`;
  baseCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  canvas.width = pixelWidth;
  canvas.height = pixelHeight;
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  interactiveCanvasState.handles.forEach(handle => {
    handle.x = clamp(handle.x, 0, width);
    handle.y = clamp(handle.y, 0, height);
  });

  queueMainCanvasRedraw();
  queueInteractiveRedraw();
}

function initInteractiveCanvas() {
  if (interactiveCanvasState.canvas) {
    return;
  }

  const board = document.getElementById("board");
  if (!board) {
    return;
  }

  const host = document.createElement("div");
  host.id = "interactive_canvas_host";
  const baseCanvas = document.createElement("canvas");
  baseCanvas.id = "interactive_canvas";
  const overlayCanvas = document.createElement("canvas");
  overlayCanvas.id = "interactive_canvas_overlay";
  host.appendChild(baseCanvas);
  host.appendChild(overlayCanvas);
  board.appendChild(host);

  interactiveCanvasState.board = board;
  interactiveCanvasState.host = host;
  interactiveCanvasState.baseCanvas = baseCanvas;
  interactiveCanvasState.baseCtx = baseCanvas.getContext("2d");
  interactiveCanvasState.canvas = overlayCanvas;
  interactiveCanvasState.ctx = overlayCanvas.getContext("2d");
  window.canvas = baseCanvas;
  window.ctx = interactiveCanvasState.baseCtx;

  overlayCanvas.addEventListener("pointerdown", onInteractivePointerDown);
  window.addEventListener("pointermove", onInteractivePointerMove);
  window.addEventListener("pointerup", onInteractivePointerUp);
  window.addEventListener("pointercancel", onInteractivePointerUp);

  if ("ResizeObserver" in window) {
    interactiveCanvasState.resizeObserver = new ResizeObserver(() => resizeInteractiveCanvas());
    interactiveCanvasState.resizeObserver.observe(host);
  } else {
    window.addEventListener("resize", resizeInteractiveCanvas);
  }

  resizeInteractiveCanvas();
}

function splitTopLevelArgs(text) {
  const args = [];
  let token = "";
  let depthParen = 0;
  let depthBracket = 0;
  let depthBrace = 0;
  let quote = null;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const prev = i > 0 ? text[i - 1] : "";

    if (quote) {
      token += char;
      if (char === quote && prev !== "\\") {
        quote = null;
      }
      continue;
    }

    if (char === "\"" || char === "'" || char === "`") {
      quote = char;
      token += char;
      continue;
    }

    if (char === "(") {
      depthParen++;
      token += char;
      continue;
    }
    if (char === ")") {
      depthParen--;
      token += char;
      continue;
    }
    if (char === "[") {
      depthBracket++;
      token += char;
      continue;
    }
    if (char === "]") {
      depthBracket--;
      token += char;
      continue;
    }
    if (char === "{") {
      depthBrace++;
      token += char;
      continue;
    }
    if (char === "}") {
      depthBrace--;
      token += char;
      continue;
    }

    if (char === "," && depthParen === 0 && depthBracket === 0 && depthBrace === 0) {
      args.push(token.trim());
      token = "";
      continue;
    }

    token += char;
  }

  if (token.trim()) {
    args.push(token.trim());
  }

  return args;
}

function parseHandleExpression(func) {
  const normalized = func.trim();
  const match = /^(Handle|FreeHandle|FixedHandle|SegmentHandle|LineHandle|CircleHandle)\((.*)\)$/s.exec(normalized);
  if (!match) {
    return null;
  }
  const kindAlias = match[1];
  const kind = kindAlias === "Handle" ? "FreeHandle" : kindAlias;
  const inner = match[2];
  const args = splitTopLevelArgs(inner);
  const valid = {
    FreeHandle: [2],
    FixedHandle: [2],
    SegmentHandle: [2, 3],
    LineHandle: [2, 3],
    CircleHandle: [2, 3]
  };
  const expectedSizes = valid[kind];
  if (!expectedSizes || !expectedSizes.includes(args.length) || args.some(arg => !arg)) {
    return null;
  }
  return {
    kind,
    args
  };
}

const REACTIVE_REF_REGEX = /(@[a-zA-Z]\w*)/gm;
const VARIABLE_ASSIGNMENT_REGEX = /\s*(@[a-zA-Z]\w*)\s*=\s*(\S[\S\s]*)/;
const SOURCE_COMMENT_REGEX = /\/\*[\s\S]*?\*\/|(?<=[^:])\/\/.*|^\/\/.*$/g;

let variableText = {};
let variable = {};
let variableDeps = {};
let runtime;
let module;
let editor;

function stripSourceComments(text) {
  return text.replace(SOURCE_COMMENT_REGEX, "");
}

function parseVariableSource(text) {
  const match = VARIABLE_ASSIGNMENT_REGEX.exec(stripSourceComments(text));
  if (!match) {
    throw new Error("A célula deve estar no formato @nome = expressão.");
  }

  const [, varName, source] = match;
  return {
    varName,
    source: source.trim()
  };
}

function isGeneratorBlockSource(source) {
  return source.startsWith("*{");
}

function isBlockSource(source) {
  return source.startsWith("{");
}

function isViewSource(source) {
  return source.startsWith("valueof ");
}

function createCellFrame(varName) {
  const suffix = varName.slice(1);
  $("#vars").append($("<div class='cell' id='var_" + suffix + "'></div>"));
  $("#var_" + suffix).append($("<div id='insp_" + suffix + "'></div>"));
  $("#var_" + suffix).prepend(
    $("<button class='handle' data-id='" + varName + "'>···</button>").click(function() {
      editorLoad($(this).data("id"));
    })
  );
  return suffix;
}

function wrapInspectorObserver(inspector, options = {}) {
  if (!options.onPending && !options.onFulfilled && !options.onRejected) {
    return inspector;
  }

  return {
    pending(...args) {
      inspector.pending(...args);
      if (options.onPending) {
        options.onPending(...args);
      }
    },
    fulfilled(...args) {
      inspector.fulfilled(...args);
      if (options.onFulfilled) {
        options.onFulfilled(...args);
      }
    },
    rejected(...args) {
      inspector.rejected(...args);
      if (options.onRejected) {
        options.onRejected(...args);
      }
    }
  };
}

function extractDependencies(source) {
  const dependencies = new Set();
  const compiledSource = source.replaceAll(REACTIVE_REF_REGEX, reactiveName => {
    dependencies.add(reactiveName);
    return "$$" + reactiveName.slice(1);
  });
  return { dependencies: Array.from(dependencies), compiledSource };
}

function prepareDefinition(module, varName, observerOptions = {}) {
  const suffix = createCellFrame(varName);
  const inspector = new Inspector($("#insp_" + suffix)[0]);
  const observer = wrapInspectorObserver(inspector, observerOptions);

  return {
    suffix,
    variable: module.variable(observer)
  };
}

function compileFunction(dependencies, body, options = {}) {
  const parameterNames = dependencies.map(dep => "$$" + dep.slice(1));
  const Factory = options.generator ? GeneratorFunction : Function;
  const source = options.returnsExpression ? "return " + body : body;
  return Factory(...parameterNames, source);
}

// Each compileXVariable below does all the (possibly throwing) parsing and
// Function/GeneratorFunction compilation up front, with no DOM or Runtime
// side effects. Only the returned `commit` closure touches the DOM/Runtime,
// and it cannot throw. This means a syntax error in the cell source is
// caught before any existing cell is torn down — see upsertReactiveVariable.

function compileHandleVariable(varName, handleSpec) {
  const { dependencies, compiledSource } = extractDependencies(`${handleSpec.kind}(${handleSpec.args.join(", ")})`);
  const definition = compileFunction(dependencies, compiledSource, { returnsExpression: true });
  return {
    dependencies,
    handleSpec,
    commit(module) {
      const prepared = prepareDefinition(module, varName, {
        onFulfilled(value) {
          syncHandleFromValue(varName, value);
        },
        onRejected() {
          unregisterHandle(varName);
        }
      });
      prepared.variable.define(varName, dependencies, definition);
      return prepared.variable;
    }
  };
}

function compileBlockVariable(varName, source) {
  const isGenerator = isGeneratorBlockSource(source);
  const blockStart = isGenerator ? 2 : 1;
  const blockBody = source.slice(blockStart, source.lastIndexOf("}"));
  const { dependencies, compiledSource } = extractDependencies(blockBody);
  const definition = compileFunction(dependencies, compiledSource, { generator: isGenerator });
  return {
    dependencies,
    commit(module) {
      const prepared = prepareDefinition(module, varName);
      prepared.variable.define(varName, dependencies, definition);
      return prepared.variable;
    }
  };
}

function compileViewVariable(varName, source) {
  const viewSource = source.slice(8);
  const { dependencies, compiledSource } = extractDependencies(viewSource);
  const definition = compileFunction(dependencies, compiledSource, { returnsExpression: true });
  return {
    dependencies,
    commit(module) {
      const prepared = prepareDefinition(module, varName);
      const previousViewVariable = variable[varName + "__view"];

      prepared.variable.define(varName + "__view", dependencies, definition);
      if (previousViewVariable !== undefined) {
        previousViewVariable.delete();
      }
      variable[varName + "__view"] = prepared.variable;

      const inputVariable = module.variable();
      inputVariable.define(varName, [varName + "__view"], view => Generators.input(view));
      return inputVariable;
    }
  };
}

function compileExpressionVariable(varName, source) {
  const { dependencies, compiledSource } = extractDependencies(source);
  const definition = compileFunction(dependencies, compiledSource, { returnsExpression: true });
  return {
    dependencies,
    commit(module) {
      const prepared = prepareDefinition(module, varName);
      prepared.variable.define(varName, dependencies, definition);
      return prepared.variable;
    }
  };
}

function compileReactiveVariable(varName, source) {
  const handleSpec = parseHandleExpression(source);

  if (handleSpec) {
    return compileHandleVariable(varName, handleSpec);
  }
  if (isGeneratorBlockSource(source) || isBlockSource(source)) {
    return compileBlockVariable(varName, source);
  }
  if (isViewSource(source)) {
    return compileViewVariable(varName, source);
  }
  return compileExpressionVariable(varName, source);
}

function clearVariableDom(varName) {
  const suffix = varName.slice(1);
  $("#var_" + suffix).remove();
  $("#var_" + suffix + "__view").remove();
}

function deleteReactiveVariable(varName) {
  clearVariableDom(varName);
  unregisterHandle(varName);
  interactiveCanvasState.handleSpecs.delete(varName);

  if (variable[varName] !== undefined) {
    variable[varName].delete();
  }

  if (variable[varName + "__view"] !== undefined) {
    variable[varName + "__view"].delete();
    delete variable[varName + "__view"];
  }

  delete variable[varName];
  delete variableText[varName];
  delete variableDeps[varName];
  editor.setValue("");
}

function upsertReactiveVariable(module, varName, source) {
  // Compile before touching any state. If this throws (invalid JS in the
  // cell), the previous cell — DOM and Runtime variable alike — is left
  // completely untouched, and the error propagates to the caller.
  const compiled = compileReactiveVariable(varName, source);

  variableText[varName] = `${varName} = ${source}`;
  if (compiled.handleSpec) {
    interactiveCanvasState.handleSpecs.set(varName, compiled.handleSpec);
  } else {
    unregisterHandle(varName);
    interactiveCanvasState.handleSpecs.delete(varName);
  }

  const previousVariable = variable[varName];
  if (previousVariable !== undefined) {
    clearVariableDom(varName);
  }

  variable[varName] = compiled.commit(module);
  variableDeps[varName] = compiled.dependencies;

  if (previousVariable !== undefined) {
    previousVariable.delete();
  }

  return variable[varName];
}

function varFromText(module, text) {
  const { varName, source } = parseVariableSource(text);

  if (source === "undefined") {
    deleteReactiveVariable(varName);
    return undefined;
  }

  variableText[varName] = text;
  return upsertReactiveVariable(module, varName, source);
}

function editorLoad(id) {
  window.editor.session.setValue(variableText[id]);
  window.editor.focus();
}

function topologicalSortDFS(graph) {
  const visited = new Set();
  const recursionStack = new Set();
  const result = [];

  function dfs(node) {
    visited.add(node);
    recursionStack.add(node);

    for (const neighbor of graph[node] || []) {
      if (!visited.has(neighbor)) {
        if (!dfs(neighbor)) {
          return false;
        }
      } else if (recursionStack.has(neighbor)) {
        console.log("Graph contains a cycle!");
        return false;
      }
    }

    recursionStack.delete(node);
    result.push(node);
    return true;
  }

  for (const node in graph) {
    if (!visited.has(node)) {
      if (!dfs(node)) {
        return null;
      }
    }
  }

  return result;
}

$(function() {
  initializeApp();
});

function createRuntimeModule() {
  runtime = new Runtime();
  module = runtime.module();
}

function resetReactiveState() {
  variableText = {};
  variable = {};
  variableDeps = {};
  interactiveCanvasState.drawLayers.clear();
  queueMainCanvasRedraw();
  interactiveCanvasState.handles.clear();
  interactiveCanvasState.handleSpecs.clear();
  interactiveCanvasState.activeHandle = null;
  queueInteractiveRedraw();
  $("#vars").empty();
}

const AUTOSAVE_STORAGE_KEY = "obscnv:autosave:v1";

function persistProgram() {
  try {
    const ordered = topologicalSortDFS(variableDeps) || Object.keys(variableText);
    const cells = ordered.map(v => variableText[v]).filter(cellSource => cellSource !== undefined);
    localStorage.setItem(AUTOSAVE_STORAGE_KEY, JSON.stringify(cells));
  } catch (error) {
    console.warn("Autosave failed:", error);
  }
}

function loadAutosavedProgram() {
  let raw;
  try {
    raw = localStorage.getItem(AUTOSAVE_STORAGE_KEY);
  } catch (error) {
    return false;
  }
  if (!raw) {
    return false;
  }

  let cells;
  try {
    cells = JSON.parse(raw);
  } catch (error) {
    console.warn("Discarding corrupt autosave:", error);
    return false;
  }
  if (!Array.isArray(cells) || cells.length === 0) {
    return false;
  }

  loadProgram(cells);
  return true;
}

function loadProgram(programCells) {
  programCells.forEach(cellSource => varFromText(module, cellSource));
}

function loadProgramFromSerializedText(serializedText) {
  createRuntimeModule();
  resetReactiveState();
  loadProgram(eval("(" + serializedText + ")"));
  persistProgram();
}

function installLayout() {
  const compactLayout = window.matchMedia("(max-width: 960px)").matches;
  const defaultEditorSizes = compactLayout ? [42, 58] : [58, 42];
  const editorPanel = $("#editor_panel");
  const toggleEditorButton = $("#toggle_editor");
  let editorCollapsed = false;
  let expandedEditorSizes = [...defaultEditorSizes];

  Split(["#left", "#right"], compactLayout
    ? { sizes: [36, 64], direction: "vertical", gutterSize: 12 }
    : { sizes: [26, 74], gutterSize: 12 });

  const editorSplit = Split(["#board", "#editor_panel"], {
    sizes: defaultEditorSizes,
    direction: "vertical",
    gutterSize: 12,
    minSize: [60, 0],
    snapOffset: 0,
    onDragEnd(sizes) {
      if (sizes[1] > 12) {
        expandedEditorSizes = [...sizes];
        if (editorCollapsed) {
          editorCollapsed = false;
          editorPanel.removeClass("is-collapsed");
          toggleEditorButton.text("Collapse editor");
        }
      }
    }
  });

  function collapsedEditorSizes() {
    const rightHeight = $("#right").height() || 1;
    const toolbarHeight = $("#toolbar").outerHeight(true) || 40;
    const minPercent = compactLayout ? 8 : 6;
    const toolbarPercent = Math.ceil((toolbarHeight / rightHeight) * 100);
    const editorPercent = Math.max(minPercent, toolbarPercent + 1);
    return [100 - editorPercent, editorPercent];
  }

  window.toggleEditorPanel = function() {
    editorCollapsed = !editorCollapsed;

    if (editorCollapsed) {
      const currentSizes = editorSplit.getSizes();
      if (currentSizes[1] > 12) {
        expandedEditorSizes = [...currentSizes];
      }
      editorPanel.addClass("is-collapsed");
      editorSplit.setSizes(collapsedEditorSizes());
      toggleEditorButton.text("Expand editor");
      return;
    }

    editorPanel.removeClass("is-collapsed");
    editorSplit.setSizes(expandedEditorSizes);
    toggleEditorButton.text("Collapse editor");
    if (window.editor) {
      window.editor.resize();
      window.editor.focus();
    }
  };
}

function getAceLanguageTools() {
  try {
    return ace.require("ace/ext/language_tools");
  } catch (error) {
    console.warn("Ace language tools module not available:", error);
    return null;
  }
}

function createJavaScriptCompleter() {
  const jsKeywordPool = [
    "break", "case", "catch", "class", "const", "continue", "debugger", "default", "delete", "do",
    "else", "export", "extends", "false", "finally", "for", "function", "if", "import", "in",
    "instanceof", "let", "new", "null", "return", "super", "switch", "this", "throw", "true",
    "try", "typeof", "var", "void", "while", "with", "yield", "async", "await", "of"
  ];

  const jsBuiltins = [
    "Array", "Boolean", "Date", "Error", "JSON", "Map", "Math", "Number", "Object", "Promise",
    "RegExp", "Set", "String", "Symbol", "WeakMap", "WeakSet", "console", "document", "window",
    "Inputs", "Promises", "Generators", "Handle", "FreeHandle", "FixedHandle", "SegmentHandle", "LineHandle", "CircleHandle", "Inspector", "html", "require",
    "Canvas2D", "canvas", "ctx", "clearCanvas", "drawOnCanvas"
  ];

  return {
    identifierRegexps: [/[a-zA-Z0-9_\\$]/],
    getCompletions(editorInstance, session, pos, prefix, callback) {
      if (session.getMode().$id !== "ace/mode/javascript") {
        callback(null, []);
        return;
      }

      const variableNames = Object.keys(variableText).map(name => name.startsWith("@") ? name.slice(1) : name);
      const symbols = [...new Set([...jsKeywordPool, ...jsBuiltins, ...variableNames])];
      callback(null, symbols.map(value => ({
        caption: value,
        value,
        meta: jsKeywordPool.includes(value) ? "keyword" : "js",
        score: jsKeywordPool.includes(value) ? 1000 : 800
      })));
    }
  };
}

function configureEditor(editor, languageTools) {
  if (languageTools && typeof languageTools.addCompleter === "function") {
    languageTools.addCompleter(createJavaScriptCompleter());
  }

  editor.setOptions({
    useWorker: false,
    autoScrollEditorIntoView: true,
    minLines: 20,
    copyWithEmptySelection: true,
    behavioursEnabled: true,
    highlightActiveLine: true,
    highlightSelectedWord: true,
    showPrintMargin: false
  });

  if (languageTools) {
    editor.setOptions({
      enableBasicAutocompletion: true,
      enableLiveAutocompletion: true,
      enableSnippets: false
    });
  }

  editor.session.setUseSoftTabs(true);
  editor.session.setTabSize(2);
  editor.session.setMode(new (ace.require("ace/mode/javascript").Mode)());
  editor.session.on("change", () => clearCellError());
}

function installEditorCommands(editor) {
  editor.commands.addCommand({
    name: "updateVar",
    bindKey: { win: "Shift-Enter", mac: "Shift-Enter" },
    exec: () => {
      updateVar();
    }
  });

  editor.commands.addCommand({
    name: "saveFile",
    bindKey: { win: "Ctrl-S", mac: "Command-S" },
    exec: () => {
      save();
    }
  });

  editor.commands.addCommand({
    name: "openFile",
    bindKey: { win: "Ctrl-F", mac: "Command-F" },
    exec: () => {
      document.getElementById("inputFile").click();
    }
  });
}

function installFileLoader() {
  $("#inputFile").change(function onChange(event) {
    const reader = new FileReader();
    reader.onload = loadedEvent => {
      console.log(loadedEvent.target.result);
      loadProgramFromSerializedText(loadedEvent.target.result);
    };
    reader.readAsText(event.target.files[0]);
  });
}

function showCellError(message) {
  const el = document.getElementById("cell_error");
  if (!el) {
    return;
  }
  el.textContent = message;
  el.hidden = false;
}

function clearCellError() {
  const el = document.getElementById("cell_error");
  if (!el || el.hidden) {
    return;
  }
  el.hidden = true;
  el.textContent = "";
}

function installUiActions() {
  window.updateVar = function() {
    try {
      varFromText(module, editor.getValue());
      clearCellError();
      persistProgram();
    } catch (error) {
      showCellError(error.message);
    }
  };

  window.clearEditor = function() {
    editor.setValue("");
    clearCellError();
  };

  window.showDeps = function() {
    console.log(variableDeps);
  };
}

function initializeApp() {
  installLayout();
  createRuntimeModule();
  installCanvasGlobals();

  editor = ace.edit("editor");
  window.editor = editor;

  configureEditor(editor, getAceLanguageTools());
  installUiActions();
  installEditorCommands(editor);
  installFileLoader();

  Sortable.create($("#vars")[0], {
    handle: ".handle"
  });

  initInteractiveCanvas();
  if (!loadAutosavedProgram()) {
    loadProgram(["@a = 100", "@b = valueof Inputs.range([0,100],{step:1})"]);
  }
}
</script>
</html>
