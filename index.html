<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>Prof. Vinícius</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html {
      background:
        radial-gradient(circle at 15% 0%, rgba(224, 164, 88, 0.16), transparent 45%),
        linear-gradient(160deg, #6b4e2f 0%, #4a341e 45%, #2b1d12 100%);
      min-height: 100%;
    }

    body {
      font-family: 'Michroma', sans-serif;
    }

    .home-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: 0.04em;
    }

    .home-email {
      font-family: 'Michroma', sans-serif;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.02em;
    }

    hr {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      margin: 22px 0 34px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    .app-card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 96px;
      padding: 18px;
      text-align: center;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(6px);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .app-card,
    .app-card:link,
    .app-card:visited {
      color: white;
      font-weight: normal;
      font-style: normal;
      text-decoration: none;
    }

    .app-card:hover,
    .app-card:active {
      transform: translateY(-4px);
      border-color: rgba(224, 164, 88, 0.7);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(224, 164, 88, 0.25);
      color: white;
      font-style: normal;
    }

    .app-card span {
      font-size: 0.92rem;
      letter-spacing: 0.03em;
      line-height: 1.4;
    }
  </style>
</head>
<body>
<div class="home-header">
  <h1>Prof. Vinícius</h1>
  <div class="home-email">vinicius.mello@ufba.br</div>
</div>
<hr/>
<div class="app-grid">
  <a class="app-card" href="apl.html"><span>APL.js</span></a>
  <a class="app-card" href="guacyra.html"><span>Guacyra</span></a>
  <a class="app-card" href="cindyjs.html"><span>CindyJS</span></a>
  <a class="app-card" href="rotulador.html"><span>Rotulador de Cores</span></a>
  <a class="app-card" href="marpit.html"><span>Marpit</span></a>
  <a class="app-card" href="cofgl-wAst/asteroids/index.html"><span>Asteroids</span></a>
</div>
</body>
</html>
